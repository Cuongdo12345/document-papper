<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Document Papper</title>
  </head>
  <body>
    <!--
      [FE-30] Chạy TRƯỚC React mount để tránh FOUC (nháy sáng rồi mới chuyển
      tối). Đọc THẲNG key `dp_ui_prefs` (zustand persist, `stores/uiStore.ts`)
      — phải đồng bộ 2 nơi nếu đổi tên key/cấu trúc persist. try/catch vì
      localStorage có thể bị chặn (private mode/policy trình duyệt).
    -->
    <script>
      try {
        var raw = localStorage.getItem("dp_ui_prefs");
        var theme = raw ? JSON.parse(raw)?.state?.theme : null;
        if (theme === "dark") document.documentElement.classList.add("dark");
      } catch (e) {}
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
