  # ================= MEDICAL DEVICE =================
  # ⚠️ GHI CHÚ: route file gốc (`medicalDevice.routes.ts`) chỉ định nghĩa
  # path tương đối "/:assetId/profile" — file `app.ts` (nơi mount prefix)
  # KHÔNG có trong lần cung cấp source này. Prefix `/api/medical-devices`
  # dưới đây là GIẢ ĐỊNH theo đúng quy ước đặt tên đang dùng trong dự án
  # (số nhiều, kebab-case — như `/api/asset-categories`). Vui lòng xác nhận
  # lại đúng prefix thật trong `app.ts` (dòng `app.use("/api/...", ...)`)
  # và báo lại nếu khác, để cập nhật chính xác.
  /api/assets/medical-devices/{assetId}/profile:
    post:
      tags: [Medical Device]
      summary: Gắn profile thiết bị y tế cho 1 Asset đã tồn tại (permission MEDICAL_DEVICE_CREATE)
      description: >
        Yêu cầu Asset phải tồn tại và đang active, và CHƯA có profile nào
        khác gắn vào (unique 1-1) — nếu đã có, dùng PUT để cập nhật thay vì
        gọi lại POST.
      parameters:
        - name: assetId
          in: path
          required: true
          schema: { type: string, pattern: '^[0-9a-fA-F]{24}$' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateMedicalDeviceProfileRequest" }
      responses:
        "201":
          description: Tạo thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  data: { $ref: "#/components/schemas/MedicalDeviceProfile" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    get:
      tags: [Medical Device]
      summary: Xem profile thiết bị y tế theo Asset (permission MEDICAL_DEVICE_VIEW)
      parameters:
        - name: assetId
          in: path
          required: true
          schema: { type: string, pattern: '^[0-9a-fA-F]{24}$' }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  data: { $ref: "#/components/schemas/MedicalDeviceProfile" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: Asset không tồn tại, hoặc Asset chưa có profile thiết bị y tế nào (dùng POST để tạo trước)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
    put:
      tags: [Medical Device]
      summary: Cập nhật profile thiết bị y tế (permission MEDICAL_DEVICE_UPDATE)
      description: >
        Whitelist field ở tầng service — chỉ deviceClass/registrationNumber/
        licenseExpiredAt/requiresCalibration/calibrationIntervalMonths/
        operatorCertificateRequired thực sự có tác dụng.
      parameters:
        - name: assetId
          in: path
          required: true
          schema: { type: string, pattern: '^[0-9a-fA-F]{24}$' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateMedicalDeviceProfileRequest" }
      responses:
        "200":
          description: Cập nhật thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  data: { $ref: "#/components/schemas/MedicalDeviceProfile" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

