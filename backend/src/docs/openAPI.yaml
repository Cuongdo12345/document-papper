  # TASK-002 (docs/tasks/TASK-002.md) — wire lại assignRole() (trước đây dead
  # code) vào 1 endpoint riêng, permission riêng USER_ASSIGN_ROLE (tách khỏi
  # USER_UPDATE, khắc phục ISS-01/SEC-05). assignRole() tự chặn: không cho tự
  # đổi role chính mình, không cho gán role ADMIN, tự invalidate permission
  # cache khi role đổi.
  /api/users/{id}/role:
    patch:
      tags: [Users]
