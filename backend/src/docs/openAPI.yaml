openapi: 3.0.3
info:
  title: Document Manager API
  description: |
    API quản lý giấy tờ , tài sản CNTT

    **Xác thực:** Bearer JWT (access token, thời hạn ngắn) — lấy qua
    `POST /api/auths/login`, làm mới qua `POST /api/auths/refresh-token`.
  version: 1.0.0
  contact:
    name: Document Manager Backend Team

servers:
  - url: http://localhost:3000
    description: Local development

tags:
  - name: Auth
    description: Đăng ký, đăng nhập, refresh token, quên/đặt lại mật khẩu
  - name: Users
    description: Quản lý tài khoản người dùng
  - name: RBAC - Permissions
  - name: RBAC - Roles
  - name: RBAC - Policies
    description: Attribute-Based Access Control (ABAC) — điều kiện động ngoài Role/Permission tĩnh
  - name: Departments
    description: Quản lý khoa/phòng ban
  - name: Documents
    description: Giấy đề xuất (PROPOSAL) và biên bản (REPORT)
  - name: Workflow
    description: Luồng duyệt nhiều bước cho Document
  - name: Assets
    description: Quản lý tài sản CNTT
  - name: Asset Categories
  - name: Asset Assignment
    description: Cấp phát / luân chuyển / thu hồi tài sản
  - name: Medical Device
    description: >
      Profile tuân thủ pháp lý cho thiết bị y tế — mở rộng đồng hành với
      Asset (quan hệ 1-1, KHÔNG phải collection/API tách biệt). Mọi thao
      tác vòng đời khác của thiết bị (CRUD, cấp phát, Excel, QR code...)
      vẫn dùng API Assets sẵn có.
  - name: Dashboard
    description: Thống kê tổng hợp và KPI
  - name: Notifications
  - name: Excel
    description: Import/Export dữ liệu qua file Excel
  - name: Upload
    description: Upload file đính kèm chung
  - name: User Audit
    description: Nhật ký thao tác hệ thống (audit trail)
  - name: Performance
    description: Thống kê hiệu năng API (nội bộ)

security:
  - bearerAuth: []

paths:
  # ================= AUTH =================
  /api/auths/register:
    post:
      tags: [Auth]
      summary: Đăng ký tài khoản mới
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterRequest" }
      responses:
        "201":
          description: Đăng ký thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  user: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /api/auths/login:
    post:
      tags: [Auth]
      summary: Đăng nhập
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: Đăng nhập thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  data: { $ref: "#/components/schemas/AuthLoginResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /api/auths/refresh-token:
    post:
      tags: [Auth]
      summary: Làm mới access token bằng refresh token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RefreshTokenRequest" }
      responses:
        "200":
          description: Access token mới
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessToken: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /api/auths/logout:
    post:
      tags: [Auth]
      summary: Đăng xuất (thu hồi refresh token hiện tại)
      description: >
        ⚠️ Route này KHÔNG có `validateBody` (khác các route auth khác) —
        `refreshToken` được service tự kiểm tra thủ công (không qua Zod),
        vẫn trả 400 nếu thiếu nhưng không có DTO validate format.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RefreshTokenRequest" }
      responses:
        "200":
          description: Đăng xuất thành công
          content:
            application/json:
              schema:
                type: object
                properties: { message: { type: string } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/auths/forgot-password:
    post:
      tags: [Auth]
      summary: Gửi email hướng dẫn đặt lại mật khẩu
      description: >
        Luôn trả về message chung (không tiết lộ username có tồn tại hay
        không — chống user enumeration).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ForgotPasswordRequest" }
      responses:
        "200":
          description: Luôn trả 200 kể cả username không tồn tại
          content:
            application/json:
              schema:
                type: object
                properties: { message: { type: string } }
        "400": { $ref: "#/components/responses/BadRequest" }

  /api/auths/reset-password:
    post:
      tags: [Auth]
      summary: Đặt lại mật khẩu bằng token nhận qua email
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ResetPasswordRequest" }
      responses:
        "200":
          description: Đặt lại mật khẩu thành công
          content:
            application/json:
              schema:
                type: object
                properties: { message: { type: string } }
        "400": { $ref: "#/components/responses/BadRequest" }

  # ================= USERS =================
  /api/users:
    post:
      tags: [Users]
      summary: Tạo user mới (permission USER_CREATE)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateUserRequest" }
      responses:
        "200":
          description: Tạo user thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  data:
                    type: object
                    properties:
                      id: { $ref: "#/components/schemas/ObjectIdRef" }
                      username: { type: string }
                      role: { type: object }
                      department: { type: object }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
    get:
      tags: [Users]
      summary: Danh sách user (permission USER_READ)
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/LimitParam"
        - name: role
          in: query
          schema: { $ref: "#/components/schemas/ObjectIdRef" }
        - name: department
          in: query
          schema: { $ref: "#/components/schemas/ObjectIdRef" }
        - name: isActive
          in: query
          schema: { type: string, enum: ["true", "false"] }
        - $ref: "#/components/parameters/KeywordParam"
        - name: sortBy
          in: query
          schema: { type: string, enum: [createdAt, updatedAt, username, fullName], default: createdAt }
        - $ref: "#/components/parameters/OrderParam"
        - name: fromDate
          in: query
          schema: { type: string, format: date }
        - name: toDate
          in: query
          schema: { type: string, format: date }
      responses:
        "200":
          description: Danh sách user
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: boolean }
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/User" }
                  pagination: { $ref: "#/components/schemas/PaginationMeta" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/users/me:
    get:
      tags: [Users]
      summary: Thông tin cá nhân (user đang đăng nhập)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: string }
                  data: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    patch:
      tags: [Users]
      summary: Cập nhật thông tin cá nhân
      description: >
        ⚠️ Route dùng chung DTO `UpdateUserDTO` ở tầng validate (chấp nhận cả
        role/department/isActive trong body mà không báo lỗi), nhưng tầng
        service (`updateMeService`) chỉ thực sự áp dụng 2 field
        `fullName`/`username` — mọi field khác bị whitelist âm thầm bỏ qua.
        Schema request bên dưới phản ánh đúng field CÓ TÁC DỤNG thật.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateMeRequest" }
      responses:
        "200":
          description: Cập nhật thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  message: { type: string }
                  data: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/users/{id}:
    get:
      tags: [Users]
      summary: Chi tiết user (permission USER_DETAIL)
      parameters: [{ $ref: "#/components/parameters/IdParam" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  data: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [Users]
      summary: Cập nhật user (permission USER_UPDATE)
      parameters: [{ $ref: "#/components/parameters/IdParam" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateUserRequest" }
      responses:
        "200":
          description: Cập nhật thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  data: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Users]
      summary: Vô hiệu hoá user - soft delete (permission USER_DELETE)
      parameters: [{ $ref: "#/components/parameters/IdParam" }]
      responses:
        "200":
          description: Vô hiệu hoá thành công
          content:
            application/json:
              schema:
                type: object
                properties: { message: { type: string } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/users/restore/{id}:
    patch:
      tags: [Users]
      summary: Khôi phục user đã bị vô hiệu hoá (permission USER_RESTORE)
      parameters: [{ $ref: "#/components/parameters/IdParam" }]
      responses:
        "200":
          description: Khôi phục thành công
          content:
            application/json:
              schema:
                type: object
                properties: { message: { type: string } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/users/change-password:
    patch:
      tags: [Users]
      summary: Tự đổi mật khẩu (permission USER_CHANGE_PASSWORD)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChangePasswordRequest" }
      responses:
        "200":
          description: Đổi mật khẩu thành công
          content:
            application/json:
              schema:
                type: object
                properties: { message: { type: string } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/users/reset-password/{id}:
    patch:
      tags: [Users]
      summary: Admin reset mật khẩu cho 1 user (permission USER_RESET_PASSWORD)
      parameters: [{ $ref: "#/components/parameters/IdParam" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ResetPasswordByAdminRequest" }
      responses:
        "200":
          description: Reset mật khẩu thành công
          content:
            application/json:
              schema:
                type: object
                properties: { message: { type: string } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ================= RBAC — PERMISSIONS =================
  /api/rbac/permissions:
    post:
      tags: [RBAC - Permissions]
      summary: Tạo permission mới (permission PERMISSION_CREATE)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreatePermissionRequest" }
      responses:
        "201":
          description: Tạo thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  data: { $ref: "#/components/schemas/Permission" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
    get:
      tags: [RBAC - Permissions]
      summary: Danh sách permission (permission PERMISSION_VIEW)
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/LimitParam"
        - $ref: "#/components/parameters/OrderParam"
        - name: sortBy
          in: query
          schema: { type: string, enum: [createdAt, name, resource, action], default: createdAt }
        - $ref: "#/components/parameters/KeywordParam"
        - name: resource
          in: query
          schema: { type: string, maxLength: 100 }
        - name: action
          in: query
          schema: { type: string, maxLength: 100 }
      responses:
        "200":
          description: Danh sách permission
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Permission" }
                  pagination: { $ref: "#/components/schemas/PaginationMeta" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/rbac/permissions/{id}:
    get:
      tags: [RBAC - Permissions]
      summary: Chi tiết permission (permission PERMISSION_VIEW)
      parameters: [{ $ref: "#/components/parameters/IdParam" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  data: { $ref: "#/components/schemas/Permission" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [RBAC - Permissions]
      summary: Cập nhật permission (permission PERMISSION_UPDATE)
      parameters: [{ $ref: "#/components/parameters/IdParam" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdatePermissionRequest" }
      responses:
        "200":
          description: Cập nhật thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  data: { $ref: "#/components/schemas/Permission" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [RBAC - Permissions]
      summary: Xoá permission (permission PERMISSION_DELETE)
      parameters: [{ $ref: "#/components/parameters/IdParam" }]
      responses:
        "200":
          description: Xoá thành công
          content:
            application/json:
              schema:
                type: object
                properties: { message: { type: string } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ================= RBAC — ROLES =================
  /api/rbac/roles:
    post:
      tags: [RBAC - Roles]
      summary: Tạo role mới (permission ROLE_CREATE)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateRoleRequest" }
      responses:
        "201":
          description: Tạo thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  data: { $ref: "#/components/schemas/Role" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
    get:
      tags: [RBAC - Roles]
      summary: Danh sách role (permission ROLE_VIEW)
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/LimitParam"
        - $ref: "#/components/parameters/OrderParam"
        - name: sortBy
          in: query
          schema: { type: string, enum: [createdAt, name], default: createdAt }
        - $ref: "#/components/parameters/KeywordParam"
      responses:
        "200":
          description: Danh sách role
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Role" }
                  pagination: { $ref: "#/components/schemas/PaginationMeta" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/rbac/roles/{id}:
    get:
      tags: [RBAC - Roles]
      summary: Chi tiết role, kèm populate permissions (permission ROLE_VIEW)
      parameters: [{ $ref: "#/components/parameters/IdParam" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  data: { $ref: "#/components/schemas/Role" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [RBAC - Roles]
      summary: Đổi tên role (permission ROLE_UPDATE). Không đổi permissions ở đây.
      parameters: [{ $ref: "#/components/parameters/IdParam" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateRoleRequest" }
      responses:
        "200":
          description: Cập nhật thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  data: { $ref: "#/components/schemas/Role" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [RBAC - Roles]
      summary: Xoá role (permission ROLE_DELETE)
      parameters: [{ $ref: "#/components/parameters/IdParam" }]
      responses:
        "200":
          description: Xoá thành công
          content:
            application/json:
              schema:
                type: object
                properties: { message: { type: string } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/rbac/roles/{id}/assign-permissions:
    post:
      tags: [RBAC - Roles]
      summary: Gán danh sách permission cho role (permission ROLE_ASSIGN_PERMISSIONS)
      parameters: [{ $ref: "#/components/parameters/IdParam" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AssignPermissionsRequest" }
      responses:
        "200":
          description: Gán thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  data: { $ref: "#/components/schemas/Role" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ================= RBAC — POLICIES (ABAC) =================
  /api/rbac/policies:
    post:
      tags: [RBAC - Policies]
      summary: Tạo policy mới (permission POLICY_CREATE)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreatePolicyRequest" }
      responses:
        "201":
          description: Tạo thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  data: { $ref: "#/components/schemas/Policy" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    get:
      tags: [RBAC - Policies]
      summary: Danh sách policy (permission POLICY_VIEW)
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/LimitParam"
        - $ref: "#/components/parameters/OrderParam"
        - name: sortBy
          in: query
          schema: { type: string, enum: [createdAt, name, resource, action], default: createdAt }
        - $ref: "#/components/parameters/KeywordParam"
