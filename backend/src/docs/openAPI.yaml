                    items: { $ref: "#/components/schemas/ApiPerformanceStat" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/workflows/{id}/complete:
    post:
      tags: [Workflow]
      summary: Đánh dấu workflow đã hoàn tất công việc thực tế (permission WORKFLOW_COMPLETE; chỉ người tạo Document)
      description: >
        KHÁC với "approved": "approved" nghĩa là ĐÃ ĐƯỢC CHO PHÉP thực hiện,
        chưa chắc việc đã làm xong ngoài thực tế (vd chưa mua/nhận hàng).
        "complete" đóng hẳn quy trình sau khi việc thực tế đã xong. Chỉ áp
        dụng được khi workflow đang ở đúng trạng thái `approved`. Cập nhật
        đồng thời `WorkflowInstance.status` và `Document.workflowStatus`
        sang `completed` (bọc trong transaction).
      parameters: [{ $ref: "#/components/parameters/IdParam" }]
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ApproveRejectBody" }
      responses:
        "200":
          description: Đánh dấu hoàn tất thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  message: { type: string }
                  data:
                    allOf:
                      - $ref: "#/components/schemas/WorkflowInstance"
                      - type: object
                        properties:
                          completionComment:
                            type: string
                            nullable: true
                            description: Chỉ trả về trong response — KHÔNG có chỗ lưu cố định trong schema WorkflowInstance hiện tại.
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/workflows/sla/run:
    post:
      tags: [Workflow]
      summary: >-
        Chạy tay kiểm tra nhắc/escalate đề xuất trễ hạn duyệt (permission
        WORKFLOW_SLA_ALERTS_TRIGGER) — Roadmap B1, 2026-09-15
      description: >
        Bình thường chạy tự động qua cron mỗi ngày 08:10 (giờ VN) — endpoint
        này để test/demo thủ công, mirror đúng
        `POST /api/assets/medical-devices/alerts/run`. 2 mức: (1) vừa vượt
        `slaDays` của bước đang pending → nhắc role của bước đó, 1 lần duy
        nhất; (2) vượt ≥ 2 lần `slaDays` mà vẫn chưa xử lý → escalate lên
        ADMIN, 1 lần duy nhất.
      responses:
        "200":
          description: Chạy thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  message: { type: string }
                  data:
                    type: object
                    properties:
                      checked: { type: integer, description: Số bước đang pending và đã vượt slaDays. }
                      reminded: { type: integer, description: Số bước VỪA được gửi nhắc lần đầu trong lần chạy này. }
                      escalated: { type: integer, description: Số bước VỪA được escalate lên ADMIN trong lần chạy này. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        Access token JWT lấy từ `POST /api/auths/login`. Gửi kèm header
        `Authorization: Bearer <accessToken>`.

  parameters:
    IdParam:
      name: id
      in: path
      required: true
      description: MongoDB ObjectId (24 ký tự hex)
      schema:
        type: string
        pattern: "^[0-9a-fA-F]{24}$"
      example: "665f1a2b8c9d3e4f5a6b7c8d"
    PageParam:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    LimitParam:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 10 }
    KeywordParam:
      name: keyword
      in: query
      schema: { type: string, maxLength: 100 }
    OrderParam:
      name: order
      in: query
      schema: { type: string, enum: [asc, desc], default: desc }

  responses:
    BadRequest:
      description: Dữ liệu đầu vào không hợp lệ (lỗi validate Zod)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    Unauthorized:
      description: Chưa đăng nhập / access token không hợp lệ hoặc đã hết hạn
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    Forbidden:
      description: Đã đăng nhập nhưng không đủ quyền (RBAC/ABAC từ chối)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    NotFound:
      description: Không tìm thấy tài nguyên
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    Conflict:
      description: Xung đột dữ liệu (vd trùng mã/tên đã tồn tại)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    TooManyRequests:
      description: Vượt quá giới hạn rate-limit (áp dụng cho nhóm route /api/auths)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }

  schemas:
    # ============================================================
    # COMMON / ENVELOPE
    # ============================================================
    ErrorResponse:
      type: object
      properties:
        success: { type: boolean, example: false }
        message: { type: string, example: "Dữ liệu không hợp lệ" }
        errorCode: { type: string, example: "VALIDATION_ERROR" }
        details:
          type: array
          nullable: true
          items:
            type: object
            properties:
              field: { type: string }
              message: { type: string }

    PaginationMeta:
      type: object
      properties:
        total: { type: integer, example: 42 }
        page: { type: integer, example: 1 }
        limit: { type: integer, example: 10 }
        totalPages: { type: integer, example: 5 }

    ObjectIdRef:
      type: string
      pattern: "^[0-9a-fA-F]{24}$"

    # [MỚI 2026-09-16, DEV-060] Body/response chung cho mọi endpoint
    # "POST .../bulk-delete" (xoá mềm hàng loạt) — 6 domain: Asset,
    # AssetCategory, ConsumableItem, ConsumableCategory, Vendor, User.
    # [MỞ RỘNG 2026-09-17, DEV-061] Dùng chung luôn cho Document
    # (`POST /api/documents/bulk-delete` VÀ `POST /api/documents/bulk-restore`
    # — cùng 1 body `{ids}`, response field `deletedIds` mang nghĩa "id xử lý
    # thành công" chung cho cả 2 hành động).
    BulkDeleteRequest:
      type: object
      required: [ids]
      properties:
        ids:
          type: array
          minItems: 1
          maxItems: 100
          items: { $ref: "#/components/schemas/ObjectIdRef" }
    BulkDeleteResponse:
      type: object
      properties:
        message: { type: string, example: "Đã xoá 2/3 mục" }
        data:
          type: object
          properties:
            deletedIds:
              type: array
              items: { $ref: "#/components/schemas/ObjectIdRef" }
            failed:
              type: array
              items:
                type: object
                properties:
                  id: { $ref: "#/components/schemas/ObjectIdRef" }
                  message: { type: string, example: "Không thể xoá vì vẫn còn tham chiếu" }
      example: "665f1a2b8c9d3e4f5a6b7c8d"

    # ============================================================
    # AUTH
    # ============================================================
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          {
            type: string,
            minLength: 3,
            maxLength: 50,
            pattern: "^[a-zA-Z0-9_]+$",
          }
        password: { type: string, minLength: 5 }

    RegisterRequest:
      type: object
      required: [username, email, password, confirmPassword, fullName]
      properties:
        username:
          {
            type: string,
            minLength: 3,
            maxLength: 50,
            pattern: "^[a-zA-Z0-9_]+$",
          }
        email: { type: string, format: email }
        password: { type: string, minLength: 5 }
        confirmPassword: { type: string, minLength: 5 }
        fullName: { type: string, minLength: 1 }

    RefreshTokenRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken: { type: string }

    ForgotPasswordRequest:
      type: object
      required: [username]
      properties:
        username: { type: string, maxLength: 50 }

    ResetPasswordRequest:
      type: object
      required: [token, newPassword]
      properties:
        token: { type: string }
        newPassword: { type: string, minLength: 5 }

    AuthLoginResult:
      type: object
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
        user: { $ref: "#/components/schemas/User" }

    # Roadmap C1 (Xác thực 2 lớp qua email OTP, DEV-068, 2026-09-19)
    AuthLoginPendingTwoFactor:
      type: object
      description: Trả về thay cho `AuthLoginResult` khi tài khoản đã bật 2FA — CHƯA có token.
      properties:
        requiresTwoFactor: { type: boolean, example: true }
        username: { type: string }

    VerifyLoginOtpRequest:
      type: object
      required: [username, code]
      properties:
        username: { type: string }
        code: { type: string, pattern: "^\\d{6}$", example: "042817" }

    ConfirmTwoFactorRequest:
      type: object
      required: [code]
      properties:
        code: { type: string, pattern: "^\\d{6}$", example: "042817" }

    DisableTwoFactorRequest:
      type: object
      required: [password]
      properties:
        password: { type: string, description: "Mật khẩu HIỆN TẠI của chính user, không phải mật khẩu mới." }

    # Roadmap C2 (Quản lý phiên đăng nhập, DEV-069, 2026-09-19)
    Session:
      type: object
      description: >
        1 `RefreshToken` còn hiệu lực, đã ẩn field `token` (hash) — KHÔNG bao
        giờ trả ra ngoài. `browser`/`os` suy ra từ User-Agent lúc đăng nhập
        (`shared/helpers/userAgent.helper.ts`) — "Không xác định" nếu phiên
        được cấp TRƯỚC khi field này tồn tại.
      properties:
        _id: { $ref: "#/components/schemas/ObjectIdRef" }
        browser: { type: string, example: "Chrome" }
        os: { type: string, example: "Windows" }
        ip: { type: string, nullable: true, example: "113.22.1.45" }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        isCurrent:
          type: boolean
          description: >-
            CHỈ có ở `GET /auths/sessions` (self-service) — heuristic so
            khớp User-Agent+IP của request hiện tại. KHÔNG có ở
            `GET /users/{id}/sessions` (ADMIN xem hộ).
        user:
          description: >-
            [MỚI Roadmap C3, DEV-070] CHỈ có ở `GET /users/sessions` (danh
            sách tổng hợp toàn hệ thống) — user SỞ HỮU phiên, đã populate.
            KHÔNG có ở `GET /auths/sessions`/`GET /users/{id}/sessions` (đã
            biết trước user từ context/param).
          type: object
          nullable: true
          properties:
            _id: { $ref: "#/components/schemas/ObjectIdRef" }
            username: { type: string }
            fullName: { type: string }

    # ============================================================
    # USER
    # ============================================================
    User:
      type: object
      properties:
        _id: { $ref: "#/components/schemas/ObjectIdRef" }
        username: { type: string }
        fullName: { type: string }
        email: { type: string, nullable: true }
        role:
          oneOf:
            - $ref: "#/components/schemas/ObjectIdRef"
            - $ref: "#/components/schemas/Role"
        department:
          oneOf:
            - $ref: "#/components/schemas/ObjectIdRef"
            - $ref: "#/components/schemas/Department"
        extraPermissions:
          type: array
          items: { $ref: "#/components/schemas/ObjectIdRef" }
        denyPermissions:
          type: array
          items: { $ref: "#/components/schemas/ObjectIdRef" }
        isActive: { type: boolean }
        subscribedToWeeklyReport:
          type: boolean
          description: Roadmap B7 (2026-09-18) — xem `UpdateMeRequest`.
        twoFactorEnabled:
          type: boolean
          description: >-
            Roadmap C1 (2026-09-19) — CHỈ tự bật được (self-service) qua
            `POST /api/auths/2fa/enable` + `/confirm`, KHÔNG set trực tiếp qua
            `UpdateUserDTO`/`UpdateMeRequest`.
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    # RBAC MICRO-FIX (GET /users/me, docs/frontend/tasks/FE-00.md Mục 10.1):
    # riêng cho GET /users/me — field `permissions` (effective, đã resolve
    # tên) CHỈ tồn tại ở response của endpoint này (getMeService gọi
    # getCachedPermissions()), KHÔNG áp dụng cho GET /users, GET /users/:id
    # hay bất kỳ endpoint User nào khác — vì vậy KHÔNG thêm field này vào
    # schema `User` dùng chung, tránh gây hiểu lầm các endpoint khác cũng trả
    # field này. `role` ở đây LUÔN là object đã populate (không phải
    # ObjectIdRef) vì getMeService luôn populate role.
    MeResponseUser:
      allOf:
        - $ref: "#/components/schemas/User"
        - type: object
          properties:
            role: { $ref: "#/components/schemas/Role" }
            permissions:
              type: array
              items: { type: string }
              description: >
                Effective permission (role.permissions ∪ extraPermissions −
                denyPermissions), đã resolve thành permission name — nguồn
                CHÍNH để FE xác định quyền thật của user hiện tại. KHÔNG suy
                ra "toàn quyền" cho ADMIN từ field này — ADMIN bypass permission
                check ở tầng middleware (authorizePermission.middleware.ts),
                không phải ở đây; mảng này phản ánh đúng dữ liệu Role/User
                thật trong DB.

    CreateUserRequest:
      type: object
      required: [username, password, fullName, role]
      properties:
        username: { type: string, minLength: 5, pattern: "^[a-zA-Z0-9_]+$" }
        password: { type: string, minLength: 5 }
        fullName: { type: string, minLength: 1 }
        role: { $ref: "#/components/schemas/ObjectIdRef" }
        department: { $ref: "#/components/schemas/ObjectIdRef" }
        email:
          type: string
          format: email
          description: >-
            [MỚI 2026-09-18] Khắc phục gap phát hiện ở DEV-065 (Roadmap B7 Mục
            4) — trước đây KHÔNG có đường nào (kể cả ADMIN) để gán email cho
            user, chỉ luồng tự đăng ký (`RegisterDTO`) mới thu thập email. Tuỳ
            chọn — user vẫn tạo được nếu bỏ trống.

    UpdateUserRequest:
      type: object
      properties:
        fullName: { type: string, minLength: 1 }
        username: { type: string, minLength: 5, pattern: "^[a-zA-Z0-9_]+$" }
        role: { $ref: "#/components/schemas/ObjectIdRef" }
        department: { $ref: "#/components/schemas/ObjectIdRef" }
        isActive: { type: boolean }
        email:
          type: string
          format: email
          description: >-
            [MỚI 2026-09-18] Khắc phục gap DEV-065 Mục 4 — CHỈ có tác dụng qua
            `PUT /api/users/{id}` (ADMIN, permission USER_UPDATE). CỐ TÌNH
            KHÔNG áp dụng qua `PATCH /users/me` (xem `UpdateMeRequest`) — email
            là field nhạy cảm gắn với luồng quên mật khẩu, giữ nguyên chỉ ADMIN
            mới sửa được, giống role/department/isActive.

    UpdateMeRequest:
      type: object
      description: Chỉ 3 field này thực sự có tác dụng khi tự cập nhật (xem mô tả ở endpoint).
      properties:
        fullName: { type: string, minLength: 1 }
        username: { type: string, minLength: 5, pattern: "^[a-zA-Z0-9_]+$" }
        subscribedToWeeklyReport:
          type: boolean
          description: >-
            Roadmap B7 — bật/tắt nhận "Báo cáo tuần" qua email. Chỉ có tác
            dụng THỰC SỰ nếu role của user là BAN_GIAM_DOC/TRUONG_KHOA (cron
            gửi hàng tuần bỏ qua user thuộc role khác dù bật cờ này).

    ChangePasswordRequest:
      type: object
      required: [oldPassword, newPassword, confirmPassword]
      properties:
        oldPassword: { type: string, minLength: 5 }
        newPassword: { type: string, minLength: 5 }
        confirmPassword: { type: string, minLength: 5 }

    ResetPasswordByAdminRequest:
      type: object
      required: [newPassword]
      properties:
        newPassword: { type: string, minLength: 5 }

    # TASK-002 (docs/tasks/TASK-002.md) — endpoint riêng gán role cho user,
    # tách khỏi UpdateUserRequest (PUT /api/users/{id} không còn cho phép đổi
    # role kể từ TASK-001, xem ISS-01).
    AssignRoleRequest:
      type: object
      required: [roleId]
      properties:
        roleId: { $ref: "#/components/schemas/ObjectIdRef" }
        resetPermissions:
          type: boolean
          description: Nếu true, reset extraPermissions/denyPermissions của user về rỗng.

    # ============================================================
    # RBAC — PERMISSION / ROLE / POLICY
    # ============================================================
    Permission:
      type: object
      properties:
        _id: { $ref: "#/components/schemas/ObjectIdRef" }
        name: { type: string, example: "DOCUMENT_VIEW" }
        resource: { type: string, example: "DOCUMENT" }
        action: { type: string, example: "VIEW" }
        description: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    CreatePermissionRequest:
      type: object
      required: [name, resource, action]
      properties:
        name: { type: string, maxLength: 100 }
        resource: { type: string, maxLength: 100 }
        action: { type: string, maxLength: 100 }
        description: { type: string, maxLength: 500 }

    UpdatePermissionRequest:
      type: object
      description: Cần ít nhất 1 field
      properties:
        name: { type: string, maxLength: 100 }
        resource: { type: string, maxLength: 100 }
        action: { type: string, maxLength: 100 }
        description: { type: string, maxLength: 500 }

    Role:
      type: object
      properties:
        _id: { $ref: "#/components/schemas/ObjectIdRef" }
        name: { type: string, example: "IT" }
        permissions:
          type: array
          items:
            oneOf:
              - $ref: "#/components/schemas/ObjectIdRef"
              - $ref: "#/components/schemas/Permission"
        # RBAC MICRO-FIX (GET /users/me, docs/frontend/tasks/FE-00.md Mục 10.1):
        # field CÓ SẴN trên Role model (role.model.ts, default false) — trước
        # đây chưa được document ở đây dù luôn tồn tại trên mọi Role. Thêm vào
        # schema chung (additive, không đổi response thật của bất kỳ endpoint
        # nào) vì đây là field thật của Role, không riêng /users/me.
        isSystemRole: { type: boolean, default: false }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    CreateRoleRequest:
      type: object
      required: [name]
      description: >
        CHỦ Ý chỉ có `name` — không cho gán `permissions` trực tiếp lúc tạo
        (chống mass assignment). Muốn gán permission, dùng
        `POST /api/rbac/roles/{id}/assign-permissions`.
      properties:
        name: { type: string, maxLength: 100 }

    UpdateRoleRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, maxLength: 100 }

    AssignPermissionsRequest:
      type: object
      required: [permissionIds]
      properties:
        permissionIds:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/ObjectIdRef" }

    Policy:
      type: object
      description: >
        Quy tắc ABAC — chỉ được áp dụng khi Role/Permission tĩnh không đủ
        (đánh giá `condition` bằng evaluator tự viết, an toàn, không dùng eval).
      properties:
        _id: { $ref: "#/components/schemas/ObjectIdRef" }
        name: { type: string }
        resource: { type: string }
        action: { type: string }
        condition:
          type: string
          maxLength: 1000
          example: "user.department == resource.department"
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    CreatePolicyRequest:
      type: object
      required: [name, resource, action, condition]
      properties:
        name: { type: string, maxLength: 100 }
        resource: { type: string, maxLength: 100 }
        action: { type: string, maxLength: 100 }
        condition: { type: string, maxLength: 1000 }

    UpdatePolicyRequest:
      type: object
      description: Cần ít nhất 1 field
      properties:
        name: { type: string, maxLength: 100 }
        resource: { type: string, maxLength: 100 }
        action: { type: string, maxLength: 100 }
        condition: { type: string, maxLength: 1000 }

    # ============================================================
    # DEPARTMENT
    # ============================================================
    Department:
      type: object
      properties:
        _id: { $ref: "#/components/schemas/ObjectIdRef" }
        code: { type: string }
        name: { type: string }
        description: { type: string, nullable: true }
        isActive: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    CreateDepartmentRequest:
      type: object
      required: [name, code]
      properties:
        name: { type: string, minLength: 1 }
        code: { type: string, minLength: 1 }
        description: { type: string }

    UpdateDepartmentRequest:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        code: { type: string }
        description: { type: string }
        isActive: { type: boolean }

    # ============================================================
    # DOCUMENT
    # ============================================================
    Document:
      type: object
      properties:
        _id: { $ref: "#/components/schemas/ObjectIdRef" }
        documentCode: { type: string, example: "PR-KVLTL-2026-0121" }
        category: { type: string, enum: [PROPOSAL, REPORT] }
        subType:
          type: string
          enum:
            [
              PROPOSE_REPAIR,
              PROPOSE_INK,
              PROPOSE_PROCUREMENT,
              CHECK_DAMAGE,
              CONFIRM_STATUS,
            ]
          example: "PROPOSE_INK"
          description: >
            Tuỳ theo `category`: PROPOSAL có PROPOSE_INK/PROPOSE_REPAIR...;
            REPORT có CHECK_DAMAGE/CONFIRM_STATUS...
        title: { type: string }
        department:
          oneOf:
            - $ref: "#/components/schemas/ObjectIdRef"
            - $ref: "#/components/schemas/Department"
        createdBy:
          oneOf:
            - $ref: "#/components/schemas/ObjectIdRef"
            - $ref: "#/components/schemas/User"
        referenceTo:
          type: array
          description: Tối đa 1 phần tử — REPORT tham chiếu đúng 1 PROPOSAL
          items: { $ref: "#/components/schemas/ObjectIdRef" }
        relatedAsset:
          $ref: "#/components/schemas/ObjectIdRef"
          nullable: true
        meta:
          type: object
          additionalProperties: true
          description: Cấu trúc động tuỳ theo subType (items, deviceName, quantity, unitPrice...)
        workflowStatus:
          type: string
          enum: [pending, approved, rejected, cancelled, completed]
        isActive: { type: boolean }
        signedBy:
          type: array
          items: { $ref: "#/components/schemas/ObjectIdRef" }
        deletedAt: { type: string, format: date-time, nullable: true }
        deletedBy: { $ref: "#/components/schemas/ObjectIdRef", nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    DocumentVersion:
      type: object
      description: >-
        Roadmap A4 (2026-09-15) — 1 bản ghi lịch sử nội dung ĐÃ BỊ thay thế
        (KHÔNG bao gồm nội dung hiện tại, xem `GET /documents/{id}`).
      properties:
        _id: { $ref: "#/components/schemas/ObjectIdRef" }
        document: { $ref: "#/components/schemas/ObjectIdRef" }
        versionNumber:
          type: integer
          description: 1-based, tăng dần theo thời gian, riêng theo từng document.
        title: { type: string, description: Tiêu đề TẠI thời điểm này (đã bị thay thế). }
        meta:
          type: object
          additionalProperties: true
          description: meta TẠI thời điểm này (đã bị thay thế).
        editedBy:
          description: Người đã tạo ra nội dung này (KHÔNG phải người thay thế nó).
          oneOf:
            - $ref: "#/components/schemas/ObjectIdRef"
            - type: object
              properties:
                _id: { $ref: "#/components/schemas/ObjectIdRef" }
                username: { type: string }
                fullName: { type: string }
        editedAt:
          type: string
          format: date-time
          description: Thời điểm nội dung này được tạo ra.
        createdAt:
          type: string
          format: date-time
          description: Thời điểm bản ghi lịch sử này được lưu (= lúc nội dung bị thay thế).

    CreateDocumentRequest:
      type: object
      required: [category, subType, title, department]
      properties:
        category: { type: string, enum: [PROPOSAL, REPORT] }
        subType:
          {
            type: string,
            enum:
              [
                PROPOSE_REPAIR,
                PROPOSE_INK,
                PROPOSE_PROCUREMENT,
                CHECK_DAMAGE,
                CONFIRM_STATUS,
              ],
          }
        title: { type: string, minLength: 1 }
        department: { $ref: "#/components/schemas/ObjectIdRef" }
        referenceTo:
          type: string
          description: ObjectId của Proposal (chỉ 1 giá trị, bắt buộc với REPORT tham chiếu Proposal)
        meta:
          type: object
          additionalProperties: true
        relatedAsset:
          type: string
          description: Bắt buộc khi subType = PROPOSE_REPAIR

    UpdateDocumentRequest:
      type: object
      description: Cần ít nhất 1 field. CHỈ `title`/`meta` thực sự có tác dụng (whitelist tầng service).
      properties:
        title: { type: string, minLength: 1 }
        meta:
          type: object
          additionalProperties: true

    DeleteByMonthRequest:
      type: object
      required: [month, year]
      properties:
        month: { type: integer, minimum: 1, maximum: 12 }
        year: { type: integer }
        category: { type: string, enum: [PROPOSAL, REPORT] }
        subType:
          {
            type: string,
            enum:
              [
                PROPOSE_REPAIR,
                PROPOSE_INK,
                PROPOSE_PROCUREMENT,
                CHECK_DAMAGE,
                CONFIRM_STATUS,
              ],
          }
        department: { $ref: "#/components/schemas/ObjectIdRef" }

    # ============================================================
    # WORKFLOW
    # ============================================================
    WorkflowStep:
      type: object
      properties:
        stepOrder: { type: integer }
        name: { type: string }
        role: { type: string, description: "Tên Role phải khớp step" }
        slaDays:
          type: integer
          nullable: true
          description: >-
            (Roadmap B1) Số ngày tối đa bước này được phép "pending" trước
            khi hệ thống nhắc người duyệt. Không set thì dùng mặc định hệ
            thống (3 ngày, xem `workflowSlaAlerts.service.ts`).

    WorkflowTemplate:
      type: object
      properties:
        _id: { $ref: "#/components/schemas/ObjectIdRef" }
        name: { type: string }
        steps:
          type: array
          items: { $ref: "#/components/schemas/WorkflowStep" }
        isActive: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    CreateWorkflowTemplateRequest:
      type: object
      required: [name, steps]
      properties:
        name: { type: string, minLength: 1 }
        steps:
          type: array
          minItems: 1
          items:
            type: object
            required: [stepOrder, name, role]
            properties:
              stepOrder: { type: integer, minimum: 0 }
              name: { type: string, minLength: 1 }
              role: { type: string, minLength: 1 }
              slaDays: { type: integer, minimum: 1, nullable: true }
        isActive: { type: boolean }

    WorkflowInstanceStep:
      type: object
      properties:
        stepOrder: { type: integer }
        name: { type: string }
        role: { type: string }
        approvedBy: { $ref: "#/components/schemas/ObjectIdRef", nullable: true }
        status: { type: string, enum: [pending, approved, rejected, cancelled] }
        comment: { type: string, nullable: true }
        approvedAt: { type: string, format: date-time, nullable: true }
        slaDays: { type: integer, nullable: true, description: "(Roadmap B1) copy từ WorkflowTemplate.steps[].slaDays lúc submit." }
        slaReminderSentAt: { type: string, format: date-time, nullable: true }
        slaEscalatedAt: { type: string, format: date-time, nullable: true }

    OverdueApproval:
      type: object
      description: >-
        (Roadmap B1) 1 bước duyệt đang "pending" và ĐÃ VƯỢT slaDays của
        WorkflowInstance đó — dùng cho dashboard "Đề xuất trễ hạn" VÀ kết quả
        `POST /api/workflows/sla/run`.
      properties:
        workflowInstanceId: { $ref: "#/components/schemas/ObjectIdRef" }
        documentId: { $ref: "#/components/schemas/ObjectIdRef" }
        documentTitle: { type: string }
        documentCode: { type: string }
        stepName: { type: string }
        stepRole: { type: string }
        slaDays: { type: integer }
        daysPending: { type: integer, description: "Tổng số ngày đang chờ duyệt ở bước này." }
        daysOverdue: { type: integer, description: "Số ngày VƯỢT quá slaDays (0 = vừa chạm ngưỡng)." }
        stepStartedAt: { type: string, format: date-time }
        reminderSentAt: { type: string, format: date-time, nullable: true }
        escalatedAt: { type: string, format: date-time, nullable: true }

    WorkflowInstance:
      type: object
      properties:
        _id: { $ref: "#/components/schemas/ObjectIdRef" }
        documentId: { $ref: "#/components/schemas/ObjectIdRef" }
        templateId: { $ref: "#/components/schemas/ObjectIdRef" }
        currentStep: { type: integer }
        status:
          {
            type: string,
            enum: [pending, approved, rejected, cancelled, completed],
          }
        steps:
          type: array
          items: { $ref: "#/components/schemas/WorkflowInstanceStep" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    SubmitWorkflowRequest:
      type: object
      required: [documentId, templateId]
      properties:
        documentId: { $ref: "#/components/schemas/ObjectIdRef" }
        templateId: { $ref: "#/components/schemas/ObjectIdRef" }

    ApproveRejectBody:
      type: object
      properties:
        comment: { type: string, maxLength: 1000 }

    # ============================================================
    # ASSET
    # ============================================================
    AssetStatus:
      type: string
      enum: [IN_STOCK, RESERVED, IN_USE, UNDER_MAINTENANCE, DISPOSED]

    Asset:
      type: object
      properties:
        _id: { $ref: "#/components/schemas/ObjectIdRef" }
        assetCode: { type: string }
        name: { type: string }
        category:
          oneOf:
            - $ref: "#/components/schemas/ObjectIdRef"
            - $ref: "#/components/schemas/AssetCategory"
        department:
          oneOf:
            - $ref: "#/components/schemas/ObjectIdRef"
            - $ref: "#/components/schemas/Department"
        assignedTo:
          $ref: "#/components/schemas/ObjectIdRef"
          nullable: true
        status: { $ref: "#/components/schemas/AssetStatus" }
        serialNumber: { type: string, nullable: true }
        model: { type: string, nullable: true }
        manufacturer: { type: string, nullable: true }
        location: { type: string, nullable: true }
        purchaseDate: { type: string, format: date-time, nullable: true }
        purchasePrice: { type: number, nullable: true }
        warrantyExpiredAt: { type: string, format: date-time, nullable: true }
        supplier: { type: string, nullable: true }
        maintenanceStartedAt:
          type: string
          format: date-time
          nullable: true
          description: Set khi chuyển UNDER_MAINTENANCE, xoá khi bảo trì xử lý xong — dùng tính thời gian bảo trì quá hạn.
        warrantyAlertSentAt:
          type: string
          format: date-time
          nullable: true
          description: Lần gần nhất cron đã gửi cảnh báo sắp hết hạn bảo hành cho asset này (chống gửi trùng).
        lastInventoryCheckAt:
          type: string
          format: date-time
          nullable: true
          description: Lần kiểm kê (quét QR check-in) gần nhất.
        lastInventoryCheckBy:
          { $ref: "#/components/schemas/ObjectIdRef", nullable: true }
        specs:
          type: object
          additionalProperties: true
        isActive: { type: boolean }
        createdBy: { $ref: "#/components/schemas/ObjectIdRef", nullable: true }
        updatedBy: { $ref: "#/components/schemas/ObjectIdRef", nullable: true }
        deletedAt: { type: string, format: date-time, nullable: true }
        deletedBy: { $ref: "#/components/schemas/ObjectIdRef", nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    CreateAssetRequest:
      type: object
      required: [category, department, name]
      properties:
        category: { $ref: "#/components/schemas/ObjectIdRef" }
        department: { $ref: "#/components/schemas/ObjectIdRef" }
        name: { type: string, minLength: 1 }
        serialNumber: { type: string }
        model: { type: string }
        manufacturer: { type: string }
        location: { type: string }
        purchaseDate: { type: string, format: date }
        purchasePrice: { type: number, minimum: 0 }
        warrantyExpiredAt: { type: string, format: date }
        supplier: { type: string }
        specs:
          type: object
          additionalProperties: true

    UpdateAssetRequest:
      type: object
      description: >
        CHỦ Ý không cho sửa status/assignedTo/department qua route này —
        phải qua endpoint assign/transfer/return riêng.
      properties:
        category: { $ref: "#/components/schemas/ObjectIdRef" }
        name: { type: string, minLength: 1 }
        serialNumber: { type: string }
        model: { type: string }
        manufacturer: { type: string }
        location: { type: string }
        purchaseDate: { type: string, format: date }
        purchasePrice: { type: number, minimum: 0 }
        warrantyExpiredAt: { type: string, format: date }
        supplier: { type: string }
        specs:
          type: object
          additionalProperties: true
        isActive: { type: boolean }

    AssetCategory:
      type: object
      properties:
        _id: { $ref: "#/components/schemas/ObjectIdRef" }
        code: { type: string }
        name: { type: string }
        parentCategory:
          nullable: true
          description: >
            [SỬA — trước đây tài liệu sai là ObjectId thô] `GET /` và
            `GET /:id` LUÔN populate lite (`.populate("parentCategory","code
            name")`, xem `assetCategory.service.ts`) — object, không phải
            string ID. Chỉ là ObjectId thô khi gửi ở request body (tạo/sửa,
            xem `CreateAssetCategoryRequest`/`UpdateAssetCategoryRequest`).
          oneOf:
            - $ref: "#/components/schemas/ObjectIdRef"
            - type: object
              properties:
                _id: { $ref: "#/components/schemas/ObjectIdRef" }
                code: { type: string }
                name: { type: string }
        defaultWarrantyMonths: { type: integer, nullable: true }
        isActive: { type: boolean }
        deletedAt: { type: string, format: date-time, nullable: true }
        deletedBy: { $ref: "#/components/schemas/ObjectIdRef", nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    CreateAssetCategoryRequest:
      type: object
      required: [code, name]
      properties:
        code: { type: string, minLength: 1 }
        name: { type: string, minLength: 1 }
        parentCategory: { $ref: "#/components/schemas/ObjectIdRef" }
        defaultWarrantyMonths: { type: integer, minimum: 0 }

    UpdateAssetCategoryRequest:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        parentCategory: { $ref: "#/components/schemas/ObjectIdRef" }
        defaultWarrantyMonths: { type: integer, minimum: 0 }
        isActive: { type: boolean }

    AssignAssetRequest:
      type: object
      required: [toDepartment]
      properties:
        toDepartment: { $ref: "#/components/schemas/ObjectIdRef" }
        toUser: { $ref: "#/components/schemas/ObjectIdRef" }
        reason: { type: string }

    TransferAssetRequest:
      type: object
      description: Phải cung cấp ít nhất 1 trong 2 field toDepartment/toUser
      properties:
        toDepartment: { $ref: "#/components/schemas/ObjectIdRef" }
        toUser:
          type: string
          description: 'Truyền ObjectId để đổi user, hoặc chuỗi rỗng "" để chủ ý gỡ user hiện tại'
        reason: { type: string }

    ReturnAssetRequest:
      type: object
      properties:
        toDepartment: { $ref: "#/components/schemas/ObjectIdRef" }
        reason: { type: string }

    MedicalDeviceClass:
      type: string
      enum: [A, B, C, D]
      description: >
        Phân loại rủi ro thiết bị y tế (A: thấp → D: cao). ⚠️ Số hiệu văn
        bản pháp lý làm căn cứ phân loại lấy từ kiến thức chung của hệ
        thống, CHƯA được xác minh lại — cần bộ phận vật tư y tế/pháp lý xác
        nhận trước khi dùng làm căn cứ tuân thủ thật.

    MedicalDeviceProfile:
      type: object
      properties:
        _id: { $ref: "#/components/schemas/ObjectIdRef" }
        asset:
          description: Quan hệ 1-1 với Asset — unique index trên field này.
          oneOf:
            - $ref: "#/components/schemas/ObjectIdRef"
            - $ref: "#/components/schemas/Asset"
        deviceClass: { $ref: "#/components/schemas/MedicalDeviceClass" }
        registrationNumber:
          {
            type: string,
            nullable: true,
            description: Số đăng ký lưu hành do Bộ Y tế cấp,
          }
        licenseExpiredAt: { type: string, format: date-time, nullable: true }
        requiresCalibration: { type: boolean, default: false }
        calibrationIntervalMonths: { type: integer, nullable: true, minimum: 1 }
        lastCalibrationDate: { type: string, format: date-time, nullable: true }
        nextCalibrationDueDate:
          { type: string, format: date-time, nullable: true }
        calibrationAlertSentAt:
          type: string
          format: date-time
          nullable: true
          description: Chỉ server set (chống gửi trùng cảnh báo kiểm định) — không expose qua request body.
        operatorCertificateRequired: { type: boolean, default: false }
        createdBy: { $ref: "#/components/schemas/ObjectIdRef", nullable: true }
        updatedBy: { $ref: "#/components/schemas/ObjectIdRef", nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    CreateMedicalDeviceProfileRequest:
      type: object
      required: [deviceClass]
      description: >
        Nếu `requiresCalibration = true` thì `calibrationIntervalMonths`
        bắt buộc (validate ở service, không phải Zod — ràng buộc phụ thuộc
        giá trị field khác).
      properties:
        deviceClass: { $ref: "#/components/schemas/MedicalDeviceClass" }
        registrationNumber: { type: string }
        licenseExpiredAt: { type: string, format: date }
        requiresCalibration: { type: boolean, default: false }
        calibrationIntervalMonths: { type: integer, minimum: 1 }
        operatorCertificateRequired: { type: boolean, default: false }

    UpdateMedicalDeviceProfileRequest:
      type: object
      description: >
        Không có `lastCalibrationDate`/`nextCalibrationDueDate`/
        `calibrationAlertSentAt` — các field này CHỈ đổi qua hành động
        "ghi nhận kiểm định mới" (`POST /{assetId}/calibration-records`,
        xem bên dưới), không cho client tự PATCH thẳng qua route này.
      properties:
        deviceClass: { $ref: "#/components/schemas/MedicalDeviceClass" }
        registrationNumber: { type: string }
        licenseExpiredAt: { type: string, format: date }
        requiresCalibration: { type: boolean }
        calibrationIntervalMonths: { type: integer, minimum: 1 }
        operatorCertificateRequired: { type: boolean }

    AssetMaintenancePlan:
      type: object
      description: Roadmap B2 (2026-09-15) — kế hoạch bảo trì CHỦ ĐỘNG, độc lập với luồng PROPOSE_REPAIR phản ứng.
      properties:
        _id: { $ref: "#/components/schemas/ObjectIdRef" }
        asset:
          oneOf:
            - $ref: "#/components/schemas/ObjectIdRef"
            - type: object
              properties:
                _id: { $ref: "#/components/schemas/ObjectIdRef" }
                assetCode: { type: string }
                name: { type: string }
                department:
                  type: object
                  properties:
                    _id: { $ref: "#/components/schemas/ObjectIdRef" }
                    code: { type: string }
                    name: { type: string }
          description: ObjectId thô ở hầu hết response, populate đầy đủ ở GET /calendar.
        title: { type: string }
        description: { type: string, nullable: true }
        scheduledDate: { type: string, format: date-time }
        status: { type: string, enum: [planned, completed, cancelled] }
        isOverdue:
          type: boolean
          description: TÍNH THÊM (không lưu DB) — status=planned VÀ scheduledDate đã qua.
        completedAt: { type: string, format: date-time, nullable: true }
        completedBy:
          nullable: true
          oneOf:
            - $ref: "#/components/schemas/ObjectIdRef"
            - type: object
              properties:
                _id: { $ref: "#/components/schemas/ObjectIdRef" }
                username: { type: string }
                fullName: { type: string }
        cancelledAt: { type: string, format: date-time, nullable: true }
        cancelledBy:
          nullable: true
          oneOf:
            - $ref: "#/components/schemas/ObjectIdRef"
            - type: object
              properties:
                _id: { $ref: "#/components/schemas/ObjectIdRef" }
                username: { type: string }
                fullName: { type: string }
        resolutionNote: { type: string, nullable: true }
        createdBy:
          oneOf:
            - $ref: "#/components/schemas/ObjectIdRef"
            - type: object
              properties:
                _id: { $ref: "#/components/schemas/ObjectIdRef" }
                username: { type: string }
                fullName: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    ConsumableItem:
      type: object
      description: >
        Roadmap B3 (2026-09-15) — vật tư tiêu hao, tồn kho theo TỪNG khoa/
        phòng ban (KHÔNG phải kho tổng chung). Module MỚI, độc lập hoàn toàn
        với Asset (tài sản cố định).
      properties:
        _id: { $ref: "#/components/schemas/ObjectIdRef" }
        name: { type: string }
        unit: { type: string, description: "Đơn vị tính: cái, hộp, gói, chai..." }
        category:
          nullable: true
          description: >
            [SỬA 2026-09-16 — trước là text tự do] Ref `ConsumableCategory`.
            `GET /` và `GET /:id` LUÔN populate lite (`.populate("category",
            "code name")`) — object, không phải string ID. Chỉ là ObjectId
            thô khi gửi ở request body (tạo/sửa).
          oneOf:
            - $ref: "#/components/schemas/ObjectIdRef"
            - type: object
              properties:
                _id: { $ref: "#/components/schemas/ObjectIdRef" }
                code: { type: string }
                name: { type: string }
        department:
          oneOf:
            - $ref: "#/components/schemas/ObjectIdRef"
            - type: object
              properties:
                _id: { $ref: "#/components/schemas/ObjectIdRef" }
                code: { type: string }
                name: { type: string }
        quantityOnHand:
          type: number
          description: Running balance — luôn khớp SUM(transactions) của item này.
        minStockThreshold: { type: number }
        isLowStock:
          type: boolean
          description: TÍNH THÊM (không lưu DB) — isActive VÀ quantityOnHand ≤ minStockThreshold.
        lowStockAlertSentAt: { type: string, format: date-time, nullable: true }
        isActive: { type: boolean }
        createdBy:
          oneOf:
            - $ref: "#/components/schemas/ObjectIdRef"
            - type: object
              properties:
                _id: { $ref: "#/components/schemas/ObjectIdRef" }
                username: { type: string }
                fullName: { type: string }
        updatedBy:
          nullable: true
          oneOf:
            - $ref: "#/components/schemas/ObjectIdRef"
            - type: object
              properties:
                _id: { $ref: "#/components/schemas/ObjectIdRef" }
                username: { type: string }
                fullName: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    ConsumableTransaction:
      type: object
      description: >
        Roadmap B3 (2026-09-15) — 1 giao dịch nhập/xuất kho, BẤT BIẾN sau khi
        tạo (không có update/delete endpoint nào).
      properties:
        _id: { $ref: "#/components/schemas/ObjectIdRef" }
        consumableItem: { $ref: "#/components/schemas/ObjectIdRef" }
        type: { type: string, enum: [IN, OUT] }
        quantity: { type: number, description: "Luôn > 0 — dấu +/- được suy ra từ `type`." }
        balanceAfter:
          type: number
          description: quantityOnHand của item NGAY SAU giao dịch này (snapshot, không cần tính lại).
        reason: { type: string, nullable: true }
        performedBy:
          oneOf:
            - $ref: "#/components/schemas/ObjectIdRef"
            - type: object
              properties:
                _id: { $ref: "#/components/schemas/ObjectIdRef" }
                username: { type: string }
                fullName: { type: string }
        createdAt: { type: string, format: date-time }

    ConsumableCategory:
      type: object
      description: >
        Nhóm vật tư tiêu hao (2026-09-16) — CÓ phân cấp cha/con
        (`parentCategory`), mirror `AssetCategory`. KHÔNG có endpoint xoá
        vĩnh viễn (khác AssetCategory) — xem `consumableCategory.service.ts`.
      properties:
        _id: { $ref: "#/components/schemas/ObjectIdRef" }
        code: { type: string }
        name: { type: string }
        parentCategory:
          nullable: true
          description: >
            `GET /` và `GET /:id` LUÔN populate lite (`.populate("parentCategory",
            "code name")`) — object, không phải string ID. Chỉ là ObjectId
            thô khi gửi ở request body.
          oneOf:
            - $ref: "#/components/schemas/ObjectIdRef"
            - type: object
              properties:
                _id: { $ref: "#/components/schemas/ObjectIdRef" }
                code: { type: string }
                name: { type: string }
        isActive: { type: boolean }
        deletedAt: { type: string, format: date-time, nullable: true }
        deletedBy: { $ref: "#/components/schemas/ObjectIdRef", nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    CreateConsumableCategoryRequest:
      type: object
      required: [code, name]
      properties:
        code: { type: string, minLength: 1 }
        name: { type: string, minLength: 1 }
        parentCategory: { $ref: "#/components/schemas/ObjectIdRef" }

    UpdateConsumableCategoryRequest:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        parentCategory: { $ref: "#/components/schemas/ObjectIdRef" }

    ConsumableRequestItem:
      type: object
      description: 1 dòng vật tư trong đề xuất — `totalPrice` do BACKEND tự tính (`quantity * unitPrice`), không nhận từ client.
      properties:
        consumableItem:
          description: "`GET /requests`/`GET /requests/:id` LUÔN populate lite (`.populate(\"items.consumableItem\", \"name unit\")`) — object, không phải string ID. Chỉ là ObjectId thô khi gửi ở request body."
          oneOf:
            - $ref: "#/components/schemas/ObjectIdRef"
            - type: object
              properties:
                _id: { $ref: "#/components/schemas/ObjectIdRef" }
                name: { type: string }
                unit: { type: string }
        quantity: { type: number, minimum: 0.01 }
        unitPrice: { type: number, minimum: 0 }
        totalPrice: { type: number, minimum: 0, description: "TÍNH SẴN ở backend = quantity * unitPrice." }

    ConsumableRequest:
      type: object
      description: >
        Roadmap B8 (Dự trù/đề xuất mua vật tư tiêu hao hàng tháng, DEV-067,
        2026-09-18) — module MỚI, TÁCH BIỆT hoàn toàn với ConsumableItem/
        ConsumableTransaction. KHÔNG có luồng duyệt — trạng thái RIÊNG
        (PENDING/FULFILLED/CANCELLED), không đi qua Workflow engine.
      properties:
        _id: { $ref: "#/components/schemas/ObjectIdRef" }
        department:
          description: "LUÔN populate lite (`.populate(\"department\", \"code name\")`) khi đọc — object, không phải string ID. Chỉ là ObjectId thô khi gửi ở request body."
          oneOf:
            - $ref: "#/components/schemas/ObjectIdRef"
            - type: object
              properties:
                _id: { $ref: "#/components/schemas/ObjectIdRef" }
                code: { type: string }
                name: { type: string }
        requestMonth: { type: string, pattern: "^\\d{4}-(0[1-9]|1[0-2])$", description: "Tháng dự trù, định dạng YYYY-MM." }
        items:
          type: array
          items: { $ref: "#/components/schemas/ConsumableRequestItem" }
        totalAmount: { type: number, minimum: 0, description: "TÍNH SẴN ở backend = SUM(items[].totalPrice)." }
        status: { type: string, enum: [PENDING, FULFILLED, CANCELLED] }
        note: { type: string, nullable: true }
        createdBy:
          oneOf:
            - $ref: "#/components/schemas/ObjectIdRef"
            - type: object
              properties:
                _id: { $ref: "#/components/schemas/ObjectIdRef" }
                username: { type: string }
                fullName: { type: string }
        updatedBy:
          nullable: true
          oneOf:
            - $ref: "#/components/schemas/ObjectIdRef"
            - type: object
              properties:
                _id: { $ref: "#/components/schemas/ObjectIdRef" }
                username: { type: string }
                fullName: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    ConsumableRequestItemInput:
      type: object
      required: [consumableItem, quantity, unitPrice]
      properties:
        consumableItem: { $ref: "#/components/schemas/ObjectIdRef" }
        quantity: { type: number, minimum: 0.01 }
        unitPrice: { type: number, minimum: 0 }

    CreateConsumableRequestRequest:
      type: object
      required: [department, requestMonth, items]
      properties:
        department: { $ref: "#/components/schemas/ObjectIdRef" }
        requestMonth: { type: string, pattern: "^\\d{4}-(0[1-9]|1[0-2])$" }
        items:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/ConsumableRequestItemInput" }
        note: { type: string }

    UpdateConsumableRequestRequest:
      type: object
      description: CHỦ Ý KHÔNG có `department`/`requestMonth` (bất biến sau khi tạo) — chỉ sửa `items`/`note`, và CHỈ khi đề xuất đang `PENDING`.
      properties:
        items:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/ConsumableRequestItemInput" }
        note: { type: string }

    Vendor:
      type: object
      description: Roadmap B4 (2026-09-16) — nhà cung cấp/đơn vị ký hợp đồng bảo trì/bảo hành thiết bị.
      properties:
        _id: { $ref: "#/components/schemas/ObjectIdRef" }
        name: { type: string }
        contactPerson: { type: string, nullable: true }
        phone: { type: string, nullable: true }
        email: { type: string, nullable: true }
        address: { type: string, nullable: true }
        taxCode: { type: string, nullable: true }
        notes: { type: string, nullable: true }
        isActive: { type: boolean, description: "false = ngừng hợp tác, không xoá cứng." }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    Contract:
      type: object
      description: >
        Roadmap B4 (2026-09-16) — hợp đồng bảo trì/bảo hành ký với 1 Vendor,
        áp dụng cho nhiều Asset cùng lúc.
      properties:
        _id: { $ref: "#/components/schemas/ObjectIdRef" }
        vendor:
          oneOf:
            - $ref: "#/components/schemas/ObjectIdRef"
            - type: object
              properties:
                _id: { $ref: "#/components/schemas/ObjectIdRef" }
                name: { type: string }
                contactPerson: { type: string }
                phone: { type: string }
                email: { type: string }
        assets:
          type: array
          items:
            oneOf:
              - $ref: "#/components/schemas/ObjectIdRef"
              - type: object
                properties:
                  _id: { $ref: "#/components/schemas/ObjectIdRef" }
                  assetCode: { type: string }
                  name: { type: string }
                  department:
                    type: object
                    properties:
                      _id: { $ref: "#/components/schemas/ObjectIdRef" }
                      code: { type: string }
                      name: { type: string }
        contractNumber: { type: string, nullable: true }
        title: { type: string }
        description: { type: string, nullable: true }
        startDate: { type: string, format: date-time }
        endDate: { type: string, format: date-time }
        status: { type: string, enum: [active, cancelled] }
        isExpired:
          type: boolean
          description: TÍNH THÊM (không lưu DB) — status=active VÀ endDate đã qua.
        cancelledAt: { type: string, format: date-time, nullable: true }
        cancelledBy:
          nullable: true
          oneOf:
            - $ref: "#/components/schemas/ObjectIdRef"
            - type: object
              properties:
                _id: { $ref: "#/components/schemas/ObjectIdRef" }
                username: { type: string }
                fullName: { type: string }
        cancelReason: { type: string, nullable: true }
        expiryAlertSentAt: { type: string, format: date-time, nullable: true }
        createdBy:
          oneOf:
            - $ref: "#/components/schemas/ObjectIdRef"
            - type: object
              properties:
                _id: { $ref: "#/components/schemas/ObjectIdRef" }
                username: { type: string }
                fullName: { type: string }
        updatedBy: { $ref: "#/components/schemas/ObjectIdRef", nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    CalibrationResult:
      type: string
      enum: [PASS, FAIL, CONDITIONAL_PASS]

    CalibrationRecord:
      type: object
      properties:
        _id: { $ref: "#/components/schemas/ObjectIdRef" }
        deviceProfile: { $ref: "#/components/schemas/ObjectIdRef" }
        calibratedAt: { type: string, format: date-time }
        calibratedBy:
          type: string
          description: Tên đơn vị kiểm định bên ngoài hệ thống (không phải tài khoản User).
        result: { $ref: "#/components/schemas/CalibrationResult" }
        certificateFileUrl:
          type: string
          nullable: true
          description: >-
            Link file giấy chứng nhận kiểm định do người dùng NHẬP TAY (không
            phải file upload thật — xem certificateFileId). Chỉ có giá trị
            khi tạo bản ghi bằng field certificateFileUrl.
        certificateFileId:
          type: string
          nullable: true
          description: >-
            (A2) ID của Upload document khi giấy chứng nhận là FILE THẬT đã
            upload (field certificateFile lúc tạo). Có giá trị này thì tải
            qua GET .../calibration-records/{recordId}/certificate/download
            — KHÔNG dùng certificateFileUrl (đường dẫn /uploads/... không
            phục vụ trực tiếp được).
        nextDueDate: { type: string, format: date-time }
        recordedBy:
          description: User hệ thống đã nhập bản ghi này (khác calibratedBy).
          oneOf:
            - $ref: "#/components/schemas/ObjectIdRef"
            - type: object
              properties:
                _id: { $ref: "#/components/schemas/ObjectIdRef" }
                username: { type: string }
                fullName: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    # ⚠️ KHÔNG còn được $ref ở đâu nữa kể từ Giai đoạn 5 (endpoint POST
    # .../calibration-records đã chuyển sang multipart/form-data với schema
    # inline ngay tại path, để hỗ trợ field certificateFile dạng binary).
    # Giữ lại schema này làm tài liệu tham khảo cấu trúc field gốc — có thể
    # xoá nếu không còn nơi nào cần tham chiếu.
    CreateCalibrationRecordRequest:
      type: object
      required: [calibratedAt, calibratedBy, result, nextDueDate]
      description: >
        `nextDueDate` bắt buộc nhập tay (không tự suy ra từ
        calibrationIntervalMonths — kết quả FAIL/CONDITIONAL_PASS có thể rút
        ngắn hạn kiểm định kế tiếp) và phải SAU `calibratedAt`.
        `calibratedAt` cũng phải mới hơn lần kiểm định gần nhất đã ghi nhận
        cho thiết bị này (409 nếu không thoả).
      properties:
        calibratedAt: { type: string, format: date-time }
        calibratedBy:
          type: string
          minLength: 1
          description: Tên đơn vị kiểm định bên ngoài hệ thống.
        result: { $ref: "#/components/schemas/CalibrationResult" }
        certificateFileUrl: { type: string }
        nextDueDate: { type: string, format: date-time }

    AssetAssignmentHistory:
      type: object
      properties:
        _id: { $ref: "#/components/schemas/ObjectIdRef" }
        asset: { $ref: "#/components/schemas/ObjectIdRef" }
        actionType: { type: string, enum: [ASSIGN, TRANSFER, RETURN] }
        fromDepartment:
          { $ref: "#/components/schemas/ObjectIdRef", nullable: true }
        toDepartment:
          { $ref: "#/components/schemas/ObjectIdRef", nullable: true }
        fromUser: { $ref: "#/components/schemas/ObjectIdRef", nullable: true }
        toUser: { $ref: "#/components/schemas/ObjectIdRef", nullable: true }
        handedOverBy: { $ref: "#/components/schemas/ObjectIdRef" }
        reason: { type: string, nullable: true }
        effectiveAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }

    # ============================================================
    # NOTIFICATION
    # ============================================================
    Notification:
      type: object
      properties:
        _id: { $ref: "#/components/schemas/ObjectIdRef" }
        recipient:
          description: >
            [SỬA — thiếu trước đây] `GET /api/notifications` (tự-scope) trả
            ObjectId thô (đúng schema dưới). `GET /api/notifications/admin`
            (ADMIN) trả OBJECT đã populate lite — xem `AdminNotification`.
          $ref: "#/components/schemas/ObjectIdRef"
        createdBy: { $ref: "#/components/schemas/ObjectIdRef", nullable: true }
        type:
          type: string
          enum:
            - WORKFLOW_STEP_ASSIGNED
            - WORKFLOW_APPROVED
            - WORKFLOW_REJECTED
            - DOCUMENT_SUBMITTED
            - IMPORT_COMPLETED
            - IMPORT_FAILED
            - RBAC_CHANGED
            - SYSTEM
            - ASSET_WARRANTY_EXPIRING
            - ASSET_MAINTENANCE_OVERDUE
            # [SỬA — thiếu trước đây] giá trị enum thứ 11, có sẵn từ
            # "Giai đoạn 3" (module Thiết bị y tế) nhưng chưa từng được thêm
            # vào tài liệu — xác nhận trực tiếp `notification.types.ts`.
            - MEDICAL_DEVICE_CALIBRATION_DUE
            # Roadmap B1 (SLA & nhắc việc Workflow, 2026-09-15)
            - WORKFLOW_SLA_REMINDER
            - WORKFLOW_SLA_ESCALATED
        title: { type: string }
        message: { type: string }
        resourceType:
          {
            type: string,
            enum: [Document, WorkflowInstance, ImportHistory, Asset],
            nullable: true,
          }
        resourceId: { $ref: "#/components/schemas/ObjectIdRef", nullable: true }
        isRead: { type: boolean }
        readAt: { type: string, format: date-time, nullable: true }
        channelsSent:
          type: array
          items: { type: string, enum: [in_app, email] }
          description: Kênh ĐÃ gửi thành công (không phải kênh dự định gửi)
        priority: { type: string, enum: [low, normal, high], default: normal }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    # MỚI (2026-09-10) — response của `GET /api/notifications/admin`, KHÁC
    # `Notification` ở 2 field `recipient`/`createdBy` (populate lite thay vì
    # ObjectId thô, xem `getAllNotificationsAdmin` — `notification.service.ts`).
    AdminNotification:
      allOf:
        - $ref: "#/components/schemas/Notification"
        - type: object
          properties:
            recipient:
              type: object
              nullable: true
              properties:
                _id: { $ref: "#/components/schemas/ObjectIdRef" }
                username: { type: string }
                fullName: { type: string }
                email: { type: string, nullable: true }
            createdBy:
              type: object
              nullable: true
              properties:
                _id: { $ref: "#/components/schemas/ObjectIdRef" }
                username: { type: string }
                fullName: { type: string }
                email: { type: string, nullable: true }

    # MỚI (2026-09-10) — request `POST /api/notifications/broadcast`.
    BroadcastNotificationRequest:
      type: object
      required: [title, message, scope]
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        message: { type: string, minLength: 1, maxLength: 2000 }
        priority: { type: string, enum: [low, normal, high] }
        sendEmail:
          type: boolean
          description: Best-effort — cố gắng gửi thêm qua email cho từng người nhận.
        scope: { type: string, enum: [ALL, ROLE, DEPARTMENT, USERS] }
        roleName:
          type: string
          description: Bắt buộc khi scope=ROLE (khớp `Role.name`, vd "IT").
        departmentId:
          allOf: [{ $ref: "#/components/schemas/ObjectIdRef" }]
          description: Bắt buộc khi scope=DEPARTMENT.
        userIds:
          type: array
          items: { $ref: "#/components/schemas/ObjectIdRef" }
          maxItems: 200
          description: Bắt buộc khi scope=USERS.

    # ============================================================
    # EXCEL / IMPORT HISTORY
    # ============================================================
    ImportHistory:
      type: object
      properties:
        _id: { $ref: "#/components/schemas/ObjectIdRef" }
        importedBy:
          oneOf:
            - $ref: "#/components/schemas/ObjectIdRef"
            - $ref: "#/components/schemas/User"
        fileName: { type: string }
        mode: { type: string, enum: [dryRun, commit] }
        status: { type: string, enum: [success, partial, failed] }
        totalRows: { type: integer }
        created: { type: integer }
        updated: { type: integer }
        reportsCreated: { type: integer }
        errorCount: { type: integer }
        errors:
          type: array
          items:
            type: object
            properties:
              row: { type: integer }
              message: { type: string }
        createdAt: { type: string, format: date-time }

    ImportAssetsResult:
      type: object
      properties:
        dryRun: { type: boolean }
        created: { type: integer }
        updated:
          {
            type: integer,
            description: "Luôn = 0 — import Asset chỉ tạo mới, giữ field cho khớp shape chung.",
          }
        reportsCreated:
          {
            type: integer,
            description: "Luôn = 0 — không áp dụng cho Asset, giữ field cho khớp shape chung.",
          }
        totalRows: { type: integer }
        preview:
          type: array
          items: { type: object, additionalProperties: true }
        errors:
          type: array
          items:
            type: object
            properties:
              row: { type: integer }
              message: { type: string }

    ImportDocumentsResult:
      type: object
      properties:
        # [SỬA — FE-15] thiếu 2 field `dryRun`/`totalRows` dù response thật
        # (`importDocumentsExcel`, excel.service.ts) LUÔN trả đủ, cùng shape
        # với `ImportAssetsResult` ở trên (2 domain dùng chung 1 cấu trúc).
        dryRun: { type: boolean }
        created: { type: integer }
        updated: { type: integer }
        reportsCreated: { type: integer }
        totalRows: { type: integer }
        preview:
          type: array
          items: { type: object, additionalProperties: true }
        errors:
          type: array
          items:
            type: object
            properties:
              row: { type: integer }
              message: { type: string }

    # ============================================================
    # UPLOAD
    # ============================================================
    UploadFile:
      type: object
      properties:
        _id: { $ref: "#/components/schemas/ObjectIdRef" }
        fileName: { type: string }
        fileUrl: { type: string }
        fileSize: { type: integer }
        mimeType: { type: string }
        storage: { type: string, enum: [local, s3] }
        uploadedBy: { $ref: "#/components/schemas/ObjectIdRef", nullable: true }
        isUsed: { type: boolean }
        isDeleted: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    # ============================================================
    # USER AUDIT
    # ============================================================
    UserAudit:
      type: object
      properties:
        _id: { $ref: "#/components/schemas/ObjectIdRef" }
        action:
          type: string
          enum:
            - CREATE
            - UPDATE
            - DISABLE
            - RESTORE
            - LOGIN
            - LOGOUT
            - RESET_PASSWORD
            - CHANGE_PASSWORD
            - FORGOT_PASSWORD
            - AUDIT_DASHBOARD_VIEW
            - ADMIN_BYPASS
            - VIEW_DETAIL
            - DELETE
            - REGISTER
            - ASSIGN_ROLE
        performedBy:
          oneOf:
            - $ref: "#/components/schemas/ObjectIdRef"
            - $ref: "#/components/schemas/User"
        user:
          oneOf:
            - $ref: "#/components/schemas/ObjectIdRef"
            - $ref: "#/components/schemas/User"
        note: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }

    # ============================================================
    # DASHBOARD / PERFORMANCE (kết quả tổng hợp — không map trực tiếp 1 model)
    # ============================================================
    ApiPerformanceStat:
      type: object
      properties:
        endpoint: { type: string }
        totalCalls: { type: integer }
        avgTime: { type: number }
        maxTime: { type: number }
        avgDb: { type: number }
        avgService: { type: number }
        avgController: { type: number }
        slowCount: { type: integer }
        errorCount: { type: integer }
