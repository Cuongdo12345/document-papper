  /api/vendors/bulk-restore:
    post:
      tags: [Vendors]
      summary: Khôi phục hợp tác hàng loạt (permission VENDOR_UPDATE — chưa có route restore đơn lẻ, tái dùng update isActive:true)
      description: "[MỚI 2026-09-17, DEV-062]"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BulkDeleteRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BulkDeleteResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/vendors/{id}:
    get:
      tags: [Vendors]
      summary: Chi tiết 1 nhà cung cấp (permission VENDOR_VIEW)
      parameters: [{ $ref: "#/components/parameters/IdParam" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  data: { $ref: "#/components/schemas/Vendor" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [Vendors]
      summary: Sửa thông tin nhà cung cấp (permission VENDOR_UPDATE)
      description: Bao gồm bật/tắt `isActive` (ngừng hợp tác) — không tách permission riêng.
      parameters: [{ $ref: "#/components/parameters/IdParam" }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, minLength: 1 }
                contactPerson: { type: string }
                phone: { type: string }
                email: { type: string, format: email }
                address: { type: string }
                taxCode: { type: string }
                notes: { type: string }
                isActive: { type: boolean }
      responses:
        "200":
          description: Cập nhật thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  data: { $ref: "#/components/schemas/Vendor" }
        "400": { $ref: "#/components/responses/BadRequest" }
