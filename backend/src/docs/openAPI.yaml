  /api/inventory/items/{id}:
    get:
      tags: [Inventory]
      summary: Chi tiết 1 vật tư (permission CONSUMABLE_VIEW)
      parameters: [{ $ref: "#/components/parameters/IdParam" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  data: { $ref: "#/components/schemas/ConsumableItem" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [Inventory]
      summary: Sửa thông tin vật tư (permission CONSUMABLE_UPDATE)
      description: >
        KHÔNG cho sửa `department` (đổi phòng ban = "chuyển kho", nghiệp vụ
        khác) hay `quantityOnHand` trực tiếp (chỉ qua giao dịch nhập/xuất).
        Đổi `minStockThreshold` sẽ reset cờ đã-gửi-cảnh-báo.
      parameters: [{ $ref: "#/components/parameters/IdParam" }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, minLength: 1 }
                unit: { type: string, minLength: 1 }
                category: { type: string, pattern: "^[0-9a-fA-F]{24}$", description: "ID nhóm vật tư (ConsumableCategory)." }
                minStockThreshold: { type: number, minimum: 0 }
                isActive: { type: boolean }
      responses:
        "200":
          description: Cập nhật thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  data: { $ref: "#/components/schemas/ConsumableItem" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Trùng tên với vật tư khác cùng phòng ban
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /api/inventory/items/{id}/transactions:
    post:
      tags: [Inventory]
      summary: Nhập/xuất kho (permission CONSUMABLE_TRANSACTION_CREATE)
      description: >
        Cập nhật `quantityOnHand` ATOMIC cùng 1 Mongo transaction với việc
        tạo bản ghi giao dịch. XUẤT vượt tồn kho hiện có → 400.
      parameters: [{ $ref: "#/components/parameters/IdParam" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, quantity]
              properties:
                type: { type: string, enum: [IN, OUT] }
                quantity: { type: number, exclusiveMinimum: 0 }
                reason: { type: string }
      responses:
        "201":
          description: Ghi nhận thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  data: { $ref: "#/components/schemas/ConsumableTransaction" }
        "400":
          description: ID không hợp lệ, vật tư đã ngừng theo dõi, hoặc XUẤT vượt tồn kho hiện có
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    get:
      tags: [Inventory]
      summary: Lịch sử giao dịch nhập/xuất theo 1 vật tư, phân trang (permission CONSUMABLE_VIEW)
      parameters:
        - $ref: "#/components/parameters/IdParam"
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, default: 20 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/ConsumableTransaction" }
                  pagination: { $ref: "#/components/schemas/PaginationMeta" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

