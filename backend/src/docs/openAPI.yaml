        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/users/{id}/sessions/{sessionId}:
    delete:
      tags: [Users]
      summary: Admin thu hồi 1 phiên đăng nhập của user khác (permission SESSION_REVOKE_ALL)
      description: >
        [MỚI 2026-09-19, Roadmap C2, DEV-069] TÁCH RIÊNG khỏi
        `SESSION_VIEW_ALL` — thu hồi là hành động buộc user khác đăng xuất,
        rủi ro cao hơn xem. Hữu ích khi tài khoản nghi bị lộ mà chính chủ
        không tự đăng nhập được để tự thu hồi.
      parameters:
