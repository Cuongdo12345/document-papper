        lại (mirror `POST /workflow/sla/run`). Gửi cho user active thuộc
        role BAN_GIAM_DOC (báo cáo toàn viện) hoặc TRUONG_KHOA (báo cáo theo
        khoa của chính họ) VÀ đã tự bật `subscribedToWeeklyReport`
        (`PATCH /users/me`) — KHÁC các cảnh báo tự động khác trong hệ thống
