            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  message: { type: string }
                  data:
                    type: object
                    properties:
                      # [SỬA — trước đây tài liệu sai tên field là "count"]
                      # Field thật (`getUnreadCount`) tên là `unreadCount`.
                      unreadCount: { type: integer }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/notifications/admin:
    get:
      tags: [Notifications]
      summary: Xem thông báo của BẤT KỲ user nào (permission NOTIFICATION_VIEW_ALL) — MỚI (2026-09-10)
      description: >
        Giám sát/debug — KHÁC `GET /api/notifications` (luôn tự khoá theo
        `req.user._id`). Chỉ ADMIN có permission này mặc định.
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: recipient
          in: query
          description: Lọc theo 1 user cụ thể.
          schema: { $ref: "#/components/schemas/ObjectIdRef" }
        - name: isRead
          in: query
          schema: { type: string, enum: ["true", "false"] }
        - name: type
          in: query
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  message: { type: string }
                  data:
                    type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/AdminNotification" }
                      total: { type: integer }
                      page: { type: integer }
                      limit: { type: integer }
                      totalPages: { type: integer }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/notifications/broadcast:
    post:
      tags: [Notifications]
      summary: Soạn + gửi thông báo hệ thống tới nhiều user (permission NOTIFICATION_BROADCAST) — MỚI (2026-09-10)
      description: >
        `type` luôn là `SYSTEM`. Tái dùng hạ tầng gửi (`notifyUserIds`) đang
        chạy ổn định cho các thông báo tự động khác — chỉ thêm bước resolve
        danh sách người nhận theo `scope`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BroadcastNotificationRequest" }
      responses:
        "201":
          description: Đã gửi
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  message: { type: string }
                  data:
                    type: object
                    properties:
                      recipientCount: { type: integer }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

