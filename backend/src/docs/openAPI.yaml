      tags: [Assets]
      summary: Tra cứu tài sản theo assetCode (permission ASSET_INVENTORY_CHECK)
      description: >
        Dùng ngay sau khi quét QR (đầu đọc mã vạch/QR hoạt động như bàn
        phím). Trả về đầy đủ thông tin để FE hiển thị cho nhân viên XÁC NHẬN
        trước khi gọi tiếp `POST /:id/check-in` — tránh quét nhầm mã.
      parameters:
        - name: assetCode
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Tìm thấy tài sản
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  data: { $ref: "#/components/schemas/Asset" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/assets/{id}/qrcode:
    get:
      tags: [Assets]
      summary: Sinh ảnh QR code (PNG) cho 1 tài sản (permission ASSET_VIEW_DETAIL)
      description: >
        QR code encode NGUYÊN VĂN `assetCode` (mã người đọc được, in trên
        tem dán vật lý) — không phải `assetId`/URL, để không phụ thuộc domain
        môi trường và có thể đối chiếu bằng mắt khi máy quét lỗi.
      parameters: [{ $ref: "#/components/parameters/IdParam" }]
      responses:
        "200":
          description: Ảnh QR code PNG
          content:
            image/png:
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/assets/{id}/check-in:
    post:
      tags: [Assets]
      summary: Ghi nhận kiểm kê — xác nhận vẫn thấy tài sản (permission ASSET_INVENTORY_CHECK)
      description: >
        Chỉ cập nhật `lastInventoryCheckAt`/`lastInventoryCheckBy` — KHÔNG
        đổi status/department/assignedTo (kiểm kê là xác nhận sự tồn tại,
        không phải thay đổi vòng đời; dùng assign/transfer/return cho việc đó).
      parameters: [{ $ref: "#/components/parameters/IdParam" }]
      responses:
        "200":
          description: Ghi nhận kiểm kê thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  data: { $ref: "#/components/schemas/Asset" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

