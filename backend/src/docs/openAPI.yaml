  /api/dashboard/medical-devices/summary:
    get:
      tags: [Dashboard]
      summary: Tổng quan Thiết bị Y tế — theo class + tỷ lệ tuân thủ kiểm định (permission DASHBOARD_READ)
      description: >
        Tổng số thiết bị theo `deviceClass` (A/B/C/D), tổng số profile, và
        tỷ lệ đã/chưa kiểm định đúng hạn (`calibrationCompliance`). Chỉ tính
        profile có Asset liên kết đang active. `complianceRate = null`
        (không phải 0) khi không có thiết bị nào yêu cầu kiểm định.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      byClass:
                        type: array
                        items:
                          type: object
                          properties:
                            deviceClass:
                              {
                                $ref: "#/components/schemas/MedicalDeviceClass",
                              }
                            count: { type: integer }
                      totalProfiles: { type: integer }
                      calibrationCompliance:
                        type: object
                        properties:
                          totalRequiresCalibration: { type: integer }
                          onTime: { type: integer }
                          overdue: { type: integer }
                          complianceRate:
                            type: number
                            nullable: true
                            description: "null khi không có thiết bị nào yêu cầu kiểm định"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/dashboard/medical-devices/calibration-due:
    get:
      tags: [Dashboard]
      summary: Danh sách thiết bị sắp/đã quá hạn kiểm định (permission DASHBOARD_READ)
      description: >
        Xem TOÀN BỘ danh sách sắp/đã quá hạn kiểm định cho dashboard (KHÁC
        với cron alert — không lọc theo `calibrationAlertSentAt`). Mặc định
        sort tăng dần theo `nextCalibrationDueDate` (sắp tới hạn sớm nhất
        lên đầu).
      parameters:
        - name: daysAhead
          in: query
          schema: { type: integer, minimum: 0, default: 30 }
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/LimitParam"
        - name: sortBy
          in: query
          schema:
            {
              type: string,
              enum: [nextCalibrationDueDate, deviceClass],
              default: nextCalibrationDueDate,
            }
        - $ref: "#/components/parameters/OrderParam"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        deviceClass:
                          { $ref: "#/components/schemas/MedicalDeviceClass" }
                        registrationNumber: { type: string, nullable: true }
                        requiresCalibration: { type: boolean }
                        calibrationIntervalMonths:
                          { type: integer, nullable: true }
                        lastCalibrationDate:
                          { type: string, format: date-time, nullable: true }
                        nextCalibrationDueDate:
                          { type: string, format: date-time }
                        isOverdue: { type: boolean }
                        asset:
                          type: object
                          properties:
                            _id: { $ref: "#/components/schemas/ObjectIdRef" }
                            name: { type: string }
                            assetCode: { type: string }
                            department:
                              type: object
                              properties:
                                _id:
                                  { $ref: "#/components/schemas/ObjectIdRef" }
                                code: { type: string }
                                name: { type: string }
                  pagination: { $ref: "#/components/schemas/PaginationMeta" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

