  /api/users/reset-2fa/{id}:
    patch:
      tags: [Users]
      summary: Admin tắt xác thực 2 lớp cho 1 user bị khoá (permission USER_RESET_2FA)
      description: >
        [MỚI 2026-09-19, Roadmap C1, DEV-068] Đường khôi phục DUY NHẤT khi
        user tự bật 2FA (self-service) rồi mất quyền truy cập email nhận OTP
        (không có backup codes). KHÔNG có body — chỉ tắt cờ + xoá OTP đang
        chờ. Từ chối (400) nếu target là ADMIN thật (`isSystemRole`) hoặc
        target chưa bật 2FA. `USER_RESET_2FA` mirror ĐÚNG `USER_RESET_PASSWORD`
        — KHÔNG gán cho role nào trong `rolePermission.map.ts`, chỉ ADMIN có.
      parameters: [{ $ref: "#/components/parameters/IdParam" }]
