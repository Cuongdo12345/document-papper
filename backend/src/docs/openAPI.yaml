  # ================= CONTRACTS (Roadmap B4, 2026-09-16) =================
  /api/contracts:
    post:
      tags: [Contracts]
      summary: Tạo hợp đồng mới, áp dụng cho 1 hoặc nhiều tài sản (permission CONTRACT_CREATE)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [vendor, assets, title, startDate, endDate]
              properties:
                vendor: { type: string, pattern: "^[0-9a-fA-F]{24}$" }
                assets:
                  type: array
                  minItems: 1
                  items: { type: string, pattern: "^[0-9a-fA-F]{24}$" }
                contractNumber: { type: string }
                title: { type: string, minLength: 1 }
                description: { type: string }
                startDate: { type: string, format: date-time }
                endDate: { type: string, format: date-time }
      responses:
        "201":
          description: Tạo thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  data: { $ref: "#/components/schemas/Contract" }
        "400":
          description: Dữ liệu không hợp lệ (endDate ≤ startDate, hoặc có asset không tồn tại/không active)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: Không tìm thấy nhà cung cấp, hoặc nhà cung cấp đã ngừng hợp tác
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
    get:
      tags: [Contracts]
      summary: Danh sách hợp đồng, phân trang (permission CONTRACT_VIEW)
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, default: 20 }
        - name: vendor
          in: query
          schema: { type: string, pattern: "^[0-9a-fA-F]{24}$" }
        - name: asset
          in: query
          description: Lọc hợp đồng có chứa asset này trong `assets[]`.
          schema: { type: string, pattern: "^[0-9a-fA-F]{24}$" }
        - name: status
          in: query
          description: >-
            "active" = còn hiệu lực THẬT SỰ (status=active VÀ endDate chưa qua).
            "expired" = đã hết hạn nhưng CHƯA gia hạn/huỷ (status=active VÀ endDate
            đã qua — KHÔNG phải giá trị enum thật của `Contract.status`, chỉ dùng
            để lọc). "cancelled" = đã huỷ.
          schema: { type: string, enum: [active, expired, cancelled] }
        - name: expiringWithinDays
          in: query
          description: Chỉ lấy hợp đồng còn "active" VÀ hết hạn trong N ngày tới.
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Contract" }
                  pagination: { $ref: "#/components/schemas/PaginationMeta" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/contracts/asset/{assetId}:
    get:
      tags: [Contracts]
      summary: Mọi hợp đồng (mọi trạng thái) áp dụng cho 1 tài sản (permission CONTRACT_VIEW)
      description: Dùng cho section "Hợp đồng bảo trì" trong trang chi tiết Asset.
      parameters:
        - name: assetId
          in: path
          required: true
          schema: { type: string, pattern: "^[0-9a-fA-F]{24}$" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Contract" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/contracts/alerts/run:
    post:
      tags: [Contracts]
      summary: Chạy tay kiểm tra cảnh báo hợp đồng sắp hết hạn (permission CONTRACT_ALERTS_TRIGGER)
      description: Dùng để test/chạy thủ công ngoài lịch cron (08:20 hằng ngày) — mirror POST /api/assets/alerts/run.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  data:
                    type: object
                    properties:
                      expiring:
                        type: object
                        properties:
                          checked: { type: integer }
                          notified: { type: integer }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/contracts/{id}:
    get:
      tags: [Contracts]
      summary: Chi tiết 1 hợp đồng (permission CONTRACT_VIEW)
      parameters: [{ $ref: "#/components/parameters/IdParam" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  data: { $ref: "#/components/schemas/Contract" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [Contracts]
      summary: Sửa hợp đồng CÒN "active" (permission CONTRACT_UPDATE)
      description: >
        Không cho sửa hợp đồng đã "cancelled" — giữ nguyên làm lịch sử. Không
        có field `vendor`/`status` trong request — đổi NCC là ký hợp đồng
        mới, đổi trạng thái chỉ qua `/cancel`.
      parameters: [{ $ref: "#/components/parameters/IdParam" }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                assets:
                  type: array
                  minItems: 1
                  items: { type: string, pattern: "^[0-9a-fA-F]{24}$" }
                contractNumber: { type: string }
                title: { type: string, minLength: 1 }
                description: { type: string }
                startDate: { type: string, format: date-time }
                endDate: { type: string, format: date-time }
      responses:
        "200":
          description: Cập nhật thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  data: { $ref: "#/components/schemas/Contract" }
        "400":
          description: ID không hợp lệ, hợp đồng đã cancelled, hoặc có asset không hợp lệ trong danh sách mới
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/contracts/{id}/cancel:
    patch:
      tags: [Contracts]
      summary: Huỷ hợp đồng trước hạn (permission CONTRACT_UPDATE)
      parameters: [{ $ref: "#/components/parameters/IdParam" }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                cancelReason: { type: string, description: "Lý do huỷ (tuỳ chọn)." }
      responses:
        "200":
          description: Huỷ thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  data: { $ref: "#/components/schemas/Contract" }
        "400":
          description: ID không hợp lệ, hoặc hợp đồng đã ở trạng thái "cancelled"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # [MỚI 2026-09-16, DEV-058] Khôi phục hợp đồng đã huỷ — permission RIÊNG
  # CONTRACT_RESTORE (không gộp vào CONTRACT_UPDATE như cancel).
  /api/contracts/{id}/restore:
    patch:
      tags: [Contracts]
      summary: Khôi phục hợp đồng đã huỷ về "active" (permission CONTRACT_RESTORE)
      parameters: [{ $ref: "#/components/parameters/IdParam" }]
      responses:
        "200":
          description: Khôi phục thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  data: { $ref: "#/components/schemas/Contract" }
        "400":
          description: ID không hợp lệ, hoặc hợp đồng đang ở trạng thái "active" (chưa huỷ)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ================= ASSET CATEGORIES =================
  /api/assets/asset-categories:
    post:
      tags: [Asset Categories]
      summary: Tạo danh mục tài sản (permission ASSET_CATEGORY_CREATE)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateAssetCategoryRequest" }
      responses:
        "201":
          description: Tạo thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  data: { $ref: "#/components/schemas/AssetCategory" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
    get:
      tags: [Asset Categories]
      summary: Danh sách danh mục tài sản (permission ASSET_CATEGORY_VIEW)
