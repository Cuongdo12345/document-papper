  /api/workflows/{id}/complete:
    post:
      tags: [Workflow]
      summary: Đánh dấu workflow đã hoàn tất công việc thực tế (chỉ người tạo Document)
      description: >
        KHÁC với "approved": "approved" nghĩa là ĐÃ ĐƯỢC CHO PHÉP thực hiện,
        chưa chắc việc đã làm xong ngoài thực tế (vd chưa mua/nhận hàng).
        "complete" đóng hẳn quy trình sau khi việc thực tế đã xong. Chỉ áp
        dụng được khi workflow đang ở đúng trạng thái `approved`. Cập nhật
        đồng thời `WorkflowInstance.status` và `Document.workflowStatus`
        sang `completed` (bọc trong transaction).
      parameters: [{ $ref: "#/components/parameters/IdParam" }]
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ApproveRejectBody" }
      responses:
        "200":
          description: Đánh dấu hoàn tất thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  message: { type: string }
                  data:
                    allOf:
                      - $ref: "#/components/schemas/WorkflowInstance"
                      - type: object
                        properties:
                          completionComment:
                            type: string
                            nullable: true
                            description: Chỉ trả về trong response — KHÔNG có chỗ lưu cố định trong schema WorkflowInstance hiện tại.
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        Access token JWT lấy từ `POST /api/auths/login`. Gửi kèm header
        `Authorization: Bearer <accessToken>`.

  parameters:
    IdParam:
      name: id
      in: path
      required: true
      description: MongoDB ObjectId (24 ký tự hex)
      schema:
        type: string
        pattern: '^[0-9a-fA-F]{24}$'
      example: "665f1a2b8c9d3e4f5a6b7c8d"
    PageParam:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    LimitParam:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 10 }
    KeywordParam:
      name: keyword
      in: query
      schema: { type: string, maxLength: 100 }
    OrderParam:
      name: order
      in: query
      schema: { type: string, enum: [asc, desc], default: desc }

  responses:
    BadRequest:
      description: Dữ liệu đầu vào không hợp lệ (lỗi validate Zod)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    Unauthorized:
      description: Chưa đăng nhập / access token không hợp lệ hoặc đã hết hạn
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    Forbidden:
      description: Đã đăng nhập nhưng không đủ quyền (RBAC/ABAC từ chối)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    NotFound:
      description: Không tìm thấy tài nguyên
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    Conflict:
      description: Xung đột dữ liệu (vd trùng mã/tên đã tồn tại)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    TooManyRequests:
      description: Vượt quá giới hạn rate-limit (áp dụng cho nhóm route /api/auths)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }

  schemas:
    # ============================================================
    # COMMON / ENVELOPE
    # ============================================================
    ErrorResponse:
      type: object
      properties:
        success: { type: boolean, example: false }
        message: { type: string, example: "Dữ liệu không hợp lệ" }
        errorCode: { type: string, example: "VALIDATION_ERROR" }
        details:
          type: array
          nullable: true
          items:
            type: object
            properties:
              field: { type: string }
              message: { type: string }

    PaginationMeta:
      type: object
      properties:
        total: { type: integer, example: 42 }
        page: { type: integer, example: 1 }
        limit: { type: integer, example: 10 }
        totalPages: { type: integer, example: 5 }

    ObjectIdRef:
      type: string
      pattern: '^[0-9a-fA-F]{24}$'
      example: "665f1a2b8c9d3e4f5a6b7c8d"

    # ============================================================
    # AUTH
    # ============================================================
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string, minLength: 3, maxLength: 50, pattern: '^[a-zA-Z0-9_]+$' }
        password: { type: string, minLength: 5 }

    RegisterRequest:
      type: object
      required: [username, email, password, confirmPassword, fullName]
      properties:
        username: { type: string, minLength: 3, maxLength: 50, pattern: '^[a-zA-Z0-9_]+$' }
        email: { type: string, format: email }
        password: { type: string, minLength: 5 }
        confirmPassword: { type: string, minLength: 5 }
        fullName: { type: string, minLength: 1 }

    RefreshTokenRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken: { type: string }

    ForgotPasswordRequest:
      type: object
      required: [username]
      properties:
        username: { type: string, maxLength: 50 }

    ResetPasswordRequest:
      type: object
      required: [token, newPassword]
      properties:
        token: { type: string }
        newPassword: { type: string, minLength: 5 }

    AuthLoginResult:
      type: object
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
        user: { $ref: "#/components/schemas/User" }

    # ============================================================
    # USER
    # ============================================================
    User:
      type: object
      properties:
        _id: { $ref: "#/components/schemas/ObjectIdRef" }
        username: { type: string }
        fullName: { type: string }
        email: { type: string, nullable: true }
        role:
          oneOf:
            - $ref: "#/components/schemas/ObjectIdRef"
            - $ref: "#/components/schemas/Role"
        department:
          oneOf:
            - $ref: "#/components/schemas/ObjectIdRef"
            - $ref: "#/components/schemas/Department"
        extraPermissions:
          type: array
          items: { $ref: "#/components/schemas/ObjectIdRef" }
        denyPermissions:
          type: array
          items: { $ref: "#/components/schemas/ObjectIdRef" }
        isActive: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    CreateUserRequest:
      type: object
      required: [username, password, fullName, role]
      properties:
        username: { type: string, minLength: 5, pattern: '^[a-zA-Z0-9_]+$' }
        password: { type: string, minLength: 5 }
        fullName: { type: string, minLength: 1 }
        role: { $ref: "#/components/schemas/ObjectIdRef" }
        department: { $ref: "#/components/schemas/ObjectIdRef" }

    UpdateUserRequest:
      type: object
      properties:
        fullName: { type: string, minLength: 1 }
        username: { type: string, minLength: 5, pattern: '^[a-zA-Z0-9_]+$' }
        role: { $ref: "#/components/schemas/ObjectIdRef" }
        department: { $ref: "#/components/schemas/ObjectIdRef" }
        isActive: { type: boolean }

    UpdateMeRequest:
      type: object
      description: Chỉ 2 field này thực sự có tác dụng khi tự cập nhật (xem mô tả ở endpoint).
      properties:
        fullName: { type: string, minLength: 1 }
        username: { type: string, minLength: 5, pattern: '^[a-zA-Z0-9_]+$' }

    ChangePasswordRequest:
      type: object
      required: [oldPassword, newPassword, confirmPassword]
      properties:
        oldPassword: { type: string, minLength: 5 }
        newPassword: { type: string, minLength: 5 }
        confirmPassword: { type: string, minLength: 5 }

    ResetPasswordByAdminRequest:
      type: object
      required: [newPassword]
      properties:
        newPassword: { type: string, minLength: 5 }

    # ============================================================
    # RBAC — PERMISSION / ROLE / POLICY
    # ============================================================
    Permission:
      type: object
      properties:
        _id: { $ref: "#/components/schemas/ObjectIdRef" }
        name: { type: string, example: "DOCUMENT_VIEW" }
        resource: { type: string, example: "DOCUMENT" }
        action: { type: string, example: "VIEW" }
        description: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    CreatePermissionRequest:
      type: object
      required: [name, resource, action]
      properties:
        name: { type: string, maxLength: 100 }
        resource: { type: string, maxLength: 100 }
        action: { type: string, maxLength: 100 }
        description: { type: string, maxLength: 500 }

    UpdatePermissionRequest:
      type: object
      description: Cần ít nhất 1 field
      properties:
        name: { type: string, maxLength: 100 }
        resource: { type: string, maxLength: 100 }
        action: { type: string, maxLength: 100 }
        description: { type: string, maxLength: 500 }

    Role:
      type: object
      properties:
        _id: { $ref: "#/components/schemas/ObjectIdRef" }
        name: { type: string, example: "IT" }
        permissions:
          type: array
          items:
            oneOf:
              - $ref: "#/components/schemas/ObjectIdRef"
              - $ref: "#/components/schemas/Permission"
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    CreateRoleRequest:
      type: object
      required: [name]
      description: >
        CHỦ Ý chỉ có `name` — không cho gán `permissions` trực tiếp lúc tạo
        (chống mass assignment). Muốn gán permission, dùng
        `POST /api/rbac/roles/{id}/assign-permissions`.
      properties:
        name: { type: string, maxLength: 100 }

    UpdateRoleRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, maxLength: 100 }

    AssignPermissionsRequest:
      type: object
      required: [permissionIds]
      properties:
        permissionIds:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/ObjectIdRef" }

    Policy:
      type: object
      description: >
        Quy tắc ABAC — chỉ được áp dụng khi Role/Permission tĩnh không đủ
        (đánh giá `condition` bằng evaluator tự viết, an toàn, không dùng eval).
      properties:
        _id: { $ref: "#/components/schemas/ObjectIdRef" }
        name: { type: string }
        resource: { type: string }
        action: { type: string }
        condition:
          type: string
          maxLength: 1000
          example: "user.department == resource.department"
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    CreatePolicyRequest:
      type: object
      required: [name, resource, action, condition]
      properties:
        name: { type: string, maxLength: 100 }
        resource: { type: string, maxLength: 100 }
        action: { type: string, maxLength: 100 }
        condition: { type: string, maxLength: 1000 }

    UpdatePolicyRequest:
      type: object
      description: Cần ít nhất 1 field
      properties:
        name: { type: string, maxLength: 100 }
        resource: { type: string, maxLength: 100 }
        action: { type: string, maxLength: 100 }
        condition: { type: string, maxLength: 1000 }

    # ============================================================
    # DEPARTMENT
    # ============================================================
    Department:
      type: object
      properties:
        _id: { $ref: "#/components/schemas/ObjectIdRef" }
        code: { type: string }
        name: { type: string }
        description: { type: string, nullable: true }
        isActive: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    CreateDepartmentRequest:
      type: object
      required: [name, code]
      properties:
        name: { type: string, minLength: 1 }
        code: { type: string, minLength: 1 }
        description: { type: string }

    UpdateDepartmentRequest:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        code: { type: string }
        description: { type: string }
        isActive: { type: boolean }

    # ============================================================
    # DOCUMENT
    # ============================================================
    Document:
      type: object
      properties:
        _id: { $ref: "#/components/schemas/ObjectIdRef" }
        documentCode: { type: string, example: "PR-KVLTL-2026-0121" }
        category: { type: string, enum: [PROPOSAL, REPORT] }
        subType:
          type: string
          example: "PROPOSE_INK"
          description: >
            Tuỳ theo `category`: PROPOSAL có PROPOSE_INK/PROPOSE_REPAIR...;
            REPORT có CHECK_DAMAGE/CONFIRM_STATUS...
        title: { type: string }
        department:
          oneOf:
            - $ref: "#/components/schemas/ObjectIdRef"
            - $ref: "#/components/schemas/Department"
        createdBy:
          oneOf:
            - $ref: "#/components/schemas/ObjectIdRef"
            - $ref: "#/components/schemas/User"
        referenceTo:
          type: array
          description: Tối đa 1 phần tử — REPORT tham chiếu đúng 1 PROPOSAL
          items: { $ref: "#/components/schemas/ObjectIdRef" }
        relatedAsset:
          $ref: "#/components/schemas/ObjectIdRef"
          nullable: true
        meta:
          type: object
          additionalProperties: true
          description: Cấu trúc động tuỳ theo subType (items, deviceName, quantity, unitPrice...)
        workflowStatus:
          type: string
          enum: [pending, approved, rejected, cancelled, completed]
        isActive: { type: boolean }
        signedBy:
          type: array
          items: { $ref: "#/components/schemas/ObjectIdRef" }
        deletedAt: { type: string, format: date-time, nullable: true }
        deletedBy: { $ref: "#/components/schemas/ObjectIdRef", nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    CreateDocumentRequest:
      type: object
      required: [category, subType, title, department]
      properties:
        category: { type: string, enum: [PROPOSAL, REPORT] }
        subType: { type: string }
        title: { type: string, minLength: 1 }
        department: { $ref: "#/components/schemas/ObjectIdRef" }
        referenceTo:
          type: string
          description: ObjectId của Proposal (chỉ 1 giá trị, bắt buộc với REPORT tham chiếu Proposal)
        meta:
          type: object
          additionalProperties: true
        relatedAsset:
          type: string
          description: Bắt buộc khi subType = PROPOSE_REPAIR

    UpdateDocumentRequest:
      type: object
      description: Cần ít nhất 1 field. CHỈ `title`/`meta` thực sự có tác dụng (whitelist tầng service).
      properties:
        title: { type: string, minLength: 1 }
        meta:
          type: object
          additionalProperties: true

    DeleteByMonthRequest:
      type: object
      required: [month, year]
      properties:
        month: { type: integer, minimum: 1, maximum: 12 }
        year: { type: integer }
        category: { type: string, enum: [PROPOSAL, REPORT] }
        subType: { type: string }
        department: { $ref: "#/components/schemas/ObjectIdRef" }

    # ============================================================
    # WORKFLOW
    # ============================================================
    WorkflowStep:
      type: object
      properties:
        stepOrder: { type: integer }
        name: { type: string }
        role: { type: string, description: "Tên Role phải khớp step" }

    WorkflowTemplate:
      type: object
      properties:
        _id: { $ref: "#/components/schemas/ObjectIdRef" }
        name: { type: string }
        steps:
          type: array
          items: { $ref: "#/components/schemas/WorkflowStep" }
        isActive: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    CreateWorkflowTemplateRequest:
      type: object
      required: [name, steps]
      properties:
        name: { type: string, minLength: 1 }
        steps:
          type: array
          minItems: 1
          items:
            type: object
            required: [stepOrder, name, role]
            properties:
              stepOrder: { type: integer, minimum: 0 }
              name: { type: string, minLength: 1 }
              role: { type: string, minLength: 1 }
        isActive: { type: boolean }

    WorkflowInstanceStep:
      type: object
      properties:
        stepOrder: { type: integer }
        name: { type: string }
        role: { type: string }
        approvedBy: { $ref: "#/components/schemas/ObjectIdRef", nullable: true }
        status: { type: string, enum: [pending, approved, rejected, cancelled] }
        comment: { type: string, nullable: true }
        approvedAt: { type: string, format: date-time, nullable: true }

    WorkflowInstance:
      type: object
      properties:
        _id: { $ref: "#/components/schemas/ObjectIdRef" }
        documentId: { $ref: "#/components/schemas/ObjectIdRef" }
        templateId: { $ref: "#/components/schemas/ObjectIdRef" }
        currentStep: { type: integer }
        status: { type: string, enum: [pending, approved, rejected, cancelled, completed] }
        steps:
          type: array
          items: { $ref: "#/components/schemas/WorkflowInstanceStep" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    SubmitWorkflowRequest:
      type: object
      required: [documentId, templateId]
      properties:
        documentId: { $ref: "#/components/schemas/ObjectIdRef" }
        templateId: { $ref: "#/components/schemas/ObjectIdRef" }

    ApproveRejectBody:
      type: object
      properties:
        comment: { type: string, maxLength: 1000 }

    # ============================================================
    # ASSET
    # ============================================================
    AssetStatus:
      type: string
      enum: [IN_STOCK, RESERVED, IN_USE, UNDER_MAINTENANCE, DISPOSED]

    Asset:
      type: object
      properties:
        _id: { $ref: "#/components/schemas/ObjectIdRef" }
        assetCode: { type: string }
        name: { type: string }
        category:
          oneOf:
            - $ref: "#/components/schemas/ObjectIdRef"
            - $ref: "#/components/schemas/AssetCategory"
        department:
          oneOf:
            - $ref: "#/components/schemas/ObjectIdRef"
            - $ref: "#/components/schemas/Department"
        assignedTo:
          $ref: "#/components/schemas/ObjectIdRef"
          nullable: true
        status: { $ref: "#/components/schemas/AssetStatus" }
        serialNumber: { type: string, nullable: true }
        model: { type: string, nullable: true }
        manufacturer: { type: string, nullable: true }
        location: { type: string, nullable: true }
        purchaseDate: { type: string, format: date-time, nullable: true }
        purchasePrice: { type: number, nullable: true }
        warrantyExpiredAt: { type: string, format: date-time, nullable: true }
        supplier: { type: string, nullable: true }
        maintenanceStartedAt:
          type: string
          format: date-time
          nullable: true
          description: Set khi chuyển UNDER_MAINTENANCE, xoá khi bảo trì xử lý xong — dùng tính thời gian bảo trì quá hạn.
        warrantyAlertSentAt:
          type: string
          format: date-time
          nullable: true
          description: Lần gần nhất cron đã gửi cảnh báo sắp hết hạn bảo hành cho asset này (chống gửi trùng).
        lastInventoryCheckAt:
          type: string
          format: date-time
          nullable: true
          description: Lần kiểm kê (quét QR check-in) gần nhất.
        lastInventoryCheckBy: { $ref: "#/components/schemas/ObjectIdRef", nullable: true }
        specs:
          type: object
          additionalProperties: true
        isActive: { type: boolean }
        createdBy: { $ref: "#/components/schemas/ObjectIdRef", nullable: true }
        updatedBy: { $ref: "#/components/schemas/ObjectIdRef", nullable: true }
        deletedAt: { type: string, format: date-time, nullable: true }
        deletedBy: { $ref: "#/components/schemas/ObjectIdRef", nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    CreateAssetRequest:
      type: object
      required: [category, department, name]
      properties:
        category: { $ref: "#/components/schemas/ObjectIdRef" }
        department: { $ref: "#/components/schemas/ObjectIdRef" }
        name: { type: string, minLength: 1 }
        serialNumber: { type: string }
        model: { type: string }
        manufacturer: { type: string }
        location: { type: string }
        purchaseDate: { type: string, format: date }
        purchasePrice: { type: number, minimum: 0 }
        warrantyExpiredAt: { type: string, format: date }
        supplier: { type: string }
        specs:
          type: object
          additionalProperties: true

    UpdateAssetRequest:
      type: object
      description: >
        CHỦ Ý không cho sửa status/assignedTo/department qua route này —
        phải qua endpoint assign/transfer/return riêng.
      properties:
        category: { $ref: "#/components/schemas/ObjectIdRef" }
        name: { type: string, minLength: 1 }
        serialNumber: { type: string }
        model: { type: string }
        manufacturer: { type: string }
        location: { type: string }
        purchaseDate: { type: string, format: date }
        purchasePrice: { type: number, minimum: 0 }
        warrantyExpiredAt: { type: string, format: date }
        supplier: { type: string }
        specs:
          type: object
          additionalProperties: true
        isActive: { type: boolean }

    AssetCategory:
      type: object
      properties:
        _id: { $ref: "#/components/schemas/ObjectIdRef" }
        code: { type: string }
        name: { type: string }
        parentCategory: { $ref: "#/components/schemas/ObjectIdRef", nullable: true }
        defaultWarrantyMonths: { type: integer, nullable: true }
        isActive: { type: boolean }
        deletedAt: { type: string, format: date-time, nullable: true }
        deletedBy: { $ref: "#/components/schemas/ObjectIdRef", nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    CreateAssetCategoryRequest:
      type: object
      required: [code, name]
      properties:
        code: { type: string, minLength: 1 }
        name: { type: string, minLength: 1 }
        parentCategory: { $ref: "#/components/schemas/ObjectIdRef" }
        defaultWarrantyMonths: { type: integer, minimum: 0 }

    UpdateAssetCategoryRequest:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        parentCategory: { $ref: "#/components/schemas/ObjectIdRef" }
        defaultWarrantyMonths: { type: integer, minimum: 0 }
        isActive: { type: boolean }

    AssignAssetRequest:
      type: object
      required: [toDepartment]
      properties:
        toDepartment: { $ref: "#/components/schemas/ObjectIdRef" }
        toUser: { $ref: "#/components/schemas/ObjectIdRef" }
        reason: { type: string }

    TransferAssetRequest:
      type: object
      description: Phải cung cấp ít nhất 1 trong 2 field toDepartment/toUser
      properties:
        toDepartment: { $ref: "#/components/schemas/ObjectIdRef" }
        toUser:
          type: string
          description: 'Truyền ObjectId để đổi user, hoặc chuỗi rỗng "" để chủ ý gỡ user hiện tại'
        reason: { type: string }

    ReturnAssetRequest:
      type: object
      properties:
        toDepartment: { $ref: "#/components/schemas/ObjectIdRef" }
        reason: { type: string }

    MedicalDeviceClass:
      type: string
      enum: [A, B, C, D]
      description: >
        Phân loại rủi ro thiết bị y tế (A: thấp → D: cao). ⚠️ Số hiệu văn
        bản pháp lý làm căn cứ phân loại lấy từ kiến thức chung của hệ
        thống, CHƯA được xác minh lại — cần bộ phận vật tư y tế/pháp lý xác
        nhận trước khi dùng làm căn cứ tuân thủ thật.

    MedicalDeviceProfile:
      type: object
      properties:
        _id: { $ref: "#/components/schemas/ObjectIdRef" }
        asset:
          description: Quan hệ 1-1 với Asset — unique index trên field này.
          oneOf:
            - $ref: "#/components/schemas/ObjectIdRef"
            - $ref: "#/components/schemas/Asset"
        deviceClass: { $ref: "#/components/schemas/MedicalDeviceClass" }
        registrationNumber: { type: string, nullable: true, description: Số đăng ký lưu hành do Bộ Y tế cấp }
        licenseExpiredAt: { type: string, format: date-time, nullable: true }
        requiresCalibration: { type: boolean, default: false }
        calibrationIntervalMonths: { type: integer, nullable: true, minimum: 1 }
        lastCalibrationDate: { type: string, format: date-time, nullable: true }
        nextCalibrationDueDate: { type: string, format: date-time, nullable: true }
        calibrationAlertSentAt:
          type: string
          format: date-time
          nullable: true
          description: Chỉ server set (chống gửi trùng cảnh báo kiểm định) — không expose qua request body.
        operatorCertificateRequired: { type: boolean, default: false }
        createdBy: { $ref: "#/components/schemas/ObjectIdRef", nullable: true }
        updatedBy: { $ref: "#/components/schemas/ObjectIdRef", nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    CreateMedicalDeviceProfileRequest:
      type: object
      required: [deviceClass]
      description: >
        Nếu `requiresCalibration = true` thì `calibrationIntervalMonths`
        bắt buộc (validate ở service, không phải Zod — ràng buộc phụ thuộc
        giá trị field khác).
      properties:
        deviceClass: { $ref: "#/components/schemas/MedicalDeviceClass" }
        registrationNumber: { type: string }
        licenseExpiredAt: { type: string, format: date }
        requiresCalibration: { type: boolean, default: false }
        calibrationIntervalMonths: { type: integer, minimum: 1 }
        operatorCertificateRequired: { type: boolean, default: false }

    UpdateMedicalDeviceProfileRequest:
      type: object
      description: >
        Không có `lastCalibrationDate`/`nextCalibrationDueDate`/
        `calibrationAlertSentAt` — các field này chỉ đổi qua hành động
        "ghi nhận kiểm định mới" (chưa thấy endpoint trong lần cung cấp
        source này, có thể thuộc giai đoạn phát triển tiếp theo).
      properties:
        deviceClass: { $ref: "#/components/schemas/MedicalDeviceClass" }
        registrationNumber: { type: string }
        licenseExpiredAt: { type: string, format: date }
        requiresCalibration: { type: boolean }
        calibrationIntervalMonths: { type: integer, minimum: 1 }
        operatorCertificateRequired: { type: boolean }

    AssetAssignmentHistory:
      type: object
      properties:
        _id: { $ref: "#/components/schemas/ObjectIdRef" }
        asset: { $ref: "#/components/schemas/ObjectIdRef" }
        actionType: { type: string, enum: [ASSIGN, TRANSFER, RETURN] }
        fromDepartment: { $ref: "#/components/schemas/ObjectIdRef", nullable: true }
        toDepartment: { $ref: "#/components/schemas/ObjectIdRef", nullable: true }
        fromUser: { $ref: "#/components/schemas/ObjectIdRef", nullable: true }
        toUser: { $ref: "#/components/schemas/ObjectIdRef", nullable: true }
        handedOverBy: { $ref: "#/components/schemas/ObjectIdRef" }
        reason: { type: string, nullable: true }
        effectiveAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }

    # ============================================================
    # NOTIFICATION
    # ============================================================
    Notification:
      type: object
      properties:
        _id: { $ref: "#/components/schemas/ObjectIdRef" }
        recipient: { $ref: "#/components/schemas/ObjectIdRef" }
        createdBy: { $ref: "#/components/schemas/ObjectIdRef", nullable: true }
        type:
          type: string
          enum:
            - WORKFLOW_STEP_ASSIGNED
            - WORKFLOW_APPROVED
            - WORKFLOW_REJECTED
            - DOCUMENT_SUBMITTED
            - IMPORT_COMPLETED
            - IMPORT_FAILED
            - RBAC_CHANGED
            - SYSTEM
            - ASSET_WARRANTY_EXPIRING
            - ASSET_MAINTENANCE_OVERDUE
        title: { type: string }
        message: { type: string }
        resourceType: { type: string, enum: [Document, WorkflowInstance, ImportHistory, Asset], nullable: true }
        resourceId: { $ref: "#/components/schemas/ObjectIdRef", nullable: true }
        isRead: { type: boolean }
        readAt: { type: string, format: date-time, nullable: true }
        channelsSent:
          type: array
          items: { type: string, enum: [in_app, email] }
          description: Kênh ĐÃ gửi thành công (không phải kênh dự định gửi)
        priority: { type: string, enum: [low, normal, high], default: normal }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    # ============================================================
    # EXCEL / IMPORT HISTORY
    # ============================================================
    ImportHistory:
      type: object
      properties:
        _id: { $ref: "#/components/schemas/ObjectIdRef" }
        importedBy:
          oneOf:
            - $ref: "#/components/schemas/ObjectIdRef"
            - $ref: "#/components/schemas/User"
        fileName: { type: string }
        mode: { type: string, enum: [dryRun, commit] }
        status: { type: string, enum: [success, partial, failed] }
        totalRows: { type: integer }
        created: { type: integer }
        updated: { type: integer }
        reportsCreated: { type: integer }
        errorCount: { type: integer }
        errors:
          type: array
          items:
            type: object
            properties:
              row: { type: integer }
              message: { type: string }
        createdAt: { type: string, format: date-time }

    ImportAssetsResult:
      type: object
      properties:
        dryRun: { type: boolean }
        created: { type: integer }
        updated: { type: integer, description: "Luôn = 0 — import Asset chỉ tạo mới, giữ field cho khớp shape chung." }
        reportsCreated: { type: integer, description: "Luôn = 0 — không áp dụng cho Asset, giữ field cho khớp shape chung." }
        totalRows: { type: integer }
        preview:
          type: array
          items: { type: object, additionalProperties: true }
        errors:
          type: array
          items:
            type: object
            properties:
              row: { type: integer }
              message: { type: string }

    ImportDocumentsResult:
      type: object
      properties:
        created: { type: integer }
        updated: { type: integer }
        reportsCreated: { type: integer }
        preview:
          type: array
          items: { type: object, additionalProperties: true }
        errors:
          type: array
          items:
            type: object
            properties:
              row: { type: integer }
              message: { type: string }

    # ============================================================
    # UPLOAD
    # ============================================================
    UploadFile:
      type: object
      properties:
        _id: { $ref: "#/components/schemas/ObjectIdRef" }
        fileName: { type: string }
        fileUrl: { type: string }
        fileSize: { type: integer }
        mimeType: { type: string }
        storage: { type: string, enum: [local, s3] }
        uploadedBy: { $ref: "#/components/schemas/ObjectIdRef", nullable: true }
        isUsed: { type: boolean }
        isDeleted: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    # ============================================================
    # USER AUDIT
    # ============================================================
    UserAudit:
      type: object
      properties:
        _id: { $ref: "#/components/schemas/ObjectIdRef" }
        action:
          type: string
          enum:
            - CREATE
            - UPDATE
            - DISABLE
            - RESTORE
            - LOGIN
            - LOGOUT
            - RESET_PASSWORD
            - CHANGE_PASSWORD
            - FORGOT_PASSWORD
            - AUDIT_DASHBOARD_VIEW
            - ADMIN_BYPASS
            - VIEW_DETAIL
            - DELETE
            - REGISTER
            - ASSIGN_ROLE
        performedBy:
          oneOf:
            - $ref: "#/components/schemas/ObjectIdRef"
            - $ref: "#/components/schemas/User"
        user:
          oneOf:
            - $ref: "#/components/schemas/ObjectIdRef"
            - $ref: "#/components/schemas/User"
        note: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }

    # ============================================================
    # DASHBOARD / PERFORMANCE (kết quả tổng hợp — không map trực tiếp 1 model)
    # ============================================================
    ApiPerformanceStat:
      type: object
      properties:
        endpoint: { type: string }
        totalCalls: { type: integer }
        avgTime: { type: number }
        maxTime: { type: number }
        avgDb: { type: number }
        avgService: { type: number }
        avgController: { type: number }
        slowCount: { type: integer }
        errorCount: { type: integer }