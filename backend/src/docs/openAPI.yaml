  # ================= EXCEL =================
  /api/export/export-documents-excel:
    get:
      tags: [Excel]
      summary: Export danh sách Document ra file Excel (streaming) (permission DOCUMENT_EXCEL_EXPORT)
      description: >
        User không phải ADMIN bị ép cứng filter theo `department` của chính
        mình (không đổi được qua query string).
      parameters:
        - name: department
          in: query
          description: Chỉ ADMIN mới tự do dùng filter này
          schema: { $ref: "#/components/schemas/ObjectIdRef" }
        - name: category
          in: query
          schema: { type: string, enum: [PROPOSAL, REPORT] }
        - name: subType
          in: query
          schema:
            {
              type: string,
              enum:
                [
                  PROPOSE_REPAIR,
                  PROPOSE_INK,
                  PROPOSE_PROCUREMENT,
                  CHECK_DAMAGE,
                  CONFIRM_STATUS,
                ],
            }
        - name: fromDate
          in: query
          schema: { type: string, format: date }
        - name: toDate
          in: query
          schema: { type: string, format: date }
      responses:
        "200":
          description: File Excel (.xlsx) — streamed
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/export/template:
    get:
      tags: [Excel]
      summary: Tải file Excel mẫu để import Document (permission DOCUMENT_EXCEL_TEMPLATE)
      responses:
        "200":
          description: File Excel mẫu (.xlsx)
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/export/import-proposal:
    post:
      tags: [Excel]
      summary: Import Document (Proposal) hàng loạt từ file Excel (permission DOCUMENT_EXCEL_IMPORT)
      description: >
        [SỬA — FE-15] Ghi chú cũ ở đây ("KHÔNG có authorizePermission — mọi
        user đăng nhập đều import được") KHÔNG còn đúng với source hiện tại —
        route CÓ `authorizePermission("DOCUMENT_EXCEL_IMPORT")`
        (`excel.route.ts`), xác nhận trực tiếp. Dùng `?dryRun=true` để xem
        trước, không ghi DB.
      parameters:
        - name: dryRun
          in: query
          schema: { type: boolean, default: false }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: File .xlsx theo đúng mẫu tải ở /api/export/template
      responses:
        "200":
          description: Kết quả import (hoặc preview nếu dryRun)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  message: { type: string }
                  data: { $ref: "#/components/schemas/ImportDocumentsResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/export/departments/sync-from-excel:
    post:
      tags: [Excel]
      summary: Đồng bộ/tạo mới Department hàng loạt từ file Excel (permission EXCEL_DEPARTMENT_SYNC)
      description: >
        [SỬA — FE-15] Ghi chú cũ ở đây ("KHÔNG có authorizePermission — mọi
        user đăng nhập đều thao tác được") KHÔNG còn đúng với source hiện
        tại — route CÓ `authorizePermission("EXCEL_DEPARTMENT_SYNC")`
        (`excel.route.ts`), xác nhận trực tiếp. KHÔNG hỗ trợ `dryRun` (khác
        2 endpoint import Document/Asset).
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        "200":
          description: Đồng bộ thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  message: { type: string }
                  data: { type: object, additionalProperties: true }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/export/import-history:
    get:
      tags: [Excel]
      summary: Lịch sử import Excel (permission DOCUMENT_EXCEL_HISTORY; ADMIN xem tất cả, user thường chỉ xem của mình)
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/LimitParam"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/ImportHistory" }
                      pagination:
                        { $ref: "#/components/schemas/PaginationMeta" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  # ================= UPLOAD =================
  # [SỬA — FE-15] Ghi chú cũ ở đây cảnh báo 4 permission (UPLOAD_FILES/
  # VIEW_FILES/VIEW_FILE_DETAIL/DELETE_FILE) KHÔNG có trong
  # `permission.constant.ts` — KHÔNG còn đúng, xác nhận trực tiếp source
  # hiện tại cả 4 đã tồn tại trong catalog.
  /api/upload:
    post:
      tags: [Upload]
      summary: Upload file đính kèm chung (permission UPLOAD_FILES)
      description: >
        Đã có `authenticate` + `authorizePermission("UPLOAD_FILES")`.
        DEV-007/IMP-007: `createUploader()` nay giới hạn `allowedTypes`
        (PDF/JPEG/PNG/.docx/.xlsx) — file sai mime-type bị Multer từ chối
        (lỗi rơi vào nhánh 500 chưa chuẩn hoá bên dưới, chưa phân biệt riêng
        lỗi Multer — xem `docs/development/tasks/DEV-007.md` mục Remaining
        Issues, ngoài scope DEV-007). File lưu kèm `uploadedBy` (IMP-008).
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                files:
                  type: array
                  items: { type: string, format: binary }
      responses:
        "200":
          description: Upload thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  message: { type: string }
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/UploadFile" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500":
          description: >
            Lỗi upload (module này chưa dùng ApiError chuẩn hoá) — bao gồm
            cả trường hợp file bị từ chối do sai `allowedTypes`.
          content:
            application/json:
              schema:
                type: object
                properties: { message: { type: string } }
    get:
      tags: [Upload]
      summary: Danh sách file đã upload, chưa xoá (permission VIEW_FILES)
      description: >
        Đã có `authenticate` + `authorizePermission("VIEW_FILES")`.
        DEV-007/IMP-009: user thường chỉ thấy file MÌNH upload (`uploadedBy`),
        ADMIN xem được tất cả. Đã thêm phân trang (`page`/`limit`).
        [MỚI 2026-09-12] Tìm kiếm/lọc (`QueryUploadDTO`) — `keyword` tìm theo
        `fileName` (regex, không phân biệt hoa/thường), `mimeType` khớp
        chính xác, `fromDate`/`toDate` lọc theo `createdAt`, `uploadedBy`
        CHỈ có tác dụng khi caller là ADMIN (non-admin luôn bị ghi đè bằng
        chính họ, IMP-009 không đổi), `sortBy` whitelist 3 field.
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 10 }
        - name: keyword
          in: query
          description: Tìm theo `fileName` (regex, không phân biệt hoa/thường), tối đa 100 ký tự.
          schema: { type: string, maxLength: 100 }
        - name: mimeType
          in: query
          description: Khớp chính xác `mimeType` (vd `application/pdf`).
          schema: { type: string }
        - name: uploadedBy
          in: query
          description: Lọc theo người tải lên — chỉ có tác dụng khi caller là ADMIN.
          schema: { type: string }
        - name: fromDate
          in: query
          schema: { type: string, format: date }
        - name: toDate
          in: query
          schema: { type: string, format: date }
        - name: sortBy
          in: query
          schema: { type: string, enum: [createdAt, fileName, fileSize], default: createdAt }
        - name: order
          in: query
          schema: { type: string, enum: [asc, desc], default: desc }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/UploadFile" }
                  pagination: { $ref: "#/components/schemas/PaginationMeta" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/upload/{id}:
    get:
      tags: [Upload]
      summary: Chi tiết 1 file đã upload (permission VIEW_FILE_DETAIL)
      description: >
        Đã có `authenticate` + `authorizePermission("VIEW_FILE_DETAIL")`.
        DEV-007/IMP-010: chỉ chủ sở hữu (`uploadedBy`) hoặc ADMIN mới xem
        được (đóng IDOR trước đây — mọi user có permission đều xem được
        file người khác).
      parameters: [{ $ref: "#/components/parameters/IdParam" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                description: >
                  [SỬA — FE-15] Trước đây tài liệu sai — response KHÔNG phải
                  `UploadFile` trực tiếp, ĐÃ bọc `{success, data}`
                  (DEV-025/ARCH-23 đồng bộ convention chung).
                properties:
                  success: { type: boolean }
                  data: { $ref: "#/components/schemas/UploadFile" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: Đã xác thực nhưng không có quyền (thiếu permission HOẶC không phải chủ file/ADMIN)
          content:
            application/json:
              schema:
                type: object
                properties: { message: { type: string } }
        "404":
          description: Không tìm thấy file
          content:
            application/json:
              schema:
                type: object
                properties: { message: { type: string } }
    delete:
      tags: [Upload]
      summary: Xoá mềm 1 file đã upload (permission DELETE_FILE)
      description: >
        Đã có `authenticate` + `authorizePermission("DELETE_FILE")`.
        DEV-007/IMP-010: chỉ chủ sở hữu (`uploadedBy`) hoặc ADMIN mới xoá
        được (đóng IDOR trước đây — mọi user có permission đều xoá được
        file người khác).
      parameters: [{ $ref: "#/components/parameters/IdParam" }]
      responses:
        "200":
          description: Xoá thành công
          content:
            application/json:
              schema:
                type: object
                properties: { success: { type: boolean }, message: { type: string } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: Đã xác thực nhưng không có quyền (thiếu permission HOẶC không phải chủ file/ADMIN)
          content:
            application/json:
              schema:
                type: object
                properties: { message: { type: string } }
        "404":
          description: Không tìm thấy file
          content:
            application/json:
              schema:
                type: object
                properties: { message: { type: string } }

  /api/upload/{id}/download:
    get:
      tags: [Upload]
      summary: Tải nội dung file thật (permission VIEW_FILE_DETAIL) — MỚI (FE-15, 2026-09-10)
      description: >
        Trước đây `fileUrl` (`UploadFile.fileUrl`, dạng `/uploads/<filename>`)
        là đường dẫn CHẾT — không có `express.static` nào phục vụ thư mục
        `uploads/`, FE không có cách nào thực sự tải được nội dung file. Route
        này thêm để lấp gap đó — CHỦ Ý dùng endpoint có `authenticate` +
        cùng guard ownership/ADMIN với `GET /api/upload/{id}` (KHÔNG dùng
        `express.static` cho cả thư mục — sẽ bỏ qua mọi access control, làm
        lộ file của người khác cho bất kỳ ai biết/đoán được URL).
      parameters: [{ $ref: "#/components/parameters/IdParam" }]
      responses:
        "200":
          description: Nội dung file (Content-Disposition attachment, tên file gốc)
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: Đã xác thực nhưng không có quyền (thiếu permission HOẶC không phải chủ file/ADMIN)
          content:
            application/json:
              schema:
                type: object
                properties: { message: { type: string } }
        "404":
          description: Không tìm thấy file (đã xoá, hoặc file không còn tồn tại trên đĩa)
          content:
            application/json:
              schema:
                type: object
                properties: { message: { type: string } }

