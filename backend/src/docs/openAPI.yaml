openapi: 3.0.3
info:
  title: Document Manager API
  description: |
    API quản lý giấy tờ (Document/Proposal/Report), tài sản CNTT (Asset),
    workflow duyệt nhiều bước, RBAC (Role/Permission/Policy), phòng ban,
    thông báo, import/export Excel và audit log.

    **Xác thực:** Bearer JWT (access token, thời hạn ngắn) — lấy qua
    `POST /api/auths/login`, làm mới qua `POST /api/auths/refresh-token`.
  version: 1.0.0
  contact:
    name: Document Manager Backend Team

servers:
  - url: http://localhost:3000
    description: Local development

tags:
  - name: Auth
    description: Đăng ký, đăng nhập, refresh token, quên/đặt lại mật khẩu
  - name: Users
    description: Quản lý tài khoản người dùng
  - name: RBAC - Permissions
  - name: RBAC - Roles
  - name: RBAC - Policies
    description: Attribute-Based Access Control (ABAC) — điều kiện động ngoài Role/Permission tĩnh
  - name: Departments
    description: Quản lý khoa/phòng ban
  - name: Documents
    description: Giấy đề xuất (PROPOSAL) và biên bản (REPORT)
  - name: Workflow
    description: Luồng duyệt nhiều bước cho Document
  - name: Assets
    description: Quản lý tài sản CNTT
  - name: Asset Categories
  - name: Asset Assignment
    description: Cấp phát / luân chuyển / thu hồi tài sản
  - name: Medical Device
    description: >
      Profile tuân thủ pháp lý cho thiết bị y tế — mở rộng đồng hành với
      Asset (quan hệ 1-1, KHÔNG phải collection/API tách biệt). Mọi thao
      tác vòng đời khác của thiết bị (CRUD, cấp phát, Excel, QR code...)
      vẫn dùng API Assets sẵn có.
  - name: Dashboard
    description: Thống kê tổng hợp và KPI
  - name: Notifications
  - name: Excel
    description: Import/Export dữ liệu qua file Excel
  - name: Upload
    description: Upload file đính kèm chung
  - name: User Audit
    description: Nhật ký thao tác hệ thống (audit trail)
  - name: Performance
    description: Thống kê hiệu năng API (nội bộ)
  - name: Inventory
    description: >
      Roadmap B3 (2026-09-15) — Quản lý vật tư tiêu hao (Consumables), tách
      biệt hoàn toàn với Assets (tài sản cố định). Tồn kho theo từng khoa/
      phòng ban, đầy đủ lịch sử giao dịch nhập/xuất, cảnh báo tồn kho thấp
      tự động.
  - name: Vendors
    description: >
      Roadmap B4 (2026-09-16) — Quản lý nhà cung cấp (Vendor). Module MỚI,
      liên kết với Assets qua Contract.
  - name: Contracts
    description: >
      Roadmap B4 (2026-09-16) — Hợp đồng bảo trì/bảo hành ký với 1 Vendor,
      áp dụng cho nhiều Asset cùng lúc. Cảnh báo tự động khi sắp hết hạn.

security:
  - bearerAuth: []

paths:
  # ================= AUTH =================
  /api/auths/register:
    post:
      tags: [Auth]
      summary: Đăng ký tài khoản mới
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterRequest" }
      responses:
        "201":
          description: Đăng ký thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  user: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /api/auths/login:
    post:
      tags: [Auth]
      summary: Đăng nhập
      description: >
        [SỬA 2026-09-19, Roadmap C1] Nếu tài khoản đã bật xác thực 2 lớp
        (`twoFactorEnabled`), `data` trả về `AuthLoginPendingTwoFactor`
        (KHÔNG có token) thay vì `AuthLoginResult` — FE phải gọi tiếp
        `POST /api/auths/login/verify-otp` với mã OTP vừa gửi qua email để
        hoàn tất đăng nhập và nhận token thật.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: Đăng nhập thành công, HOẶC yêu cầu xác thực 2 lớp bước 2 (xem `description`)
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  data:
                    oneOf:
                      - $ref: "#/components/schemas/AuthLoginResult"
                      - $ref: "#/components/schemas/AuthLoginPendingTwoFactor"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /api/auths/login/verify-otp:
    post:
      tags: [Auth]
      summary: Bước 2 đăng nhập khi tài khoản đã bật 2FA — xác thực mã OTP gửi qua email
      description: >
        [MỚI 2026-09-19, Roadmap C1, DEV-068] KHÔNG cần gửi lại password —
        `username`/`password` đã được xác thực đúng ở `POST /api/auths/login`
        (bước đó mới sinh ra OTP). Mã OTP hết hạn sau 10 phút, tối đa 5 lần
        nhập sai (sai quá số lần → phải đăng nhập lại từ đầu để nhận mã mới).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VerifyLoginOtpRequest" }
      responses:
        "200":
          description: Đăng nhập thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  data: { $ref: "#/components/schemas/AuthLoginResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /api/auths/2fa/enable:
    post:
      tags: [Auth]
      summary: Bắt đầu bật xác thực 2 lớp cho chính mình — gửi mã OTP xác nhận qua email
      description: >
        [MỚI 2026-09-19, Roadmap C1, DEV-068] Self-service, opt-in (KHÔNG bắt
        buộc). CHỈ role ADMIN/TRUONG_KHOA/DIEU_DUONG_TRUONG/BAN_GIAM_DOC bật
        được (403 nếu role khác), và PHẢI đã có `email` (400 nếu chưa có —
        liên hệ IT/Quản trị để bổ sung trước, xem `DEV-066.md`). CHƯA bật cờ
        `twoFactorEnabled` ngay — chỉ gửi OTP, phải gọi tiếp
        `POST /api/auths/2fa/confirm` với mã đúng mới thực sự bật.
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Đã gửi mã OTP qua email
          content:
            application/json:
              schema:
                type: object
                properties: { message: { type: string } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /api/auths/2fa/confirm:
    post:
      tags: [Auth]
      summary: Xác nhận mã OTP để hoàn tất bật xác thực 2 lớp
      description: "[MỚI 2026-09-19, Roadmap C1, DEV-068]"
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConfirmTwoFactorRequest" }
      responses:
        "200":
          description: Đã bật xác thực 2 lớp
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  data:
                    type: object
                    properties: { twoFactorEnabled: { type: boolean, example: true } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/auths/2fa/disable:
    post:
      tags: [Auth]
      summary: Tự tắt xác thực 2 lớp cho chính mình
      description: >
        [MỚI 2026-09-19, Roadmap C1, DEV-068] Yêu cầu nhập lại PASSWORD hiện
        tại (KHÔNG cần OTP) — chặn trường hợp phiên đăng nhập bị chiếm cũng đủ
        để âm thầm tắt lớp bảo vệ này.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DisableTwoFactorRequest" }
      responses:
        "200":
          description: Đã tắt xác thực 2 lớp
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  data:
                    type: object
                    properties: { twoFactorEnabled: { type: boolean, example: false } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/auths/sessions:
    get:
      tags: [Auth]
      summary: Danh sách phiên đăng nhập CÒN HIỆU LỰC của chính mình
      description: >
        [MỚI 2026-09-19, Roadmap C2, DEV-069] Self-service, KHÔNG cần
        permission riêng. `isCurrent` xác định bằng heuristic so khớp
        User-Agent + IP của request hiện tại với từng phiên đã lưu (KHÔNG
        cần gửi lại refreshToken).
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Danh sách phiên đăng nhập
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Session" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/auths/sessions/{id}:
    delete:
      tags: [Auth]
      summary: Thu hồi 1 phiên đăng nhập của chính mình
      description: >
        [MỚI 2026-09-19, Roadmap C2, DEV-069] Chỉ thu hồi được phiên THUỘC
        VỀ chính người gọi — trả 404 (không phải 403) nếu id không tồn tại
        hoặc thuộc về user khác, tránh lộ thông tin phiên đó có tồn tại hay
        không. Nếu thu hồi ĐÚNG phiên đang dùng để gọi API này, access token
        hiện tại vẫn còn hiệu lực tới khi hết hạn tự nhiên (JWT stateless)
        nhưng KHÔNG refresh được nữa — FE tự đăng xuất cục bộ ngay sau khi
        gọi thành công.
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/IdParam" }]
      responses:
        "200":
          description: Đã thu hồi phiên đăng nhập
          content:
            application/json:
              schema:
                type: object
                properties: { message: { type: string } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/auths/refresh-token:
    post:
      tags: [Auth]
      summary: Làm mới access token bằng refresh token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RefreshTokenRequest" }
      responses:
        "200":
          description: Access token mới
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessToken: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /api/auths/logout:
    post:
      tags: [Auth]
      summary: Đăng xuất (thu hồi refresh token hiện tại)
      description: >
        ⚠️ Route này KHÔNG có `validateBody` (khác các route auth khác) —
        `refreshToken` được service tự kiểm tra thủ công (không qua Zod),
        vẫn trả 400 nếu thiếu nhưng không có DTO validate format.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RefreshTokenRequest" }
      responses:
        "200":
          description: Đăng xuất thành công
          content:
            application/json:
              schema:
                type: object
                properties: { message: { type: string } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/auths/forgot-password:
    post:
      tags: [Auth]
      summary: Gửi email hướng dẫn đặt lại mật khẩu
      description: >
        Luôn trả về message chung (không tiết lộ username có tồn tại hay
        không — chống user enumeration).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ForgotPasswordRequest" }
      responses:
        "200":
          description: Luôn trả 200 kể cả username không tồn tại
          content:
            application/json:
              schema:
                type: object
                properties: { message: { type: string } }
        "400": { $ref: "#/components/responses/BadRequest" }

  /api/auths/reset-password:
    post:
      tags: [Auth]
      summary: Đặt lại mật khẩu bằng token nhận qua email
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ResetPasswordRequest" }
      responses:
        "200":
          description: Đặt lại mật khẩu thành công
          content:
            application/json:
              schema:
                type: object
                properties: { message: { type: string } }
        "400": { $ref: "#/components/responses/BadRequest" }

  # ================= USERS =================
  /api/users:
    post:
      tags: [Users]
      summary: Tạo user mới (permission USER_CREATE)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateUserRequest" }
      responses:
        "200":
          description: Tạo user thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  data:
                    type: object
                    properties:
                      id: { $ref: "#/components/schemas/ObjectIdRef" }
                      username: { type: string }
                      role: { type: object }
                      department: { type: object }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
    get:
      tags: [Users]
      summary: Danh sách user (permission USER_VIEW)
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/LimitParam"
        - name: role
          in: query
          schema: { $ref: "#/components/schemas/ObjectIdRef" }
        - name: department
          in: query
          schema: { $ref: "#/components/schemas/ObjectIdRef" }
        - name: isActive
          in: query
          schema: { type: string, enum: ["true", "false"] }
        - $ref: "#/components/parameters/KeywordParam"
        - name: sortBy
          in: query
          schema:
            {
              type: string,
              enum: [createdAt, updatedAt, username, fullName],
              default: createdAt,
            }
        - $ref: "#/components/parameters/OrderParam"
        - name: fromDate
          in: query
          schema: { type: string, format: date }
        - name: toDate
          in: query
          schema: { type: string, format: date }
      responses:
        "200":
          description: Danh sách user
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: boolean }
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/User" }
                  pagination: { $ref: "#/components/schemas/PaginationMeta" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/users/me:
    get:
      tags: [Users]
      summary: Thông tin cá nhân (user đang đăng nhập)
      description: >
        RBAC MICRO-FIX (docs/frontend/tasks/FE-00.md Mục 10.1): response giờ
        có `role.isSystemRole` + `permissions[]` (effective permission đã
        resolve tên, REUSE getCachedPermissions/getUserEffectivePermissions —
        không tính riêng cho endpoint này). Additive — mọi field cũ giữ
        nguyên, không breaking change.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: string }
                  data: { $ref: "#/components/schemas/MeResponseUser" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    patch:
      tags: [Users]
      summary: Cập nhật thông tin cá nhân
      description: >
        ⚠️ Route dùng chung DTO `UpdateUserDTO` ở tầng validate (chấp nhận cả
        role/department/isActive trong body mà không báo lỗi), nhưng tầng
        service (`updateMeService`) chỉ thực sự áp dụng 3 field
        `fullName`/`username`/`subscribedToWeeklyReport` (Roadmap B7, thêm
        2026-09-18) — mọi field khác bị whitelist âm thầm bỏ qua. Schema
        request bên dưới phản ánh đúng field CÓ TÁC DỤNG thật.

        Đổi `username` trùng với user khác trả 409 (Conflict) — trước đây
        (đến 2026-09-10) thiếu check này, ném thẳng lỗi driver MongoDB
        E11000 ra ngoài, `error.middleware.ts` không nhận diện riêng nên trả
        500 generic. Đã sửa: `updateMeService` thêm pre-check giống
        `PUT /users/{id}`, `error.middleware.ts` cũng thêm nhánh lưới đỡ
        chung cho MỌI lỗi E11000 chưa được pre-check ở tầng service (áp dụng
        toàn app, không riêng route này).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateMeRequest" }
      responses:
        "200":
          description: Cập nhật thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  message: { type: string }
                  data: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }

  # [MỚI 2026-09-16, DEV-060] Xoá mềm hàng loạt — permission USER_DELETE y hệt DELETE /:id.
  /api/users/bulk-delete:
    post:
      tags: [Users]
      summary: Vô hiệu hoá hàng loạt user - soft delete (permission USER_DELETE)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BulkDeleteRequest" }
      responses:
        "200":
          description: OK (có thể có phần tử `failed` nếu 1 vài user không xoá được)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BulkDeleteResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/users/bulk-restore:
    post:
      tags: [Users]
      summary: Khôi phục hàng loạt user (permission USER_RESTORE — dùng lại đúng permission của khôi phục từng dòng)
      description: "[MỚI 2026-09-17, DEV-062]"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BulkDeleteRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BulkDeleteResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/users/{id}:
    get:
      tags: [Users]
      summary: Chi tiết user (permission USER_VIEW_DETAIL)
      parameters: [{ $ref: "#/components/parameters/IdParam" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  data: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [Users]
      summary: Cập nhật user (permission USER_UPDATE)
      parameters: [{ $ref: "#/components/parameters/IdParam" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateUserRequest" }
      responses:
        "200":
          description: Cập nhật thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  data: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
