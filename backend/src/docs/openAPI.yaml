  # ================= DOCUMENTS =================
  /api/documents/proposal:
    post:
      tags: [Documents]
      summary: Tạo Document (Proposal/Report)
      description: >
        ⚠️ GHI CHÚ TỪ REVIEW BẢO MẬT: route này hiện chỉ yêu cầu `authenticate`,
        middleware `authorizePermission("DOCUMENT_CREATE")` đang bị comment
        trong code — mọi user đã đăng nhập đều tạo được Document bất kể quyền.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateDocumentRequest" }
      responses:
        "201":
          description: Tạo thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  message: { type: string }
                  data: { $ref: "#/components/schemas/Document" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/documents:
    get:
      tags: [Documents]
      summary: Danh sách Document (permission DOCUMENT_READ)
      description: >
        ⚠️ GHI CHÚ TỪ REVIEW: `validateQuery(QueryDocumentDTO)` hiện bị
        comment ở route — các query bên dưới KHÔNG thực sự được Zod validate/
        coerce trước khi vào service (dù DTO đã viết đầy đủ). Ngoài ra,
        `getAllDocumentsService` có 2 lỗi logic đã biết: (1) filter
        `isActive` bị gán nhầm biến nên luôn ép `true` bất kể query truyền
        gì; (2) `Object.assign(filter, filters)` không whitelist field, tăng
        rủi ro filter Mongo không kiểm soát.
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/LimitParam"
        - name: sortBy
          in: query
          schema: { type: string, enum: [createdAt, updatedAt, title, documentCode, serviceDate, actualCost], default: createdAt }
        - $ref: "#/components/parameters/OrderParam"
        - $ref: "#/components/parameters/KeywordParam"
        - name: isActive
          in: query
          schema: { type: string, enum: ["true", "false"] }
        - name: category
          in: query
          schema: { type: string, enum: [PROPOSAL, REPORT] }
        - name: subType
          in: query
          schema: { type: string }
        - name: department
          in: query
          schema: { $ref: "#/components/schemas/ObjectIdRef" }
        - name: createdBy
          in: query
          schema: { $ref: "#/components/schemas/ObjectIdRef" }
        - name: relatedAsset
          in: query
          schema: { $ref: "#/components/schemas/ObjectIdRef" }
        - name: workflowStatus
          in: query
          schema: { type: string, enum: [pending, approved, rejected, cancelled, completed] }
        - name: fromDate
          in: query
          schema: { type: string, format: date }
        - name: toDate
          in: query
          schema: { type: string, format: date }
      responses:
        "200":
          description: Danh sách Document
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Document" }
                  pagination: { $ref: "#/components/schemas/PaginationMeta" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/documents/{id}:
    get:
      tags: [Documents]
      summary: Chi tiết Document (permission DOCUMENT_DETAIL)
      parameters: [{ $ref: "#/components/parameters/IdParam" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  message: { type: string }
                  data: { $ref: "#/components/schemas/Document" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [Documents]
      summary: Cập nhật Document (permission DOCUMENT_UPDATE)
      description: >
        Chỉ `title`/`meta` thực sự có tác dụng (whitelist tầng service).
        Bị khoá nếu Document đã workflowStatus=approved, hoặc khác department
        của người gọi (trừ ADMIN).
      parameters: [{ $ref: "#/components/parameters/IdParam" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateDocumentRequest" }
      responses:
        "200":
          description: Cập nhật thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  message: { type: string }
                  data: { $ref: "#/components/schemas/Document" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Documents]
      summary: Xoá mềm Document (permission DOCUMENT_DELETE)
      parameters: [{ $ref: "#/components/parameters/IdParam" }]
      responses:
        "200":
          description: Xoá thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  message: { type: string }
                  data: { $ref: "#/components/schemas/ObjectIdRef" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

