  /api/assets/import:
    post:
      tags: [Assets]
      summary: Import tài sản hàng loạt từ Excel (permission ASSET_EXCEL_IMPORT)
      description: >
        CHỈ TẠO MỚI (không update tài sản đã tồn tại) — cố tình không cho đổi
        department/status/assignedTo qua import để không bỏ qua audit trail
        của assign/transfer/return. Dùng `?dryRun=true` để xem trước, không
        ghi DB. File mẫu: cột Danh mục (mã)/Tên tài sản/Khoa-phòng (mã)/Số
        serial/Model/Hãng SX/Vị trí/Ngày mua/Giá mua/Hạn bảo hành/Nhà cung
        cấp — 3 cột đầu bắt buộc.
      parameters:
        - name: dryRun
          in: query
          schema: { type: boolean, default: false }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary, description: "File .xlsx/.xls, tối đa 5MB" }
      responses:
        "200":
          description: Kết quả import (hoặc preview nếu dryRun)
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  data: { $ref: "#/components/schemas/ImportAssetsResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

