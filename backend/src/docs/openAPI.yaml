        "403": { $ref: "#/components/responses/Forbidden" }

  # ================= NOTIFICATIONS =================
  /api/notifications:
    get:
      tags: [Notifications]
      summary: Danh sách thông báo của user đang đăng nhập
      description: >
        `recipient` luôn lấy từ token đăng nhập, không nhận qua query
        (chống IDOR — không xem được thông báo của người khác).
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: isRead
          in: query
          schema: { type: string, enum: ["true", "false"] }
        - name: type
          in: query
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  message: { type: string }
                  data:
                    type: object
                    description: >
                      [SỬA — trước đây tài liệu sai là `{items, pagination}`]
                      Response THẬT (`getNotificationsForUser`) có pagination
                      field PHẲNG cùng cấp `items`, KHÔNG lồng object
                      `pagination` riêng.
                    properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/Notification" }
                      total: { type: integer }
                      unreadCount: { type: integer }
                      page: { type: integer }
                      limit: { type: integer }
                      totalPages: { type: integer }
        "401": { $ref: "#/components/responses/Unauthorized" }

