  # ================= UPLOAD =================
  # ⚠️ GHI CHÚ: đã có source route thật (upload.routes.ts). Đã cập nhật
  # đúng authenticate + authorizePermission theo code thật — KHÔNG còn là
  # đề xuất. NHƯNG: 4 permission string dùng ở đây (UPLOAD_FILES/
  # VIEW_FILES/VIEW_FILE_DETAIL/DELETE_FILE) KHÔNG có trong
  # `permission.constant.ts` (bản mới nhất đã đọc, từ file cập nhật RBAC
  # medical device) — cùng lỗi permission-string-mismatch đã phát hiện ở
  # Document/User/Policy/Dashboard (báo cáo review mục 10.5/13.3). Nếu
  # PERMISSIONS chưa được bổ sung 4 giá trị này, route KHÔNG role nào
  # (ngoài ADMIN bypass) gán được quyền qua seed mặc định.
  /api/upload:
    post:
      tags: [Upload]
      summary: Upload file đính kèm chung (permission UPLOAD_FILES)
      description: >
        Đã có `authenticate` + `authorizePermission("UPLOAD_FILES")` —
        khắc phục lỗ hổng public trước đây (mục 10.1/13.2 báo cáo review).
        ⚠️ Permission `UPLOAD_FILES` chưa thấy trong `permission.constant.ts`
        — xem ghi chú đầu mục Upload. `createUploader()` vẫn gọi KHÔNG
        tham số (không whitelist `allowedTypes`) — vẫn nhận mọi mime-type,
        khuyến nghị cũ ở mục 13.2 về việc này vẫn còn nguyên giá trị.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                files:
                  type: array
                  items: { type: string, format: binary }
      responses:
        "200":
          description: Upload thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/UploadFile" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500":
          description: Lỗi upload (module này chưa dùng ApiError chuẩn hoá)
          content:
            application/json:
              schema:
                type: object
                properties: { message: { type: string } }
    get:
      tags: [Upload]
      summary: Danh sách file đã upload, chưa xoá (permission VIEW_FILES)
      description: >
        Đã có `authenticate` + `authorizePermission("VIEW_FILES")`. ⚠️
        Permission `VIEW_FILES` chưa thấy trong `permission.constant.ts` —
        xem ghi chú đầu mục Upload.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/UploadFile" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/upload/{id}:
    get:
      tags: [Upload]
      summary: Chi tiết 1 file đã upload (permission VIEW_FILE_DETAIL)
      description: >
        Đã có `authenticate` + `authorizePermission("VIEW_FILE_DETAIL")`.
        ⚠️ Permission `VIEW_FILE_DETAIL` chưa thấy trong
        `permission.constant.ts` — xem ghi chú đầu mục Upload.
      parameters: [{ $ref: "#/components/parameters/IdParam" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UploadFile" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: Không tìm thấy file
          content:
            application/json:
              schema:
                type: object
                properties: { message: { type: string } }
    delete:
      tags: [Upload]
      summary: Xoá mềm 1 file đã upload (permission DELETE_FILE)
      description: >
        Đã có `authenticate` + `authorizePermission("DELETE_FILE")`. ⚠️
        Permission `DELETE_FILE` chưa thấy trong `permission.constant.ts` —
        xem ghi chú đầu mục Upload. Khuyến nghị cũ (mục 13.2) vẫn còn giá
        trị: nên giới hạn thêm ở tầng service — chỉ chính người đã upload
        file đó hoặc ADMIN mới xoá được (chống IDOR) — chưa xác nhận được
        đã áp dụng hay chưa vì chỉ có route file, chưa có
        `upload.controller.ts`/`upload.service.ts` mới.
      parameters: [{ $ref: "#/components/parameters/IdParam" }]
      responses:
        "200":
          description: Xoá thành công
          content:
            application/json:
              schema:
                type: object
                properties: { message: { type: string } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: Không tìm thấy file
          content:
            application/json:
              schema:
                type: object
                properties: { message: { type: string } }

