        "404": { $ref: "#/components/responses/NotFound" }

  /api/assets/{id}/documents:
    get:
      tags: [Assets]
      summary: Danh sách tài liệu liên quan tới 1 tài sản (permission DOCUMENT_READ)
      description: >
        Dùng chung permission DOCUMENT_READ (không phải ASSET_*) vì dữ liệu
        trả về là Document — đúng permission bảo vệ resource thật sự được
        đọc. Gọi lại y hệt GET /api/documents (cùng service, cùng bộ
        filter/sort/pagination) nhưng ép cứng `relatedAsset = :id` từ URL.
        Có thể lọc thêm qua query string như bình thường, ví dụ chỉ lấy
        manual: `?subType=MANUAL`.


        ⚠️ Khác với GET /api/documents (dùng QueryDocumentDTO validate/coerce
        query), route này KHÔNG có validateQuery — `page`/`limit` không được
        ép kiểu number, filter không được whitelist qua DTO. Coi giá trị trả
        về là "best effort", không đảm bảo validate chặt như endpoint
        documents gốc.


        Đây là bước "nối QR tới thông tin thiết bị": FE quét QR (chỉ encode
        assetCode) → gọi GET /api/assets/lookup/{assetCode} lấy assetId →
        gọi endpoint này lấy danh sách manual/tài liệu.
      parameters:
        - { $ref: "#/components/parameters/IdParam" }
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, default: 10 }
        - name: category
          in: query
          schema: { type: string, enum: [PROPOSAL, REPORT, REFERENCE] }
        - name: subType
          in: query
          schema:
            type: string
            enum:
              [
                PROPOSE_REPAIR,
                PROPOSE_INK,
                PROPOSE_PROCUREMENT,
                CHECK_DAMAGE,
                CONFIRM_STATUS,
                MANUAL,
              ]
        - name: isActive
          in: query
          schema: { type: boolean }
        - name: keyword
          in: query
          schema: { type: string, maxLength: 100 }
        - name: sortBy
          in: query
          schema:
            type: string
            enum:
              [
                createdAt,
                updatedAt,
                title,
                documentCode,
                serviceDate,
                actualCost,
              ]
            default: createdAt
        - name: order
          in: query
          schema: { type: string, enum: [asc, desc], default: desc }
        - name: workflowStatus
          in: query
          schema:
            type: string
            enum: [pending, approved, rejected, cancelled, completed]
        - name: createdBy
          in: query
          schema: { type: string, pattern: "^[0-9a-fA-F]{24}$" }
        - name: department
          in: query
          schema: { type: string, pattern: "^[0-9a-fA-F]{24}$" }
        - name: fromDate
          in: query
          schema: { type: string, format: date }
        - name: toDate
          in: query
          schema: { type: string, format: date }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Document" }
                  pagination: { $ref: "#/components/schemas/PaginationMeta" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ================= MEDICAL DEVICE =================
  # ⚠️ GHI CHÚ: route file gốc (`medicalDevice.routes.ts`) chỉ định nghĩa
  # path tương đối "/:assetId/profile" — file `app.ts` (nơi mount prefix)
  # KHÔNG có trong lần cung cấp source này. Prefix `/api/medical-devices`
  # dưới đây là GIẢ ĐỊNH theo đúng quy ước đặt tên đang dùng trong dự án
  # (số nhiều, kebab-case — như `/api/asset-categories`). Vui lòng xác nhận
  # lại đúng prefix thật trong `app.ts` (dòng `app.use("/api/...", ...)`)
  # và báo lại nếu khác, để cập nhật chính xác.
  /api/assets/medical-devices/{assetId}/profile:
    post:
      tags: [Medical Device]
      summary: Gắn profile thiết bị y tế cho 1 Asset đã tồn tại (permission MEDICAL_DEVICE_CREATE)
      description: >
        Yêu cầu Asset phải tồn tại và đang active, và CHƯA có profile nào
        khác gắn vào (unique 1-1) — nếu đã có, dùng PUT để cập nhật thay vì
        gọi lại POST.
      parameters:
        - name: assetId
          in: path
          required: true
          schema: { type: string, pattern: "^[0-9a-fA-F]{24}$" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              { $ref: "#/components/schemas/CreateMedicalDeviceProfileRequest" }
      responses:
        "201":
          description: Tạo thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  data: { $ref: "#/components/schemas/MedicalDeviceProfile" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    get:
      tags: [Medical Device]
      summary: Xem profile thiết bị y tế theo Asset (permission MEDICAL_DEVICE_VIEW)
      parameters:
        - name: assetId
          in: path
          required: true
          schema: { type: string, pattern: "^[0-9a-fA-F]{24}$" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  data: { $ref: "#/components/schemas/MedicalDeviceProfile" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: Asset không tồn tại, hoặc Asset chưa có profile thiết bị y tế nào (dùng POST để tạo trước)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
    put:
      tags: [Medical Device]
      summary: Cập nhật profile thiết bị y tế (permission MEDICAL_DEVICE_UPDATE)
      description: >
        Whitelist field ở tầng service — chỉ deviceClass/registrationNumber/
        licenseExpiredAt/requiresCalibration/calibrationIntervalMonths/
        operatorCertificateRequired thực sự có tác dụng.
      parameters:
        - name: assetId
          in: path
          required: true
          schema: { type: string, pattern: "^[0-9a-fA-F]{24}$" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              { $ref: "#/components/schemas/UpdateMedicalDeviceProfileRequest" }
      responses:
        "200":
          description: Cập nhật thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  data: { $ref: "#/components/schemas/MedicalDeviceProfile" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ---- GIAI ĐOẠN 2 — Ghi nhận kiểm định (Calibration Record) ----
  /api/assets/medical-devices/{assetId}/calibration-records:
    post:
      tags: [Medical Device]
      summary: >-
        Ghi nhận 1 lần kiểm định mới (permission MEDICAL_DEVICE_CALIBRATE)
      description: >
        Permission RIÊNG biệt với MEDICAL_DEVICE_UPDATE (PUT /profile) — đây
        là hành động nghiệp vụ có tính pháp lý (bằng chứng thanh tra), không
        phải chỉnh sửa thông tin thông thường. Asset phải đang active và đã
        có Medical Device Profile từ trước (dùng POST .../profile để tạo
        nếu chưa có). Tự động cập nhật `lastCalibrationDate` /
        `nextCalibrationDueDate` trên profile và reset
        `calibrationAlertSentAt` (cho phép cron gửi cảnh báo mới khi tới hạn
        kế tiếp).


        ⚠️ GIAI ĐOẠN 5: request gửi dạng `multipart/form-data` để hỗ trợ
        đính kèm file giấy chứng nhận kiểm định thật qua field
        `certificateFile` (PDF/JPEG/PNG, tối đa 10MB) — TUỲ CHỌN, có thể bỏ
        trống và dùng field `certificateFileUrl` (string, nhập tay link có
        sẵn) như trước. KHÔNG được gửi CẢ HAI cùng lúc — trả `400` nếu vi
        phạm.
      parameters:
        - name: assetId
          in: path
          required: true
          schema: { type: string, pattern: "^[0-9a-fA-F]{24}$" }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [calibratedAt, calibratedBy, result, nextDueDate]
              description: >
                `nextDueDate` bắt buộc nhập tay và phải SAU `calibratedAt`.
                `calibratedAt` phải mới hơn lần kiểm định gần nhất đã ghi
                nhận cho thiết bị này (409 nếu không thoả). Chỉ cung cấp 1
                trong 2: `certificateFile` HOẶC `certificateFileUrl`, không
                cả hai.
              properties:
                calibratedAt: { type: string, format: date-time }
                calibratedBy:
                  type: string
                  minLength: 1
                  description: Tên đơn vị kiểm định bên ngoài hệ thống.
                result: { $ref: "#/components/schemas/CalibrationResult" }
                nextDueDate: { type: string, format: date-time }
                certificateFile:
                  type: string
                  format: binary
                  description: >-
                    Tuỳ chọn — PDF/JPEG/PNG, tối đa 10MB. Không gửi kèm nếu
                    đã dùng certificateFileUrl.
                certificateFileUrl:
                  type: string
                  description: >-
                    Tuỳ chọn thay thế cho certificateFile — link nhập tay
                    tới file đã có sẵn.
      responses:
        "201":
          description: Ghi nhận thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  data: { $ref: "#/components/schemas/CalibrationRecord" }
        "400":
          description: >-
            Lỗi validate, hoặc gửi CẢ HAI certificateFile lẫn
            certificateFileUrl cùng lúc
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: Asset không tồn tại/không active, hoặc chưa có Medical Device Profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "409":
          description: >-
            calibratedAt không mới hơn lần kiểm định gần nhất đã ghi nhận
            cho thiết bị này
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
    get:
      tags: [Medical Device]
      summary: Lịch sử kiểm định theo thiết bị (permission MEDICAL_DEVICE_VIEW)
      description: Có phân trang, sắp xếp mới nhất trước theo `calibratedAt`.
      parameters:
        - name: assetId
          in: path
          required: true
          schema: { type: string, pattern: "^[0-9a-fA-F]{24}$" }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, default: 20 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/CalibrationRecord" }
                  pagination: { $ref: "#/components/schemas/PaginationMeta" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: Asset không tồn tại, hoặc chưa có Medical Device Profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /api/assets/medical-devices/{assetId}/calibration-records/{recordId}/certificate/download:
    get:
      tags: [Medical Device]
      summary: >-
        Tải file giấy chứng nhận kiểm định thật (permission
        MEDICAL_DEVICE_VIEW) — A2, 2026-09-15
      description: >
        Chỉ dùng được khi bản ghi có `certificateFileId` (upload file thật
        lúc tạo) — trả 404 nếu bản ghi chỉ có `certificateFileUrl` dạng link
        nhập tay (mở trực tiếp link đó thay vì gọi endpoint này) hoặc không
        đính kèm gì. Cùng permission với xem lịch sử kiểm định (KHÔNG
        ownership-check như `GET /api/upload/{id}/download` — giấy chứng
        nhận thuộc về thiết bị/khoa phòng, không phải riêng người upload).
      parameters:
        - name: assetId
          in: path
          required: true
          schema: { type: string, pattern: "^[0-9a-fA-F]{24}$" }
        - name: recordId
          in: path
          required: true
          schema: { type: string, pattern: "^[0-9a-fA-F]{24}$" }
      responses:
        "200":
          description: Nội dung file nhị phân (PDF/JPEG/PNG)
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "400":
          description: assetId/recordId không đúng định dạng ObjectId
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: >-
            Không tìm thấy profile/bản ghi kiểm định, bản ghi không có file
            đính kèm (chỉ có link nhập tay hoặc không có gì), hoặc file
            không còn tồn tại trên server
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /api/assets/medical-devices/{assetId}/calibration-records/{recordId}/certificate:
    put:
      tags: [Medical Device]
      summary: >-
        Thay thế chứng nhận đã lưu — sửa lỗi upload nhầm file (permission
        MEDICAL_DEVICE_CALIBRATE), bổ sung sau A2 theo yêu cầu user
      description: >
        Chỉ đổi chứng nhận (`certificateFileId`/`certificateFileUrl`) — mọi
        field khác của bản ghi (`calibratedAt`, `result`, `nextDueDate`, ...)
        và `MedicalDeviceProfile` liên quan giữ nguyên, KHÔNG bị đụng tới.
        Request `multipart/form-data` khi thay bằng file mới (field
        `certificateFile`), hoặc JSON thuần khi thay bằng link mới (field
        `certificateFileUrl`) — bắt buộc cung cấp ĐÚNG 1 trong 2, không được
        cả hai và không được để trống cả hai. Thay bằng file mới sẽ soft-delete
        (KHÔNG xoá vật lý) file cũ nếu bản ghi trước đó có file thật.
      parameters:
        - name: assetId
          in: path
          required: true
          schema: { type: string, pattern: "^[0-9a-fA-F]{24}$" }
        - name: recordId
          in: path
          required: true
          schema: { type: string, pattern: "^[0-9a-fA-F]{24}$" }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                certificateFile:
                  type: string
                  format: binary
                  description: PDF/JPEG/PNG, tối đa 10MB. Không gửi kèm nếu dùng certificateFileUrl.
                certificateFileUrl:
                  type: string
                  description: Tuỳ chọn thay thế cho certificateFile — link mới.
          application/json:
            schema:
              type: object
              properties:
                certificateFileUrl: { type: string }
      responses:
        "200":
          description: Cập nhật thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  data: { $ref: "#/components/schemas/CalibrationRecord" }
        "400":
          description: >-
            ID không hợp lệ, gửi CẢ certificateFile lẫn certificateFileUrl,
            hoặc KHÔNG gửi cái nào
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: Không tìm thấy profile thiết bị y tế hoặc bản ghi kiểm định
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /api/assets/medical-devices/alerts/run:
    post:
      tags: [Medical Device]
      summary: Chạy tay kiểm tra cảnh báo kiểm định sắp/đã quá hạn (permission MEDICAL_DEVICE_ALERTS_TRIGGER)
      description: >
        Bình thường chạy tự động qua cron — endpoint này để test/demo thủ
        công. Chỉ quét profile có `requiresCalibration = true` và Asset liên
        kết đang active. Gửi thông báo cho role "IT" khi thiết bị còn ≤30
        ngày tới hạn kiểm định (hoặc đã quá hạn), đúng 1 lần cho mỗi profile
        (dùng `calibrationAlertSentAt` để chống gửi trùng).
      responses:
        "200":
          description: Chạy thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  data:
                    type: object
                    properties:
                      calibration:
                        type: object
                        properties:
                          checked: { type: integer }
                          notified: { type: integer }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  # ================= ASSET MAINTENANCE PLAN (Roadmap B2) =================
  /api/assets/maintenance-plans/calendar:
    get:
      tags: [Asset Maintenance Plan]
      summary: >-
        Lịch bảo trì theo tháng, xuyên suốt mọi asset (permission
        ASSET_MAINTENANCE_PLAN_VIEW) — Roadmap B2, 2026-09-15
      description: >
        Trả về TOÀN BỘ kế hoạch (mọi trạng thái — FE tự phân biệt qua
        `status`/`isOverdue`) có `scheduledDate` rơi trong tháng/năm chỉ
        định. KHÔNG department-scope theo ABAC (cùng nguyên tắc RBAC đơn
        giản của toàn domain Asset) — `department` là filter TUỲ CHỌN.
      parameters:
        - name: month
          in: query
          required: true
          schema: { type: integer, minimum: 1, maximum: 12 }
        - name: year
          in: query
          required: true
          schema: { type: integer, minimum: 2000, maximum: 2100 }
        - name: department
          in: query
          schema: { type: string, pattern: "^[0-9a-fA-F]{24}$" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/AssetMaintenancePlan" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/assets/maintenance-plans/asset/{assetId}:
    post:
      tags: [Asset Maintenance Plan]
      summary: Lên lịch bảo trì mới cho 1 tài sản (permission ASSET_MAINTENANCE_PLAN_CREATE)
      parameters:
        - name: assetId
          in: path
          required: true
          schema: { type: string, pattern: "^[0-9a-fA-F]{24}$" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, scheduledDate]
              properties:
                title: { type: string, minLength: 1 }
                description: { type: string }
                scheduledDate: { type: string, format: date-time }
      responses:
        "201":
          description: Tạo thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  data: { $ref: "#/components/schemas/AssetMaintenancePlan" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: Không tìm thấy tài sản/không active
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
    get:
      tags: [Asset Maintenance Plan]
      summary: Lịch sử kế hoạch bảo trì theo 1 tài sản (permission ASSET_MAINTENANCE_PLAN_VIEW)
      description: Có phân trang, sắp xếp mới nhất trước theo `scheduledDate`.
      parameters:
        - name: assetId
          in: path
          required: true
          schema: { type: string, pattern: "^[0-9a-fA-F]{24}$" }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, default: 20 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/AssetMaintenancePlan" }
                  pagination: { $ref: "#/components/schemas/PaginationMeta" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: Không tìm thấy tài sản
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /api/assets/maintenance-plans/{id}:
    put:
      tags: [Asset Maintenance Plan]
      summary: >-
        Sửa kế hoạch bảo trì CÒN "planned" (permission
        ASSET_MAINTENANCE_PLAN_UPDATE)
      description: >
        Không cho sửa kế hoạch đã "completed"/"cancelled" — giữ nguyên làm
        lịch sử. KHÔNG có field `status` trong request — đổi trạng thái
        CHỈ qua `/complete` hoặc `/cancel`.
      parameters: [{ $ref: "#/components/parameters/IdParam" }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string, minLength: 1 }
                description: { type: string }
                scheduledDate: { type: string, format: date-time }
      responses:
        "200":
          description: Cập nhật thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  data: { $ref: "#/components/schemas/AssetMaintenancePlan" }
        "400":
          description: ID không hợp lệ, hoặc kế hoạch đã completed/cancelled
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/assets/maintenance-plans/{id}/complete:
    patch:
      tags: [Asset Maintenance Plan]
      summary: Đánh dấu hoàn tất kế hoạch bảo trì (permission ASSET_MAINTENANCE_PLAN_UPDATE)
