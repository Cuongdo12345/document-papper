                  message: { type: string }
                  data: { $ref: "#/components/schemas/User" }
        "400":
          description: >
            Dữ liệu không hợp lệ, hoặc cố gán role ADMIN (không cho phép qua
            endpoint này), hoặc cố tự đổi role của chính mình.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
