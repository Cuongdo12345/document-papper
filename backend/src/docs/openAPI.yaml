          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ================= INVENTORY (Roadmap B3, 2026-09-15) =================
  /api/inventory/alerts/run:
    post:
      tags: [Inventory]
      summary: Chạy tay kiểm tra cảnh báo tồn kho thấp (permission CONSUMABLE_ALERTS_TRIGGER)
      description: Dùng để test/chạy thủ công ngoài lịch cron (08:15 hằng ngày) — mirror POST /api/assets/alerts/run.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  data:
                    type: object
                    properties:
                      lowStock:
                        type: object
                        properties:
                          checked: { type: integer }
                          notified: { type: integer }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/inventory/items:
    post:
      tags: [Inventory]
      summary: Tạo vật tư mới (permission CONSUMABLE_CREATE)
      description: >
        Nếu `initialQuantity` > 0, tự tạo kèm 1 giao dịch NHẬP "Tồn kho ban
        đầu" — `quantityOnHand` luôn khớp lịch sử giao dịch, không cho set
        thẳng.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, unit, department]
              properties:
                name: { type: string, minLength: 1 }
                unit: { type: string, minLength: 1, description: "Đơn vị tính: cái, hộp, gói..." }
                category: { type: string, pattern: "^[0-9a-fA-F]{24}$", description: "ID nhóm vật tư (ConsumableCategory) — tuỳ chọn." }
                department: { type: string, pattern: "^[0-9a-fA-F]{24}$" }
                minStockThreshold: { type: number, minimum: 0, default: 0 }
                initialQuantity: { type: number, minimum: 0, default: 0 }
      responses:
        "201":
          description: Tạo thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  data: { $ref: "#/components/schemas/ConsumableItem" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: Không tìm thấy phòng ban
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "409":
          description: Phòng ban đã có vật tư trùng tên
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
    get:
      tags: [Inventory]
      summary: Danh sách vật tư, phân trang (permission CONSUMABLE_VIEW)
      description: >
        Mặc định chỉ trả `isActive=true`. KHÔNG tự động giới hạn theo phòng
        ban của người gọi (cùng nguyên tắc RBAC đơn giản đã áp dụng cho
        domain Asset) — FE tự lọc `?department=` khi cần.
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, default: 20 }
        - name: search
          in: query
          schema: { type: string }
        - name: department
          in: query
          schema: { type: string, pattern: "^[0-9a-fA-F]{24}$" }
        - name: category
          in: query
          description: Lọc theo nhóm vật tư (ConsumableCategory id).
          schema: { type: string, pattern: "^[0-9a-fA-F]{24}$" }
        - name: isActive
          in: query
          schema: { type: boolean }
        - name: lowStockOnly
          in: query
          schema: { type: boolean }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/ConsumableItem" }
                  pagination: { $ref: "#/components/schemas/PaginationMeta" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  # [MỚI 2026-09-16, DEV-060] Xoá mềm hàng loạt — gọi lại PUT items/:id với
