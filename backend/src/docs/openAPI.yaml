        "403": { $ref: "#/components/responses/Forbidden" }

  /api/dashboard/weekly-report/run:
    post:
      tags: [Dashboard]
      summary: >-
        Chạy tay gửi "Báo cáo tuần" qua email (permission
        DASHBOARD_WEEKLY_REPORT_TRIGGER) — Roadmap B7, 2026-09-18
      description: >
        Bình thường chạy tự động qua cron (thứ Hai 08:30 hàng tuần, giờ
