      description: >
        DEV-011/IMP-016: trước đây endpoint này KHÔNG có authorization thật
        nào dù tài liệu đã mô tả "chỉ ADMIN" — nay bật lại đúng bằng
        `authorizePermission("PERFORMANCE_VIEW")`.
      parameters:
        - name: from
          in: query
          schema: { type: string, format: date }
