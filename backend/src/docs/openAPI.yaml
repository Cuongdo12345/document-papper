      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateDocumentRequest" }
      responses:
        "201":
          description: Tạo thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  message: { type: string }
                  data: { $ref: "#/components/schemas/Document" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/documents:
    get:
      tags: [Documents]
      summary: Danh sách Document (permission DOCUMENT_VIEW)
      description: >
        ⚠️ Sửa tài liệu (2026-09-10, DEV-040): permission thật là
        `DOCUMENT_VIEW` (không phải `DOCUMENT_READ` như ghi trước đây —
        không tồn tại trong `permission.constant.ts`). 2 lỗi logic từng ghi
        ở đây (filter `isActive` bị ép `true`, filter không whitelist field)
        ĐÃ ĐƯỢC SỬA từ trước (`getAllDocumentsService` đọc đúng biến
        `isActive`; filter dùng `buildDocumentFilter()` whitelist) — mô tả
        cũ không còn đúng hiện trạng, xoá bỏ.
        Department-scoping (DEV-030): non-ADMIN mặc định CHỈ thấy Document
        cùng phòng ban (query `department` client truyền bị GHI ĐÈ, không
        cho tự chọn khoa khác) — TRỪ khi có thêm permission
        `DOCUMENT_VIEW_ALL_DEPARTMENTS` (MỚI, DEV-040 — IT đã được gán) thì
        xem được TẤT CẢ phòng ban, đồng bộ `GET /documents/{id}` và
        `GET /documents/{proposalId}/reports` bên dưới.
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/LimitParam"
        - name: sortBy
          in: query
          schema:
            {
              type: string,
              enum:
                [
                  createdAt,
                  updatedAt,
                  title,
                  documentCode,
                  serviceDate,
                  actualCost,
                ],
              default: createdAt,
            }
        - $ref: "#/components/parameters/OrderParam"
        - $ref: "#/components/parameters/KeywordParam"
        - name: fullTextSearch
          in: query
          description: >
            [MỚI 2026-09-18, DEV-063, Roadmap B6] Tìm kiếm toàn văn qua MongoDB `$text`
            — khớp cả `title`/`documentCode` LẪN nội dung/ghi chú tự do trong `meta`
            (mô tả sự cố, ghi chú hạng mục, kết quả kiểm tra). TÁCH RIÊNG khỏi
            `keyword` (khớp chuỗi con `$regex` trên title/documentCode, giữ nguyên).
            Khi truyền field này, `sortBy`/`order` bị BỎ QUA — kết quả luôn sắp xếp
            theo mức độ liên quan (textScore).
          schema: { type: string, minLength: 2, maxLength: 200 }
        - name: isActive
          in: query
          schema: { type: string, enum: ["true", "false"] }
        - name: category
          in: query
          schema: { type: string, enum: [PROPOSAL, REPORT] }
        - name: subType
          in: query
          schema:
            {
              type: string,
              enum:
                [
                  PROPOSE_REPAIR,
                  PROPOSE_INK,
                  PROPOSE_PROCUREMENT,
                  CHECK_DAMAGE,
                  CONFIRM_STATUS,
                ],
            }
        - name: department
          in: query
          schema: { $ref: "#/components/schemas/ObjectIdRef" }
        - name: createdBy
          in: query
          schema: { $ref: "#/components/schemas/ObjectIdRef" }
        - name: relatedAsset
          in: query
          schema: { $ref: "#/components/schemas/ObjectIdRef" }
        - name: workflowStatus
          in: query
          schema:
            {
              type: string,
              enum: [pending, approved, rejected, cancelled, completed],
            }
        - name: fromDate
          in: query
          schema: { type: string, format: date }
        - name: toDate
          in: query
          schema: { type: string, format: date }
      responses:
        "200":
          description: Danh sách Document
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Document" }
                  pagination: { $ref: "#/components/schemas/PaginationMeta" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/documents/bulk-delete:
    post:
      tags: [Documents]
      summary: Xoá mềm hàng loạt (permission DOCUMENT_DELETE, chỉ ADMIN)
      description: >
        [MỚI 2026-09-17, DEV-061] Tái sử dụng nguyên vẹn `deleteDocumentService`
        cho từng id (guard ADMIN-only qua `isSystemRole`, chặn nếu còn biên bản
        tham chiếu hoặc workflow đang pending) — 1 item lỗi không chặn các item
        còn lại, xem `BulkDeleteResponse.data.failed`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BulkDeleteRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BulkDeleteResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/documents/bulk-restore:
    post:
      tags: [Documents]
      summary: Khôi phục hàng loạt (permission DOCUMENT_UPDATE, ADMIN hoặc người tạo)
      description: >
        [MỚI 2026-09-17, DEV-061] Tái sử dụng nguyên vẹn `restoreDocumentService`
        cho từng id (guard ADMIN-hoặc-chính-người-tạo qua `validateRestorePermission`).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BulkDeleteRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BulkDeleteResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/documents/{id}:
    get:
      tags: [Documents]
      summary: >-
        Chi tiết Document (permission DOCUMENT_VIEW_DETAIL HOẶC
        DOCUMENT_VIEW_ALL_DEPARTMENTS, hoặc 1 trong các Policy ABAC bên dưới)
      description: >
        RBAC `DOCUMENT_VIEW_DETAIL` đã bị bỏ khỏi hầu hết role thường
        (DEV-009A) — non-ADMIN xem chi tiết Document qua 1 trong 3 Policy
        ABAC dùng `resource: "document", action: "view_detail"` (OR với
        nhau, `loadDocument.middleware.ts` gắn field vào `req.resource`):
        (1) `document-view-detail-same-department` — cùng phòng ban;
        (2) `document-view-detail-pending-approver` — role người gọi khớp
        bước ĐANG chờ duyệt (workflow còn "pending"), DEV-034;
        (3) `document-view-detail-workflow-participant-role`
        (2026-09-10, DEV-038) — role người gọi từng có mặt ở BẤT KỲ bước nào
        của BẤT KỲ workflow nào gắn với document này, kể cả sau khi workflow
        đã kết thúc (approved/rejected/cancelled/completed) — sửa bug
        approver khác phòng ban không xem lại được document mình từng
        duyệt/từ chối qua tab "Lịch sử duyệt".
        (MỚI, 2026-09-10, DEV-040) — route chấp nhận permission
        `DOCUMENT_VIEW_DETAIL` HOẶC `DOCUMENT_VIEW_ALL_DEPARTMENTS` (RBAC
        thường, KHÔNG qua Policy — `authorizePermission([...], {...})` chỉ
        cần 1 trong 2 permission là pass ngay). IT được gán permission thứ 2
        (rolePermission.map.ts) nên xem được chi tiết Document CỦA MỌI
        phòng ban, không cần rơi vào 1 trong 3 Policy trên.
      parameters: [{ $ref: "#/components/parameters/IdParam" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  message: { type: string }
                  data: { $ref: "#/components/schemas/Document" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [Documents]
      summary: Cập nhật Document (permission DOCUMENT_UPDATE)
      description: >
        Chỉ `title`/`meta` thực sự có tác dụng (whitelist tầng service).
        Bị khoá nếu Document đã workflowStatus=approved, hoặc khác department
        của người gọi (trừ ADMIN).
      parameters: [{ $ref: "#/components/parameters/IdParam" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateDocumentRequest" }
      responses:
        "200":
          description: Cập nhật thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  message: { type: string }
                  data: { $ref: "#/components/schemas/Document" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Documents]
      summary: Xoá mềm Document (permission DOCUMENT_DELETE)
      parameters: [{ $ref: "#/components/parameters/IdParam" }]
      responses:
        "200":
          description: Xoá thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  message: { type: string }
                  data: { $ref: "#/components/schemas/ObjectIdRef" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/documents/{id}/versions:
    get:
      tags: [Documents]
      summary: >-
        Lịch sử phiên bản nội dung (title/meta) — Roadmap A4, 2026-09-15
        (permission/Policy giống hệt GET /documents/{id})
      description: >
        CHỦ Ý dùng ĐÚNG guard ABAC của `GET /documents/{id}` (department-scoping
        qua cùng 3 Policy) — lịch sử phiên bản lộ ra title/meta CŨ, cùng loại
        dữ liệu nhạy cảm như nội dung hiện tại, không có ngoại lệ riêng.
        CHỈ ĐỌC (không có endpoint restore) — mục đích kiểm toán, xem lại
        "trước khi sửa nó viết gì". KHÔNG trả về nội dung HIỆN TẠI (đã có ở
        `GET /documents/{id}`) — chỉ các bản ĐÃ BỊ thay thế, mới nhất trước.
        Mỗi bản ghi chỉ được tạo khi 1 lần `PUT /documents/{id}` THỰC SỰ đổi
        title/meta (không tạo bản ghi "rác" nếu gửi lại y hệt nội dung cũ).
      parameters: [{ $ref: "#/components/parameters/IdParam" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  message: { type: string }
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/DocumentVersion" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/documents/{id}/export-pdf:
    get:
      tags: [Documents]
      summary: >-
        Xuất PDF chính thức (Roadmap B5, 2026-09-18) — permission/Policy giống
        hệt GET /documents/{id}
      description: >
        Trả về file PDF (kèm tiêu đề đơn vị, nội dung theo subType, bảng phê
        duyệt lấy từ WorkflowInstance, và khối "xác thực nội bộ hệ thống").
        Dùng ĐÚNG guard của `GET /documents/{id}` — PDF chỉ là bản render
        khác của cùng dữ liệu chi tiết.


        ⚠️ Khối "xác thực" ở cuối PDF là ký NỘI BỘ (RSA, khoá riêng của hệ
        thống) nhằm đảm bảo tính toàn vẹn dữ liệu tại thời điểm xuất — KHÔNG
        PHẢI chữ ký số theo quy định pháp luật Việt Nam (không do tổ chức
        cung cấp dịch vụ chứng thực chữ ký số — CA — cấp). Mỗi lần gọi tạo 1
        bản ghi `DocumentPdfExport` mới (audit), xác minh lại qua
        `GET /documents/pdf-exports/{exportId}/verify`.
      parameters: [{ $ref: "#/components/parameters/IdParam" }]
      responses:
        "200":
          description: File PDF (application/pdf)
          content:
            application/pdf:
              schema: { type: string, format: binary }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/documents/pdf-exports/{exportId}/verify:
    get:
      tags: [Documents]
      summary: Xác minh 1 bản ghi "đã xuất PDF" (Roadmap B5, permission DOCUMENT_VIEW)
      description: >
        KHÔNG trả nội dung Document (chỉ `documentId` tham chiếu) — không cần
        ABAC department-scoping. Trả `valid=false` nếu bản ghi
        `contentHash`/`signature` không khớp khoá ký hệ thống hiện tại (dữ
        liệu bị chỉnh sửa trực tiếp trong DB sau khi xuất, hoặc khoá ký đã bị
        đổi).
      parameters:
        - name: exportId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  message: { type: string }
                  data:
                    type: object
                    properties:
                      valid: { type: boolean }
                      documentId: { type: string }
                      exportedBy: { type: string }
                      exportedAt: { type: string, format: date-time }
                      algorithm: { type: string }
                      disclaimer: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/documents/delete-by-month:
    delete:
      tags: [Documents]
      summary: Xoá mềm hàng loạt Document theo tháng/năm (permission DOCUMENT_DELETE + CHỈ ADMIN)
      description: >
        Soft-delete (isActive=false/deletedAt/deletedBy) — KHÔNG xoá vĩnh
        viễn dữ liệu (DEV-006). PROPOSAL vẫn còn REPORT active tham chiếu sẽ
        tự động bị loại khỏi batch (đồng bộ guard với `DELETE /documents/{id}`)
        — xem `data.skippedCount`.


        🔒 MỚI (DEV-044, 2026-09-12): ngoài permission `DOCUMENT_DELETE`
        (route-level), endpoint này giờ CHỈ CHO PHÉP ADMIN thật thực hiện —
        403 nếu người gọi không phải ADMIN (`role.isSystemRole===true ||
        role.name==="ADMIN"`), dù có permission `DOCUMENT_DELETE`. Trước đây
        endpoint này KHÔNG có ràng buộc này (khác `DELETE /documents/{id}`,
        xoá đơn lẻ đã yêu cầu ADMIN từ DEV-006) — bulk-delete có blast radius
        lớn hơn nhiều (cả tháng dữ liệu, mọi phòng ban) nên PHẢI cùng mức bảo
        vệ, không được lỏng hơn xoá đơn lẻ.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeleteByMonthRequest" }
      responses:
        "200":
          description: Xoá thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  message: { type: string }
                  data:
                    type: object
                    properties:
                      deletedCount: { type: integer }
                      skippedCount:
                        type: integer
                        description: >
                          Số PROPOSAL bị loại khỏi batch vì còn REPORT active
                          tham chiếu.
                    additionalProperties: true
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/documents/restore/{id}:
    patch:
      tags: [Documents]
      summary: Khôi phục Document đã xoá mềm (permission DOCUMENT_UPDATE)
      parameters: [{ $ref: "#/components/parameters/IdParam" }]
      responses:
        "200":
          description: Khôi phục thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  message: { type: string }
                  data: { $ref: "#/components/schemas/Document" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/documents/{proposalId}/reports:
    get:
      tags: [Documents]
      summary: Danh sách Report (biên bản) tham chiếu tới 1 Proposal (permission DOCUMENT_VIEW)
      description: >
        ⚠️ Sửa tài liệu (2026-09-10): permission thật là `DOCUMENT_VIEW`
        (không phải `DOCUMENT_READ` như ghi trước đây — không tồn tại trong
        `permission.constant.ts`). Ngoài permission còn có rule "cùng phòng
        ban" ở tầng SERVICE (DEV-030, không phải Policy ABAC) — 403 nếu
        proposal khác phòng ban người gọi, TRỪ khi: ADMIN, HOẶC (DEV-038)
        role người gọi từng có mặt ở bất kỳ bước nào của workflow gắn với
        proposal này (đồng bộ ngoại lệ với `GET /documents/{id}`), HOẶC
        (MỚI, DEV-040) người gọi có permission
        `DOCUMENT_VIEW_ALL_DEPARTMENTS` (IT đã được gán).
      parameters:
        - name: proposalId
          in: path
          required: true
          schema: { type: string, pattern: "^[0-9a-fA-F]{24}$" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  message: { type: string }
                  data:
                    type: object
                    properties:
                      proposal: { $ref: "#/components/schemas/Document" }
                      totalReports: { type: integer }
                      reports:
                        type: array
                        items: { $ref: "#/components/schemas/Document" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ================= WORKFLOW =================
  /api/workflows/templates:
    post:
      tags: [Workflow]
      summary: Tạo workflow template (permission WORKFLOW_TEMPLATE_CREATE)
      description: >
        ⚠️ Sửa tài liệu (2026-09-10): ghi chú trước đây "route /api/workflows/*
        CHƯA gắn authorizePermission" đã LỖI THỜI — mọi route trong nhóm này
        đều đã có `authorizePermission` (xác nhận trực tiếp `workflow.routes.ts`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              { $ref: "#/components/schemas/CreateWorkflowTemplateRequest" }
      responses:
        "201":
          description: Tạo thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  message: { type: string }
                  data: { $ref: "#/components/schemas/WorkflowTemplate" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/workflows/submit:
    post:
      tags: [Workflow]
      summary: Gắn 1 Document vào workflow template để bắt đầu luồng duyệt (permission WORKFLOW_SUBMIT)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SubmitWorkflowRequest" }
      responses:
        "200":
          description: Submit thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  message: { type: string }
                  data: { $ref: "#/components/schemas/WorkflowInstance" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/workflows/pending:
    get:
      tags: [Workflow]
      summary: Danh sách workflow đang chờ duyệt cho role của user hiện tại (permission WORKFLOW_VIEW)
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, default: 10 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  message: { type: string }
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/WorkflowInstance" }
                  pagination: { $ref: "#/components/schemas/PaginationMeta" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/workflows/history:
    get:
      tags: [Workflow]
      summary: Lịch sử duyệt (permission WORKFLOW_VIEW)
      description: >
        MỚI (2026-09-10). Khác `/pending` ở 2 điểm: (1) khớp BẤT KỲ phần tử
        nào trong `steps[]` có `role` trùng role người gọi — không chỉ
        `steps[currentStep]` — nên hiển thị TOÀN BỘ workflow mà role này
        từng/đang phải xử lý, kể cả đã đi qua bước của role đó rồi chuyển
        tiếp, hoặc đã kết thúc (approved/rejected/cancelled/completed);
        (2) không hard-code `status:"pending"`, nhận filter `status` tuỳ
        chọn. Sort `createdAt` GIẢM DẦN (mới nhất trước) — ngược `/pending`
        (tăng dần, ưu tiên việc chờ lâu nhất). ADMIN xem TOÀN BỘ lịch sử,
        không lọc theo role (khác `/pending`, nơi ADMIN luôn thấy danh sách
        rỗng vì không bước nào có `role:"ADMIN"` — hành vi CŨ giữ nguyên,
        không sửa).
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 10 }
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, approved, rejected, cancelled, completed]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  message: { type: string }
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/WorkflowInstance" }
                  pagination: { $ref: "#/components/schemas/PaginationMeta" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/workflows/document/{documentId}:
    get:
      tags: [Workflow]
      summary: Lấy workflow instance theo Document (permission WORKFLOW_VIEW)
      parameters:
        - name: documentId
          in: path
          required: true
          schema: { type: string, pattern: "^[0-9a-fA-F]{24}$" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  message: { type: string }
                  data: { $ref: "#/components/schemas/WorkflowInstance" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/workflows/{id}:
    get:
      tags: [Workflow]
      summary: Chi tiết workflow instance (permission WORKFLOW_VIEW)
      parameters: [{ $ref: "#/components/parameters/IdParam" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  message: { type: string }
                  data: { $ref: "#/components/schemas/WorkflowInstance" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/workflows/{id}/approve:
    post:
      tags: [Workflow]
      summary: Duyệt bước hiện tại (permission WORKFLOW_APPROVE; role người gọi phải khớp step.role, trừ ADMIN)
      description: >
        MỚI (2026-09-10, DEV-038 đề xuất #2): ADMIN được phép "duyệt thay"
        một bước dù role của ADMIN không khớp `step.role` — trước đây NGAY
        CẢ ADMIN cũng bị 403, khiến workflow kẹt vĩnh viễn nếu toàn bộ user
        mang role yêu cầu đều bị vô hiệu hoá/nghỉ việc. `step.approvedBy`
        vẫn lưu ĐÚNG user ADMIN thực hiện; `step.comment` tự động gắn tiền
        tố `[ADMIN duyệt thay role "X"]` để audit trail minh bạch, phân
        biệt rõ với duyệt thường.
      parameters: [{ $ref: "#/components/parameters/IdParam" }]
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ApproveRejectBody" }
      responses:
        "200":
          description: Duyệt thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  message: { type: string }
                  data: { $ref: "#/components/schemas/WorkflowInstance" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/workflows/{id}/reject:
    post:
      tags: [Workflow]
      summary: Từ chối bước hiện tại (permission WORKFLOW_REJECT; role người gọi phải khớp step.role, trừ ADMIN)
      description: >
        MỚI (2026-09-10, DEV-038 đề xuất #2): ADMIN được phép "từ chối thay"
        — cùng cơ chế override với `/approve` (xem mô tả đầy đủ ở đó).
      parameters: [{ $ref: "#/components/parameters/IdParam" }]
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ApproveRejectBody" }
      responses:
        "200":
          description: Từ chối thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  message: { type: string }
                  data: { $ref: "#/components/schemas/WorkflowInstance" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/workflows/{id}/cancel:
    post:
      tags: [Workflow]
      summary: Huỷ workflow (permission WORKFLOW_CANCEL; chỉ người tạo Document, trước khi có bước nào được duyệt)
      parameters: [{ $ref: "#/components/parameters/IdParam" }]
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ApproveRejectBody" }
      responses:
        "200":
          description: Huỷ thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  message: { type: string }
                  data: { $ref: "#/components/schemas/WorkflowInstance" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ================= ASSETS =================
  /api/assets:
    post:
      tags: [Assets]
      summary: Tạo tài sản mới (permission ASSET_CREATE)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateAssetRequest" }
      responses:
        "201":
          description: Tạo thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  data: { $ref: "#/components/schemas/Asset" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    get:
      tags: [Assets]
      summary: Danh sách tài sản (permission ASSET_VIEW)
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, default: 10 }
        - $ref: "#/components/parameters/KeywordParam"
        - name: department
          in: query
          schema: { $ref: "#/components/schemas/ObjectIdRef" }
        - name: category
          in: query
          schema: { $ref: "#/components/schemas/ObjectIdRef" }
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/AssetStatus" }
        - name: sortBy
          in: query
          schema: { type: string, default: createdAt }
        - $ref: "#/components/parameters/OrderParam"
      responses:
        "200":
          description: Danh sách tài sản
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Asset" }
                  pagination: { $ref: "#/components/schemas/PaginationMeta" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/assets/export:
    get:
      tags: [Assets]
      summary: Export danh sách tài sản ra file Excel (streaming) (permission ASSET_EXCEL_EXPORT)
      description: >
        ⚠️ GHI CHÚ TỪ REVIEW: route này BẮT BUỘC phải đăng ký TRƯỚC
        `GET /:id` trong Express — nếu đặt sau, `GET /assets/export` sẽ bị
        `GET /:id` "nuốt" mất (hiểu `id="export"`), route export sẽ không
        bao giờ được gọi tới mà không báo lỗi gì. Đã xác nhận thứ tự đăng
        ký trong route file là đúng (source tự ghi chú lại lỗi này đã từng
        xảy ra ở bản đầu tiên). ĐÃ XÁC NHẬN LẠI: permission
        `ASSET_EXCEL_EXPORT` có trong `permission.constant.ts` (verify từ
        source cập nhật) — không còn nghi vấn mismatch như ghi chú review
        trước đây.
      parameters:
        - name: department
          in: query
          schema: { $ref: "#/components/schemas/ObjectIdRef" }
        - name: category
          in: query
          schema: { $ref: "#/components/schemas/ObjectIdRef" }
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/AssetStatus" }
        - $ref: "#/components/parameters/KeywordParam"
      responses:
        "200":
          description: File Excel (.xlsx) — streamed
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { type: string, format: binary }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

