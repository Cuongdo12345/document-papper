        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/users/sessions:
    get:
      tags: [Users]
      summary: Admin xem TẤT CẢ phiên đăng nhập còn hiệu lực của MỌI user (permission SESSION_VIEW_ALL)
      description: >
        [MỚI 2026-09-19, Roadmap C3, DEV-070] Danh sách tổng hợp cross-user
        (khác `GET /users/{id}/sessions` chỉ scope 1 user) — dùng LẠI
        permission `SESSION_VIEW_ALL` (không tạo permission mới). Mỗi phần tử
        `Session` ở đây LUÔN có field `user` (đã populate `_id`/`username`/
        `fullName`) để client gọi lại `DELETE /users/{id}/sessions/{sessionId}`
        sẵn có khi cần thu hồi — route này KHÔNG có endpoint revoke riêng.
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: search
          in: query
          description: Lọc theo username/fullName của user sở hữu phiên (không phân biệt hoa thường).
          schema: { type: string, maxLength: 100 }
      responses:
        "200":
          description: Danh sách phiên đăng nhập của toàn hệ thống
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: boolean }
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Session" }
                  pagination: { $ref: "#/components/schemas/PaginationMeta" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/users/{id}/sessions:
    get:
      tags: [Users]
      summary: Admin xem danh sách phiên đăng nhập của 1 user khác (permission SESSION_VIEW_ALL)
      description: >
        [MỚI 2026-09-19, Roadmap C2, DEV-069] KHÔNG có field `isCurrent`
        trong response (khác `GET /auths/sessions` self-service) — ADMIN xem
        HỘ, không phải phiên của chính họ. `SESSION_VIEW_ALL` KHÔNG gán cho
        role nào trong `rolePermission.map.ts`, chỉ ADMIN có (mirror
        `USER_RESET_2FA`).
      parameters: [{ $ref: "#/components/parameters/IdParam" }]
      responses:
        "200":
          description: Danh sách phiên đăng nhập
          content:
            application/json:
              schema:
