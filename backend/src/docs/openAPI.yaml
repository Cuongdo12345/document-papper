        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/inventory/categories/{id}/restore:
    patch:
      tags: [Inventory]
      summary: Khôi phục nhóm vật tư đã soft-delete (permission CONSUMABLE_CATEGORY_UPDATE)
      parameters: [{ $ref: "#/components/parameters/IdParam" }]
      responses:
        "200":
          description: Khôi phục thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  data: { $ref: "#/components/schemas/ConsumableCategory" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ============ ĐỀ XUẤT/DỰ TRÙ VẬT TƯ (ConsumableRequest, Roadmap B8, DEV-067, 2026-09-18) ============
  # KHÔNG có luồng duyệt (user xác nhận trước khi làm) — chỉ CREATE/VIEW/UPDATE
  # (sửa khi PENDING + huỷ) và FULFILL riêng (đánh dấu đã mua thực tế).
  /api/inventory/requests:
    post:
      tags: [Inventory]
      summary: Ghi nhận đề xuất/dự trù vật tư mới (permission CONSUMABLE_REQUEST_CREATE)
      description: >
        Mỗi item PHẢI thuộc ĐÚNG `department` của request (validate ở service) —
        không đề xuất được vật tư của khoa/phòng khác. `totalPrice`/`totalAmount`
        được BACKEND tự tính, không nhận từ client.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateConsumableRequestRequest" }
      responses:
        "201":
          description: Tạo thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  data: { $ref: "#/components/schemas/ConsumableRequest" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    get:
      tags: [Inventory]
      summary: Danh sách đề xuất/dự trù vật tư (permission CONSUMABLE_REQUEST_VIEW)
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, default: 20 }
        - name: department
          in: query
          schema: { $ref: "#/components/schemas/ObjectIdRef" }
        - name: status
          in: query
          schema: { type: string, enum: [PENDING, FULFILLED, CANCELLED] }
        - name: requestMonth
          in: query
          schema: { type: string, pattern: "^\\d{4}-(0[1-9]|1[0-2])$" }
      responses:
        "200":
          description: Danh sách đề xuất
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/ConsumableRequest" }
                  pagination: { $ref: "#/components/schemas/PaginationMeta" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/inventory/requests/{id}:
    get:
      tags: [Inventory]
      summary: Chi tiết đề xuất/dự trù vật tư (permission CONSUMABLE_REQUEST_VIEW)
      parameters: [{ $ref: "#/components/parameters/IdParam" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  data: { $ref: "#/components/schemas/ConsumableRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [Inventory]
      summary: Sửa đề xuất (permission CONSUMABLE_REQUEST_UPDATE)
      description: Chỉ sửa được khi đề xuất đang ở trạng thái `PENDING` — 400 nếu đã `FULFILLED`/`CANCELLED`.
      parameters: [{ $ref: "#/components/parameters/IdParam" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateConsumableRequestRequest" }
      responses:
        "200":
          description: Cập nhật thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  data: { $ref: "#/components/schemas/ConsumableRequest" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/inventory/requests/{id}/fulfill:
    patch:
      tags: [Inventory]
      summary: Đánh dấu đề xuất đã mua xong thực tế (permission CONSUMABLE_REQUEST_FULFILL)
      description: >
        Thao tác TAY của Phòng Vật tư-TTB/IT sau khi mua thực tế — KHÔNG tự động
        tạo giao dịch nhập kho (`ConsumableTransaction`), vẫn phải nhập tay riêng
        qua `POST /api/inventory/items/{id}/transactions` (số lượng/ngày mua thực
        tế có thể khác đề xuất ban đầu). Chỉ áp dụng được khi đang `PENDING`.
      parameters: [{ $ref: "#/components/parameters/IdParam" }]
      responses:
        "200":
          description: Đã đánh dấu FULFILLED
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  data: { $ref: "#/components/schemas/ConsumableRequest" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/inventory/requests/{id}/cancel:
    patch:
      tags: [Inventory]
      summary: Huỷ đề xuất (permission CONSUMABLE_REQUEST_UPDATE)
      description: Chỉ huỷ được khi đang `PENDING`. Giữ lại bản ghi (không xoá cứng).
      parameters: [{ $ref: "#/components/parameters/IdParam" }]
      responses:
        "200":
          description: Đã huỷ
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  data: { $ref: "#/components/schemas/ConsumableRequest" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ================= VENDORS (Roadmap B4, 2026-09-16) =================
  /api/vendors:
    post:
      tags: [Vendors]
      summary: Tạo nhà cung cấp mới (permission VENDOR_CREATE)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1 }
                contactPerson: { type: string }
                phone: { type: string }
                email: { type: string, format: email }
                address: { type: string }
                taxCode: { type: string }
                notes: { type: string }
      responses:
        "201":
          description: Tạo thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  data: { $ref: "#/components/schemas/Vendor" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    get:
      tags: [Vendors]
      summary: Danh sách nhà cung cấp, phân trang (permission VENDOR_VIEW)
      description: Mặc định chỉ trả `isActive=true`.
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, default: 20 }
        - name: search
          in: query
          schema: { type: string }
        - name: isActive
          in: query
          schema: { type: boolean }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Vendor" }
                  pagination: { $ref: "#/components/schemas/PaginationMeta" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  # [MỚI 2026-09-16, DEV-060] Xoá mềm hàng loạt — gọi lại PUT /:id với
  # isActive=false cho từng id (nhà cung cấp không có delete service riêng),
  # permission VENDOR_UPDATE y hệt PUT /:id.
  /api/vendors/bulk-delete:
