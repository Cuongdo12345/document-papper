        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/LimitParam"
        - name: action
          in: query
          description: 1 giá trị, hoặc nhiều giá trị cách nhau bởi dấu phẩy (vd LOGIN,LOGOUT)
          schema: { type: string }
        - name: performedBy
          in: query
          schema: { $ref: "#/components/schemas/ObjectIdRef" }
        - name: user
          in: query
          schema: { $ref: "#/components/schemas/ObjectIdRef" }
        - name: fromDate
          in: query
          schema: { type: string, format: date }
        - name: toDate
          in: query
          schema: { type: string, format: date }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/UserAudit" }
                  pagination: { $ref: "#/components/schemas/PaginationMeta" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/user-audits/export:
